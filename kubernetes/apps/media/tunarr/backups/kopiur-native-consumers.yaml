# Native original qualification is complete. The failed one-shot verifier Jobs
# are retired; retain deny-all policies and every original recovery PVC/recipe.
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tunarr-frozen-native-nas
spec:
  podSelector:
    matchLabels:
      recovery.kopiur.home.arpa/role: tunarr-frozen-native-nas
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tunarr-frozen-native-r2
spec:
  podSelector:
    matchLabels:
      recovery.kopiur.home.arpa/role: tunarr-frozen-native-r2
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
