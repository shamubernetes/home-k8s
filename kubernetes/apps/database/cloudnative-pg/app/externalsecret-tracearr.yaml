# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr-database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: tracearr-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "{{ .TRACEARR_POSTGRES_USER }}"
        password: "{{ .TRACEARR_POSTGRES_PASSWORD }}"
  data:
  - secretKey: TRACEARR_POSTGRES_USER
    remoteRef:
      key: tracearr
      property: TRACEARR_POSTGRES_USER
  - secretKey: TRACEARR_POSTGRES_PASSWORD
    remoteRef:
      key: tracearr
      property: TRACEARR_POSTGRES_PASSWORD
