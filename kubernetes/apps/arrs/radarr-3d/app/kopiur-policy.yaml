apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: radarr-3d
  annotations:
    kopiur.home.arpa/original-native-recovery: https://github.com/shamubernetes/home-k8s/actions/runs/38007145735
spec:
  # Independent original production NAS/R2 native recovery passed before activation.
  suspend: false
  repository:
    kind: Repository
    name: radarr-3d-nas-smb
  identity:
    username: radarr-3d
    hostname: arrs
  sources:
  - pvc:
      name: radarr-3d
    sourcePathOverride: /pvc/radarr-3d
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  staging:
    timeout: 10m
    storageClassName: ceph-block
    accessModes:
    - ReadWriteOnce
  defaultDeletionPolicy: Retain
  hooks:
    beforeSnapshot:
    - workloadExec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: radarr-3d
            app.kubernetes.io/controller: radarr3d
        container: kopiur-postgres
        command: [timeout, "600", sh, /kopiur/capture.sh]
        timeout: 11m
        continueOnFailure: false
  mover:
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
  verification:
    quick:
      schedule:
        cron: "45 8 * * *"
        jitter: 30m
      parallel: 4
      fileParallelism: 2
      maxErrors: 0
    deep:
      schedule:
        cron: "45 9 * * 0"
        jitter: 1h
      capacity: 15Gi
      storageClassName: ceph-block
      parallel: 2
    successExpr: "stats.files > 0 && stats.errors == 0"
    verifyFilesPercent: 100
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: radarr-3d-daily
spec:
  policyRef:
    name: radarr-3d
  schedule:
    suspend: true
    cron: "45 1 * * *"
    jitter: 10m
    runOnCreate: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: radarr-3d-primary
spec:
  policyRef:
    name: radarr-3d
  schedule:
    suspend: false
    # Preserve the incumbent primary cadence; keep the draft daily lane suspended.
    cron: "${VOLSYNC_SCHEDULE_RADARR_3D}"
    jitter: 10m
    runOnCreate: true
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: radarr-3d-nas-to-r2
  annotations:
    # Copy the actual schedule-owned NAS point after its successful capture.
    kopiur.home-operations.com/run-requested: "2026-10-10T00:14:51Z"
spec:
  sourceRef:
    kind: Repository
    name: radarr-3d-nas-smb
  destinationRef:
    kind: Repository
    name: radarr-3d-r2
  schedule:
    cron: "${VOLSYNC_R2_SCHEDULE_RADARR_3D}"
    jitter: 10m
  selection:
    identities:
      include:
      - username: radarr-3d
        hostname: arrs
        sourcePath: /pvc/radarr-3d
    latestOnly: false
  migrate:
    parallel: 2
    policies: none
  pruning:
    none: {}
  # Original native proof and the first primary-schedule capture succeeded.
  suspend: false
