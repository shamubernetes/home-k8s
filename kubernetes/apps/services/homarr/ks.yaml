# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app homarr
  namespace: "${KS_NAMESPACE}"
spec:
  targetNamespace: &namespace services
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
  - name: external-secrets-secret-store
  - name: kopiur
  - name: rook-ceph-cluster
  - name: snapshot-controller
  path: ./kubernetes/apps/services/homarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: false
  # Kopiur 0.10.0 leaves SnapshotReplication observedGeneration stale after
  # schedule-only updates, so do not gate Flux readiness on that resource.
  # Replication alerts and drills verify phase, Ready, and latest-run counters.
  healthChecks:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    name: homarr-kopiur-nas
    namespace: services
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    name: homarr-kopiur-r2
    namespace: services
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Repository
    name: homarr-nas
    namespace: services
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Repository
    name: homarr-r2
    namespace: services
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: SnapshotPolicy
    name: homarr
    namespace: services
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: SnapshotSchedule
    name: homarr-daily
    namespace: services
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: "${KS_TIMEOUT}"
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 1Gi
