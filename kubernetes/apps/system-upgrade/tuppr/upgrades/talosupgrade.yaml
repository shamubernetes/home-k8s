# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: k8s-rhea
  talos:
    # renovate: datasource=github-releases depName=siderolabs/talos
    version: v1.14.0
  policy:
    placement: hard
    rebootMode: powercycle
    waitForVolumeDetach: true
  healthChecks:
  - apiVersion: volsync.backube/v1alpha1
    kind: ReplicationSource
    expr: |-
      status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
  - apiVersion: ceph.rook.io/v1
    kind: CephCluster
    expr: |-
      status.ceph.health in ['HEALTH_OK']
  - apiVersion: apps/v1
    kind: Deployment
    name: plex
    namespace: media
    description: Plex is intentionally stopped for supervised maintenance
    expr: |-
      object.spec.replicas == 0 && object.status.observedGeneration == object.metadata.generation && (!has(object.status.replicas) || object.status.replicas == 0) && (!has(object.status.availableReplicas) || object.status.availableReplicas == 0)
