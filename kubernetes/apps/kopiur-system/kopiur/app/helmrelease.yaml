# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kopiur
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      strategy: rollback
      retries: 3
  # Recreate preserves one writer until upstream election fails closed.
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: kopiur-controller
        patch: |-
          - op: add
            path: /spec/strategy
            value:
              type: Recreate
      # Info alerts are intentionally null-routed. Capture gates need investigation.
      - target:
          group: monitoring.coreos.com
          version: v1
          kind: PrometheusRule
          name: kopiur-controller
        patch: |-
          - op: test
            path: /spec/groups/0/rules/11/alert
            value: KopiurSnapshotsGated
          - op: replace
            path: /spec/groups/0/rules/11/labels/severity
            value: warning
      # The completed original remains recoverable, but is not recurring protection.
      # Keep failures visible, and never exempt the active daily radarr policy.
      - target:
          group: monitoring.coreos.com
          version: v1
          kind: PrometheusRule
          name: kopiur-controller
        patch: |-
          - op: test
            path: /spec/groups/0/rules/1/alert
            value: KopiurBackupStale
          - op: replace
            path: /spec/groups/0/rules/1/expr
            value: >-
              (
                (time() - kopiur_policy_last_backup_success_timestamp_seconds > 604800)
                or
                (
                  label_replace(kopiur_snapshot_consecutive_failures, "policy", "$1", "name", "(.*)") > 0
                  unless on (namespace, policy, repository) kopiur_policy_last_backup_success_timestamp_seconds
                )
              )
              unless on (namespace, policy)
              (
                (kopiur_snapshotpolicy_last_backup_success{namespace="arrs",policy="radarr-k8s92-original"} == 1)
                or
                (
                  (kopiur_snapshotpolicy_last_backup_success{namespace="home-assistant",policy="home-assistant-native"} == 1)
                  and on (namespace)
                  (
                    count by (namespace) (
                      time() - kopiur_policy_last_backup_success_timestamp_seconds{namespace="home-assistant",policy=~"home-assistant-native-(bundle|config|git)"} <= 604800
                    ) == 3
                  )
                )
              )
  values:
    installScope: cluster
    # 0.10.10 continues reconciling without election after a Lease 403.
    # Keep one writer until upstream fails closed; webhook HA is unchanged.
    replicaCount: 1
    priorityClassName: system-cluster-critical
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: kopiur
          app.kubernetes.io/component: controller
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        backupStaleAfterSeconds: 604800
    webhook:
      enabled: true
      replicaCount: 2
      priorityClassName: system-cluster-critical
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: kopiur
            app.kubernetes.io/component: webhook
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      serviceMonitor:
        enabled: true
