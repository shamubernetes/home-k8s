apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: sonarr
  annotations:
    kopiur.home.arpa/original-native-recovery: https://github.com/shamubernetes/home-k8s/actions/runs/38018173473
spec:
  # Independent original production NAS/R2 native recovery passed before activation.
  suspend: false
  repository:
    kind: Repository
    name: sonarr-nas-smb
  identity:
    username: sonarr
    hostname: arrs
  sources:
  - pvc:
      name: sonarr
    sourcePathOverride: /pvc/sonarr
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  staging:
    timeout: 10m
    storageClassName: ceph-block
    accessModes:
    - ReadWriteOnce
  defaultDeletionPolicy: Retain
  hooks:
    beforeSnapshot:
    - workloadExec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: sonarr
            app.kubernetes.io/controller: sonarr
        container: kopiur-postgres
        command: [sh, /kopiur/recurring-capture.sh]
        # Existing bounded protocol: 120s acknowledgement, 600s capture, 30s escalation.
        timeout: 13m
        continueOnFailure: false
  mover:
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
  verification:
    quick:
      schedule:
        cron: "45 8 * * *"
        jitter: 30m
      parallel: 4
      fileParallelism: 2
      maxErrors: 0
    deep:
      schedule:
        cron: "45 9 * * 0"
        jitter: 1h
      capacity: 15Gi
      storageClassName: ceph-block
      parallel: 2
    successExpr: "stats.files > 0 && stats.errors == 0"
    verifyFilesPercent: 100
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: sonarr-daily
spec:
  policyRef:
    name: sonarr
  schedule:
    suspend: true
    cron: "45 1 * * *"
    jitter: 10m
    runOnCreate: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: sonarr-primary
spec:
  policyRef:
    name: sonarr
  schedule:
    suspend: false
    # Preserve incumbent primary cadence; keep draft daily lane suspended.
    cron: "${VOLSYNC_SCHEDULE_SONARR}"
    jitter: 10m
    runOnCreate: true
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: sonarr-nas-to-r2
  annotations:
    kopiur.home.arpa/awaiting-first-scheduled-point: "true"
spec:
  sourceRef:
    kind: Repository
    name: sonarr-nas-smb
  destinationRef:
    kind: Repository
    name: sonarr-r2
  schedule:
    cron: "${VOLSYNC_R2_SCHEDULE_SONARR}"
    jitter: 10m
  selection:
    identities:
      include:
      - username: sonarr
        hostname: arrs
        sourcePath: /pvc/sonarr
    latestOnly: false
  migrate:
    parallel: 2
    policies: none
  pruning:
    none: {}
  suspend: true
