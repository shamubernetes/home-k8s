# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/job-batch-v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: bazarr-kopiur-scoped-grants-v2
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    k8s92.phase: backup-identities
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazarr-kopiur-scoped-grants
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: grants
        image: docker.io/library/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        command:
        - sh
        - -ec
        args:
        - |
          # Credentials stay in environment/stdin. Never print SQL diagnostics.
          admin_password=$PGPASSWORD
          for PGDATABASE in $PGDATABASES; do
            export PGDATABASE PGUSER=postgres PGPASSWORD="$admin_password"
            if ! psql -X -w -q -v ON_ERROR_STOP=1 -c "SET log_min_error_statement = panic" -f /grants/bazarr.sql >/dev/null 2>/dev/null; then
              printf 'scoped backup grant provisioning failed; diagnostics withheld\n' >&2
              exit 1
            fi
            export PGUSER="$BACKUP_USER" PGPASSWORD="$BACKUP_PASSWORD"
            if ! psql -X -w -q -v ON_ERROR_STOP=1 -c 'SELECT current_user;' >/dev/null 2>/dev/null; then
              printf 'backup identity connection readback failed\n' >&2
              exit 1
            fi
          done
          printf 'scoped backup roles and TLS connections verified\n'
        env:
        - name: PGHOST
          value: postgres17-rw.database.svc.cluster.local
        - name: PGPORT
          value: '5432'
        - name: PGDATABASES
          value: bazarr
        - name: PGSSLMODE
          value: require
        - name: PGCONNECT_TIMEOUT
          value: '10'
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: bazarr-secret
              key: INIT_POSTGRES_SUPER_PASS
        - name: APPLICATION_OWNER
          valueFrom:
            secretKeyRef:
              name: bazarr-secret
              key: INIT_POSTGRES_USER
        - name: BACKUP_USER
          valueFrom:
            secretKeyRef:
              name: bazarr-kopiur-grant-identity
              key: PGUSER
        - name: BACKUP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bazarr-kopiur-grant-identity
              key: PGPASSWORD
        - name: APPLICATION_NAME
          value: bazarr
        - name: HOME
          value: /tmp
        - name: TMPDIR
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: grants
          mountPath: /grants
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: grants
        configMap:
          name: kopiur-backup-identity-grants
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 8Mi
---
