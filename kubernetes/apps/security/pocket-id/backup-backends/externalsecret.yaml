apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-kopiur-nas
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: pocket-id-kopiur-nas
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        KOPIA_PASSWORD: '{{ .NAS_KOPIA_PASSWORD }}'
        KOPIA_RCLONE_CONFIG: '{{ .NAS_RCLONE_CONFIG }}'
  dataFrom:
    - extract:
        key: kopiur-pocket-id

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-kopiur-r2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: pocket-id-kopiur-r2
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        KOPIA_PASSWORD: '{{ .R2_KOPIA_PASSWORD }}'
        AWS_ACCESS_KEY_ID: '{{ .R2_ACCESS_KEY_ID }}'
        AWS_SECRET_ACCESS_KEY: '{{ .R2_SECRET_ACCESS_KEY }}'
  dataFrom:
    - extract:
        key: kopiur-pocket-id
