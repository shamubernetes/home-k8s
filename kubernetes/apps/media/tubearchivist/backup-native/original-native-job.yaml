apiVersion: batch/v1
kind: Job
metadata:
  name: tubearchivist-k92-native-originals
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  # Original recovery passed; image updates must not replay the retained proof.
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tubearchivist-k92-native-originals
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      initContainers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.19.24@sha256:d6dfe6626d645cfec66e91009aca60c6c1bb6f94d34253528f24d8cea2f94ba6
          restartPolicy: Always
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: -Xms512m -Xmx512m
            - name: node.store.allow_mmap
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: es
              mountPath: /usr/share/elasticsearch/data
      containers:
        - name: verify
          image: ghcr.io/home-operations/home-assistant:2026.11.1@sha256:c129b1e4190273254d93d413fe2a083233c9202d84cb08f84dddb01861df432e
          command:
            - python
            - /scripts/original-native.py
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - DAC_OVERRIDE
              drop:
                - ALL
            runAsUser: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: nas
              mountPath: /original/nas
              readOnly: true
            - name: r2
              mountPath: /original/r2
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: nas
          persistentVolumeClaim:
            claimName: tubearchivist-k92-original-nas
            readOnly: true
        - name: r2
          persistentVolumeClaim:
            claimName: tubearchivist-k92-original-r2
            readOnly: true
        - name: scripts
          configMap:
            name: tubearchivist-native-capture
        - name: es
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tubearchivist-k92-native-originals
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tubearchivist-k92-native-originals
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
