apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: pocket-id-native-daily
spec:
  policyRef:
    name: pocket-id-native
  schedule:
    suspend: false
    cron: 20 19 * * *
    timezone: America/New_York
    jitter: 0s
    runOnCreate: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
