# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-kopiur-nas
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: home-assistant-kopiur-nas
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        KOPIA_PASSWORD: "{{ .NAS_KOPIA_PASSWORD }}"
        KOPIA_RCLONE_CONFIG: "{{ .NAS_RCLONE_CONFIG }}"
  dataFrom:
    - extract:
        key: kopiur-home-assistant
---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-kopiur-r2
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: home-assistant-kopiur-r2
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        KOPIA_PASSWORD: "{{ .R2_KOPIA_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .R2_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .R2_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: kopiur-home-assistant
