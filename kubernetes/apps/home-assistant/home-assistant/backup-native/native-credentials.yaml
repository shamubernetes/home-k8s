# Only purpose-specific native backup credentials, never the operator token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-kopiur-postgres
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: home-assistant-kopiur-postgres
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        PGUSER: "{{ .PGUSER }}"
        PGPASSWORD: "{{ .PGPASSWORD }}"
        PGDATABASE: "{{ .PGDATABASE }}"
  dataFrom:
    - extract:
        key: kopiur-home-assistant
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-kopiur-api
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: home-assistant-kopiur-api
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        token: "{{ .HA_TOKEN }}"
  dataFrom:
    - extract:
        key: kopiur-home-assistant
