# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/serviceaccount-v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubewings
  namespace: services
---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/role-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubewings-runtime
  namespace: kubewings-mvp
rules:
- apiGroups:
  - kubewings.maudeco.de
  resources:
  - kubegameservers
  - kubegameserveroperations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kubewings.maudeco.de
  resources:
  - kubegameservers/status
  - kubegameserveroperations/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/rolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubewings-runtime
  namespace: kubewings-mvp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubewings-runtime
subjects:
- kind: ServiceAccount
  name: kubewings
  namespace: services
