apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: cwa-bdl-nas-smb
spec:
  backend:
    rclone:
      remotePath: mnemosyne:Backups/kopiur/cwa-bdl-smb
      configSecretRef:
        name: cwa-bdl-kopiur-nas
      startupTimeout: 2m
  encryption:
    passwordSecretRef:
      name: cwa-bdl-kopiur-nas
      key: KOPIA_PASSWORD
  create:
    enabled: true
  scheduleDefaults:
    timezone: America/New_York
  deletionProtection:
    threshold: 10
  health:
    probe:
      enabled: true
      interval: 5m
      failureThreshold: 3
      onFailure: Degrade
  maintenance:
    enabled: true
    schedule:
      quick:
        cron: "15 */6 * * *"
        jitter: 30m
      full:
        cron: "15 3 * * *"
        jitter: 1h
  moverDefaults:
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 2Gi
