# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app profilarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: profilarr
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
  - name: rook-ceph-cluster
    namespace: rook-ceph
  - name: volsync
    namespace: volsync-system
  values:
    controllers:
      profilarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/dictionarry-hub/profilarr
              tag: latest@sha256:75a43c9c19c70f6e48315d4ed5cef3232d905da8fab397391a2078a5e0fd7ec1
            env:
              AUTH: "off"
              ORIGIN: https://profilarr.${HOME_DOMAIN}
              TZ: ${TIMEZONE}
              PUID: "568"
              PGID: "568"
              UMASK: "022"
            envFrom:
            - secretRef:
                name: profilarr-secret
            resources:
              requests:
                cpu: 15m
                memory: 256M
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: *app
        ports:
          http:
            port: 6868
    persistence:
      config:
        existingClaim: *app
        globalMounts:
        - path: /config
          subPath: v2
