# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: open-webui
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: open-webui
    podAnnotations:
      reloader.stakater.com/auto: "true"
    ollama:
      enabled: false
    pipelines:
      enabled: false
    tika:
      enabled: false
    terminals:
      enabled: false
    websocket:
      enabled: false
      manager: ""
      redis:
        enabled: false
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
    extraInitContainers:
    - name: configure-chat-completions
      image: ghcr.io/open-webui/open-webui:v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
      command: [python, -c]
      args:
      - |
        import json
        import sqlite3
        import time
        from pathlib import Path

        database = Path("/app/backend/data/webui.db")
        if not database.exists():
            raise SystemExit(0)

        with sqlite3.connect(database, timeout=30) as connection:
            table = connection.execute(
                "SELECT 1 FROM sqlite_master WHERE type = 'table' AND name = 'config'"
            ).fetchone()
            if table is None:
                raise SystemExit(0)

            row = connection.execute(
                "SELECT value FROM config WHERE key = 'openai.api_configs'"
            ).fetchone()
            if row is None:
                raise SystemExit(0)

            api_configs = json.loads(row[0])
            api_configs.setdefault("0", {}).pop("api_type", None)
            connection.execute(
                "UPDATE config SET value = ?, updated_at = ? WHERE key = 'openai.api_configs'",
                (json.dumps(api_configs, separators=(",", ":")), int(time.time())),
            )
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      volumeMounts:
      - name: data
        mountPath: /app/backend/data
    enableOpenaiApi: true
    openaiBaseApiUrls:
    - http://10.0.10.95:8642/v1
    openaiApiKeysExistingSecret: open-webui-secret
    openaiApiKeysExistingSecretKey: OPENAI_API_KEYS
    extraEnvVars:
    - name: OPENAI_API_CONFIGS
      value: '{"0":{}}'
    - name: ENABLE_OAUTH
      value: "true"
    - name: ENABLE_OAUTH_SIGNUP
      value: "true"
    - name: ENABLE_OAUTH_PERSISTENT_CONFIG
      value: "false"
    - name: ENABLE_OAUTH_ID_TOKEN_COOKIE
      value: "false"
    - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
      value: "true"
    - name: OAUTH_CODE_CHALLENGE_METHOD
      value: S256
    - name: OAUTH_PROVIDER_NAME
      value: Pocket ID
    - name: OAUTH_SCOPES
      value: openid email profile groups offline_access
    - name: OPENID_PROVIDER_URL
      value: https://sso.${HOME_DOMAIN}/.well-known/openid-configuration
    - name: OPENID_REDIRECT_URI
      value: https://webui.${HOME_DOMAIN}/oauth/oidc/callback
    - name: WEBUI_AUTH_SIGNOUT_REDIRECT_URL
      value: https://webui.${HOME_DOMAIN}/auth
    - name: OAUTH_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: open-webui-secret
          key: OAUTH_CLIENT_ID
    - name: OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: open-webui-secret
          key: OAUTH_CLIENT_SECRET
    - name: WEBUI_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: open-webui-secret
          key: WEBUI_SECRET_KEY
    - name: WEBUI_URL
      value: https://webui.${HOME_DOMAIN}
    - name: TZ
      value: ${TIMEZONE}
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ceph-block
      accessModes:
      - ReadWriteOnce
    startupProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 5
      failureThreshold: 60
    readinessProbe:
      httpGet:
        path: /health/db
        port: http
      periodSeconds: 10
      failureThreshold: 6
    livenessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 30
      failureThreshold: 3
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
