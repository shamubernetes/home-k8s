# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app grafana-operator
  namespace: "${KS_NAMESPACE}"
spec:
  targetNamespace: &namespace observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
  - name: grafana-operator-crds
  path: ./kubernetes/apps/observability/grafana-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: true
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: "${KS_TIMEOUT}"
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
---
# The instance waits for the idle control plane, the retained PostgreSQL database,
# the existing secret input, and the Helm workload that remains the rollback target.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &instance grafana-operator-instance
  namespace: "${KS_NAMESPACE}"
spec:
  targetNamespace: &namespace observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: *instance
  dependsOn:
  - name: grafana-operator
  - name: grafana
  - name: cloudnative-pg-cluster
  - name: external-secrets-secret-store
  path: ./kubernetes/apps/observability/grafana-operator/workload
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: true
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: 15m
  postBuild:
    substitute:
      APP: *instance
      NAMESPACE: *namespace
