# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app talaria-feedback-bridge
  namespace: flux-system
spec:
  targetNamespace: services
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # The bridge files reports into Kanvil. Depending on it also lets kanvil prune the
  # previous raw bridge resources at a revision before this app recreates them.
  dependsOn:
  - name: kanvil
  - name: external-secrets-secret-store
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/apps/services/talaria-feedback-bridge/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
    - kind: Secret
      name: cluster-secrets
    - kind: ConfigMap
      name: cluster-ipam
