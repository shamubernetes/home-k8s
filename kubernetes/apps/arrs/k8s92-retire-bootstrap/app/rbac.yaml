apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s92-retire-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s92-retire-bootstrap
rules:
  - apiGroups:
      - volsync.backube
    resources:
      - replicationdestinations
    resourceNames:
      - overseerr-dst
    verbs:
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s92-retire-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s92-retire-bootstrap
subjects:
  - kind: ServiceAccount
    name: k8s92-retire-bootstrap
    namespace: arrs
