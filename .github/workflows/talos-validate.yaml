# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Talos - Validate"

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "talos-validate-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Talos - Validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install tools
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install_args: task talosctl github:budimanjojo/talhelper
        cache: true
        fetch_from_github: false

    - name: Check coordinated Talos target
      run: scripts/check-talos-version-sync

    - name: Validate Talos machine configs
      run: task talos:validate