apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: wizarr
spec:
  repository:
    kind: Repository
    name: wizarr-nas-smb
  identity:
    username: wizarr
    hostname: arrs
  sources:
  - pvc:
      name: wizarr
    sourcePathOverride: /pvc/wizarr
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  staging:
    timeout: 10m
    storageClassName: ceph-block
    accessModes:
    - ReadWriteOnce
  defaultDeletionPolicy: Delete
  retention:
    keepDaily: 7
    keepWeekly: 4
  hooks:
    beforeSnapshot:
    - workloadExec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: wizarr
        container: app
        command:
        - python3
        - -c
        - |
          import json
          import os
          import sqlite3

          directory = "/data/database/kopiur"
          source_path = "/data/database/database.db"
          destination_path = directory + "/wizarr-online.db"
          artifacts = [
              destination_path,
              destination_path + "-journal",
              destination_path + "-wal",
              destination_path + "-shm",
          ]

          with open("/data/database/secrets.json", "rb") as file_handle:
              json.load(file_handle)
          os.makedirs(directory, exist_ok=True)
          for path in artifacts:
              try:
                  os.unlink(path)
              except FileNotFoundError:
                  pass

          source = sqlite3.connect("file:" + source_path + "?mode=ro", uri=True)
          try:
              if source.execute("PRAGMA quick_check").fetchone()[0] != "ok":
                  raise RuntimeError("source SQLite quick_check failed")
              destination = sqlite3.connect(destination_path)
              try:
                  source.backup(destination)
                  destination.commit()
                  if destination.execute("PRAGMA integrity_check").fetchone()[0] != "ok":
                      raise RuntimeError("online backup SQLite integrity_check failed")
                  if destination.execute("SELECT count(*) FROM sqlite_master WHERE type='table'").fetchone()[0] < 1:
                      raise RuntimeError("online backup contains no application tables")
              finally:
                  destination.close()
          finally:
              source.close()

          sidecars = [path for path in artifacts[1:] if os.path.exists(path)]
          if sidecars:
              raise RuntimeError("online backup left SQLite sidecars: " + ", ".join(sidecars))
          os.chown(destination_path, 1000, 1000)
          os.chmod(destination_path, 0o640)
          file_descriptor = os.open(destination_path, os.O_RDONLY)
          try:
              os.fsync(file_descriptor)
          finally:
              os.close(file_descriptor)
          directory_descriptor = os.open(directory, os.O_RDONLY)
          try:
              os.fsync(directory_descriptor)
          finally:
              os.close(directory_descriptor)
        timeout: 2m
        continueOnFailure: false
    afterSnapshot:
    - workloadExec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: wizarr
        container: app
        command:
        - /bin/sh
        - -c
        - rm -f /data/database/kopiur/wizarr-online.db /data/database/kopiur/wizarr-online.db-journal /data/database/kopiur/wizarr-online.db-wal /data/database/kopiur/wizarr-online.db-shm
        timeout: 30s
        continueOnFailure: true
  mover:
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
  verification:
    quick:
      schedule:
        cron: "15 8 * * *"
        jitter: 30m
      parallel: 4
      fileParallelism: 2
      maxErrors: 0
    deep:
      schedule:
        cron: "15 9 * * 0"
        jitter: 1h
      capacity: 1Gi
      storageClassName: ceph-block
      parallel: 2
    successExpr: "stats.files > 0 && stats.errors == 0"
    verifyFilesPercent: 100
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: wizarr-daily
spec:
  policyRef:
    name: wizarr
  schedule:
    cron: "15 1 * * *"
    jitter: 10m
    runOnCreate: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: wizarr-nas-to-r2
spec:
  sourceRef:
    kind: Repository
    name: wizarr-nas-smb
  destinationRef:
    kind: Repository
    name: wizarr-r2
  schedule:
    cron: "30 7 * * *"
    jitter: 10m
  selection:
    identities:
      include:
      - username: wizarr
        hostname: arrs
        sourcePath: /pvc/wizarr
    latestOnly: false
  migrate:
    parallel: 2
    policies: none
  pruning:
    retention:
      keepDaily: 7
      keepWeekly: 4
  suspend: false
