# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./ocirepository.yaml
- ./externalsecret.yaml
- ./externalsecret-oidc.yaml
- ./legacy-recovery-secrets.yaml
- ./helmrelease.yaml
- ./httproute-envoy-api.yaml
- ./httproute-envoy-browser.yaml
- ./securitypolicy-oidc.yaml
- ./service-envoy-dns.yaml
- ../../../../templates/gatus/guarded
- ./externalsecret-kopiur.yaml
- ./kopiur-repositories.yaml
- ./kopiur-policy.yaml
- ./kopiur-current-r2-retained.yaml
- ./kopiur-original-snapshot.yaml
- ./kopiur-original-replication.yaml
- ./kopiur-original-r2-retained.yaml
- ./kopiur-first-scheduled-r2-retained.yaml
components:
- ../../../../components/kopiur-postgres
patches:
- path: ./kopiur-postgres-patch.yaml
- target:
    kind: PersistentVolumeClaim
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        kustomize.toolkit.fluxcd.io/prune: disabled
