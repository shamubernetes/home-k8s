# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-scheduler-webhook-external
spec:
  # GitHub delivers the App's webhook here. Only this one signed endpoint is public; the UI and API stay on
  # envoy-internal under the same hostname, which internal DNS resolves to the internal gateway.
  parentRefs:
  - name: envoy-external
    namespace: network
    sectionName: https
  hostnames:
  - "github-scheduler.${HOME_DOMAIN}"
  rules:
  - matches:
    - method: POST
      path:
        type: Exact
        value: /webhooks/github
    backendRefs:
    - name: github-scheduler
      port: 8080
  # Everything else under this hostname is internal only.
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: github-scheduler-not-public
