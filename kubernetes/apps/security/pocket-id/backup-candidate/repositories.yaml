metadata:
  name: pocket-id-r2
spec:
  backend:
    s3:
      bucket: kopiur-pocket-id
      prefix: kopiur/pocket-id/r2/
      endpoint: 0834f4848c703f1fcf5b524bdf5f1722.r2.cloudflarestorage.com
      region: auto
