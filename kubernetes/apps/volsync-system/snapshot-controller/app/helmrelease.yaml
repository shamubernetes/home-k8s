# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  postRenderers:
  - kustomize:
      images:
      - name: registry.k8s.io/sig-storage/snapshot-controller
        newName: registry.k8s.io/sig-storage/snapshot-controller
        # renovate: datasource=docker depName=registry.k8s.io/sig-storage/snapshot-controller
        newTag: v8.6.0@sha256:81e79f205083f105e573ba2ebfe5964ede7f69a154e8627f53ebbbccd3ed9f70
      - name: registry.k8s.io/sig-storage/snapshot-conversion-webhook
        newName: registry.k8s.io/sig-storage/snapshot-conversion-webhook
        # renovate: datasource=docker depName=registry.k8s.io/sig-storage/snapshot-conversion-webhook
        newTag: v8.6.0@sha256:6930ac22e7f6b771a869933b7035ecc6210b83b616673f0ce6bedacbb25ffa32
  values:
    controller:
      replicaCount: 2
      priorityClassName: system-cluster-critical
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi
      serviceMonitor:
        create: true
