# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ghar-talos
  namespace: "${KS_NAMESPACE}"
spec:
  targetNamespace: actions-runner-talos
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
  - name: ghar-controller
  - name: external-secrets-secret-store
  path: ./kubernetes/apps/actions-runner-system/ghar-scale-set/arc-talos
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: true
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: "${KS_TIMEOUT}"
