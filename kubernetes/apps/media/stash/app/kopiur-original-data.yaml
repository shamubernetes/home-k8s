# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kopiur.home-operations.com/snapshot_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  # Prior v3 resolved the old policy before the same Flux apply updated it.
  # This attempt is published only after the live generation-2 RW policy exists.
  name: stash-k92-native-data-original-v4
spec:
  policyRef:
    name: stash
  source:
    sourceIndex: 1
    target:
      pvc:
        name: stash-data
        namespace: media
  deletionPolicy: Retain
  pin: true
  description: K8S-92 self-contained online native config/database/blobs/metadata/extensions original
  failurePolicy:
    activeDeadlineSeconds: 3600
    backoffLimit: 0
