# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/httproutefilter_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: factory-app-links
spec:
  directResponse:
    contentType: application/json
    body:
      type: Inline
      inline: |
        {
          "applinks": {
            "details": [{
              "appIDs": ["Q28NF3NH3D.house.thezoo.t3factory"],
              "components": [
                { "#": "?*", "exclude": true },
                { "/": "/" }, { "/": "/runs" }, { "/": "/runs/*" },
                { "/": "/queue" }, { "/": "/sources" }, { "/": "/activity" },
                { "/": "/cleanup" }, { "/": "/controls" }, { "/": "/settings" },
                { "/": "/settings/*" }, { "/": "/start" }, { "/": "/start/new" }
              ]
            }]
          }
        }
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: factory-app-links
spec:
  parentRefs:
  - name: envoy-external
    sectionName: https
  hostnames:
  - "factory.${HOME_DOMAIN}"
  rules:
  - matches:
    - method: GET
      path: &association
        type: Exact
        value: /.well-known/apple-app-site-association
    - method: HEAD
      path: *association
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: factory-app-links
