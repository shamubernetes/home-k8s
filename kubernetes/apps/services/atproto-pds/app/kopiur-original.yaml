# Validated against the installed Kopiur CRDs by scripts/validate-app.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  name: atproto-pds-k8s92-original
spec:
  policyRef:
    name: atproto-pds
  deletionPolicy: Retain
  pin: true
  failurePolicy:
    activeDeadlineSeconds: 3600
  description: K8S-92 original stopped whole-store and runtime escrow
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  # Adopt only the independently restored original R2 point, without replacing it.
  name: atproto-pds-nas-to-r2-copy-cf12bfa9f369fb32-fc7a9cb9
spec:
  repository:
    kind: Repository
    name: atproto-pds-r2
    namespace: services
  deletionPolicy: Retain
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: atproto-pds-primary
spec:
  policyRef:
    name: atproto-pds
  schedule:
    suspend: true
    # Retain daily cadence; qualify format-2 original recovery before resuming.
    cron: "${VOLSYNC_SCHEDULE}"
    jitter: 10m
    runOnCreate: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: atproto-pds-nas-to-r2
  annotations:
    # Copy the verified retained original before independent native recovery.
    kopiur.home-operations.com/run-requested: "2026-10-11T11:30:00Z"
spec:
  sourceRef:
    kind: Repository
    name: atproto-pds-nas-smb
  destinationRef:
    kind: Repository
    name: atproto-pds-r2
  schedule:
    cron: "${VOLSYNC_R2_SCHEDULE}"
    jitter: 10m
  selection:
    identities:
      include:
      - username: atproto-pds
        hostname: services
        sourcePath: /pvc/atproto-pds
    latestOnly: false
  migrate:
    parallel: 2
    policies: none
  pruning:
    none: {}
  suspend: false
