# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cwa-bdl
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: cwa-bdl
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
  - name: rook-ceph-cluster
    namespace: rook-ceph
  - name: volsync
    namespace: volsync-system
  - name: calibre-web-automated
    namespace: media
  values:
    controllers:
      cwa-bdl:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          books-canary:
            image:
              repository: ghcr.io/calibrain/calibre-web-automated-book-downloader
              tag: latest@sha256:394b703c5409a8669af246179d8e5ec23b971565b35000c9ac1e150454d66e1c
            command:
              - /bin/sh
              - -ec
              - stat /books >/dev/null
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        containers:
          app:
            image:
              repository: ghcr.io/calibrain/calibre-web-automated-book-downloader
              tag: latest@sha256:394b703c5409a8669af246179d8e5ec23b971565b35000c9ac1e150454d66e1c
            env:
              TZ: ${TIMEZONE}
              PUID: "568"
              PGID: "568"
              FLASK_PORT: &port 8084
              INGEST_DIR: /books
              SEARCH_MODE: direct
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: 8085
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
          books-monitor:
            image:
              repository: ghcr.io/calibrain/calibre-web-automated-book-downloader
              tag: latest@sha256:394b703c5409a8669af246179d8e5ec23b971565b35000c9ac1e150454d66e1c
            command:
              - /bin/sh
              - -ec
              - |
                exec python3 -u -c '
                import os
                import urllib.request
                from http.server import BaseHTTPRequestHandler, HTTPServer

                class Handler(BaseHTTPRequestHandler):
                    def do_GET(self):
                        try:
                            os.stat("/books")
                            with urllib.request.urlopen("http://127.0.0.1:8084/api/health", timeout=3) as response:
                                healthy = response.status == 200
                        except Exception:
                            healthy = False
                        self.send_response(200 if healthy else 503)
                        self.end_headers()

                    def log_message(self, format, *args):
                        return

                HTTPServer(("0.0.0.0", 8085), Handler).serve_forever()
                '
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-08-10T20:20:45Z"
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: cwa-bdl
        ports:
          http:
            port: *port
    persistence:
      config:
        existingClaim: cwa-bdl
        globalMounts:
        - path: /config
      books:
        type: nfs
        server: "${IPAM_IP_NFS}"
        path: /mnt/user/Media
        globalMounts:
        - path: /books
          subPath: Books/ingest
