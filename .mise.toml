[tools]
node = "24.21.0"
actionlint = "1.7.12"
kubectl = "1.37.1"
sops = "3.13.3"
age = "1.3.2"
task = "3.54.0"
flux2 = "2.9.6"
helm = "4.3.0"
jq = "1.8.2"
python = "3.14.7"
"github:budimanjojo/talhelper" = "v3.1.17"
"github:home-operations/flate" = "v0.6.5"
"github:home-operations/yayamlls" = "0.3.2"
talosctl = "1.14.2"
krew = "0.5.0"
"npm:renovate" = { version = "44.132.5", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }
shellcheck = "0.11.0"
zizmor = "1.30.1"
"yq" = "4.54.1"
crane = "0.22.1"
kyverno = "1.19.1"

[env]
MISE_LOCKED = "1"
KUBECONFIG = "{{config_root}}/kubernetes/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
K8S_AUTH_KUBECONFIG = "{{config_root}}/kubernetes/kubeconfig"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"

[settings]
# Exact release signer from the verified Flux provenance certificate.
# Keep SLSA required, with the upstream Aqua registry as fallback.
aqua.registries = [
  "https://raw.githubusercontent.com/shamubernetes/home-k8s/cffe18a3d38823cea9247a1787345b4cd86b0e0c/.mise/aqua-registry.yaml",
  "https://github.com/aquaproj/aqua-registry",
]
