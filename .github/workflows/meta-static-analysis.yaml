# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Meta - Static Analysis"

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
    - ".github/workflows/**"
    - ".mise.toml"
    - "scripts/**"
    - "**/*.sh"
    - "talos/clusterconfig/**"
    - "kubernetes/apps/**"

permissions:
  contents: read

concurrency:
  group: "static-analysis-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  generated-files:
    name: Generated File Guard
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Reject generated Talos credentials
      run: scripts/tests/test-generated-secrets.sh

  lint:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Actionlint
          command: actionlint
          install_args: actionlint shellcheck
        - name: Zizmor
          command: zizmor
          install_args: zizmor
        - name: ShellCheck
          command: shellcheck
          install_args: shellcheck
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Mise
      uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      with:
        install_args: ${{ matrix.install_args }}
        cache: true
        fetch_from_github: false

    - name: Run ${{ matrix.name }}
      shell: bash
      env:
        LINTER: ${{ matrix.command }}
      run: |
        set -euo pipefail

        case "${LINTER}" in
          actionlint)
            mapfile -t workflows < <(
              git ls-files \
                ':(glob).github/workflows/*.yaml' \
                ':(glob).github/workflows/*.yml'
            )
            actionlint "${workflows[@]}"
            ;;
          zizmor)
            zizmor --offline --strict-collection --min-severity high .
            ;;
          shellcheck)
            flux_template='kubernetes/apps/observability/kuberhealthy/checks/scripts/plex-check.sh'
            mapfile -t scripts < <(
              while IFS= read -r file; do
                [[ -f $file ]] || continue
                IFS= read -r first_line < "$file" || true
                if [[ $first_line =~ ^\#!.*(ba)?sh([[:space:]]|$) ]]; then
                  printf '%s\n' "$file"
                fi
              done < <(git ls-files)
            )
            mapfile -t regular_scripts < <(
              printf '%s\n' "${scripts[@]}" | grep -vFx "${flux_template}"
            )
            shellcheck "${regular_scripts[@]}"
            # Flux replaces doubled dollar signs before this script executes.
            shellcheck --exclude=SC2034,SC2157,SC2193 "${flux_template}"
            ;;
          *)
            printf 'Unknown linter: %s\n' "${LINTER}" >&2
            exit 1
            ;;
        esac

  validation-fixtures:
    name: Validation Fixtures
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup validation tools
      uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      with:
        install_args: crane flux2 helm jq kubectl kyverno python yq
        cache: true
        fetch_from_github: false

    - name: Log in to GHCR for private chart validation
      env:
        GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        GHCR_USERNAME: ${{ vars.GHCR_READ_USERNAME }}
      run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USERNAME" --password-stdin

    - name: Run validation fixtures
      run: |
        python scripts/tests/test-cluster-maintenance.py
        python scripts/tests/test-home-assistant-renovate-guard.py
        python scripts/tests/test-renovate-ceph-guard.py
        python scripts/tests/test-renovate-group-precedence.py
        python scripts/tests/test-renovate-queue-precheck.py
        python scripts/tests/test-renovate-ci-quota-hardening.py
        python scripts/tests/test-deployment-tooling.py
        python scripts/tests/test-homarr-upsert-app.py
        scripts/tests/test-validation.sh
        scripts/tests/test-flate-render.sh
        scripts/tests/test-firecrawl-promotion.sh
        scripts/tests/test-helm-image-inventory.sh
        scripts/tests/test-k8s-schemas.sh
        scripts/tests/test-talos-arc-boundary.sh
        scripts/tests/test-oci-source-handoffs.sh
        scripts/tests/test-protected-app-envoy-oidc.sh
        scripts/tests/test-full-host-envoy-oidc.sh
        scripts/tests/test-protected-auth-retirement.sh
        python scripts/tests/test-general-ingress-envoy.py
        scripts/tests/test-general-ingress-retirement.sh
        scripts/tests/test-profilarr-hermes-machine-route.sh
        scripts/tests/test-talos-image-resource-limits.sh
        scripts/tests/test-talos-image-gate-scope.sh
        scripts/tests/test-flate-image-inventory-retry.sh
        scripts/tests/test-flux-image-postrenderers.sh
        scripts/tests/test-helm-template-retry.sh
        scripts/tests/test-talos-image-plan.sh
        scripts/tests/test-talos-pr-files.sh
        scripts/tests/test-talos-tooling-sync.sh
        scripts/tests/test-talos-workflow-trust.sh
        scripts/tests/test-talos-version-sync.sh

    - name: Check OCI source-only handoffs
      if: ${{ github.event_name == 'pull_request' }}
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: scripts/check-oci-source-handoffs "$BASE_SHA"

  raw-image-pins:
    name: Raw Image Pins
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup rendering tools
      uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      with:
        install_args: kubectl yq
        cache: true
        fetch_from_github: false

    - name: Check raw workload images
      run: scripts/check-image-pins kubernetes/apps

  image-plan:
    name: Helm Image Shard Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Build balanced shard matrix
      id: plan
      env:
        HELM_IMAGE_APPS_PER_SHARD: "20"
      run: |
        matrix=$(scripts/plan-helm-image-shards)
        printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  image-pins:
    name: Rendered Image Pins (${{ matrix.name }})
    needs: image-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-plan.outputs.matrix) }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup rendering tools
      uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      with:
        install_args: flux2 helm jq kubectl python yq
        cache: true
        fetch_from_github: false

    - name: Log in to GHCR for private chart rendering
      env:
        GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        GHCR_USERNAME: ${{ vars.GHCR_READ_USERNAME }}
      run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USERNAME" --password-stdin

    - name: Check rendered workload images
      env:
        HELM_IMAGE_JOBS: ${{ matrix.size }}
        HELM_IMAGE_SHARD_COUNT: ${{ matrix.count }}
        HELM_IMAGE_SHARD_INDEX: ${{ matrix.index }}
      run: scripts/check-helmrelease-images

  success:
    if: ${{ !cancelled() }}
    name: Static Analysis - Success
    needs:
    - generated-files
    - image-pins
    - image-plan
    - lint
    - raw-image-pins
    - validation-fixtures
    runs-on: ubuntu-latest
    steps:
    - name: Check required jobs
      env:
        RESULTS: ${{ toJSON(needs.*.result) }}
      run: |
        jq --exit-status 'all(. == "success")' <<< "$RESULTS"
