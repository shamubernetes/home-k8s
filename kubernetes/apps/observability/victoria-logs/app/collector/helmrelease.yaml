# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: victoria-logs-collector
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
  - name: victoria-logs
    namespace: observability
  values:
    fullnameOverride: victoria-logs-collector
    image:
      registry: docker.io
      repository: victoriametrics/vlagent
      tag: v1.52.0@sha256:5f8bb5cfde9745c02c3301426cad6fab4ef1d382161af577d284cccc9136b99c
    remoteWrite:
    - url: http://victoria-logs.observability.svc.cluster.local:9428
      maxDiskUsagePerURL: 10GB
    collector:
      streamFields:
      - kubernetes.pod_name
      - kubernetes.pod_namespace
      - kubernetes.container_name
      - kubernetes.pod_labels.app.kubernetes.io/name
      excludeFilter: kubernetes.pod_name:=%{HOSTNAME}
    extraArgs:
      kubernetesCollector.decolorizeFields: _msg
    persistence:
      volume:
        hostPath:
          path: /var/lib/vl-collector
          type: DirectoryOrCreate
    podMonitor:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    tolerations:
    - operator: Exists
