apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: tubearchivist-k92-original-r2
spec:
  credentialProjection:
    enabled: false
  failurePolicy:
    activeDeadlineSeconds: 3600
    backoffLimit: 0
    podStartupDeadlineSeconds: 300
  mover:
    podSecurityContext:
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add:
          - CHOWN
          - FOWNER
          - DAC_OVERRIDE
        drop:
          - ALL
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
  options:
    enableFileDeletion: false
    ignoreErrors: false
    ignorePermissionErrors: false
    parallel: 8
    skipOwners: false
    skipPermissions: false
    skipTimes: false
    writeFilesAtomically: true
  policy:
    onMissingSnapshot: Fail
    waitTimeout: 1m
  repository:
    kind: Repository
    name: tubearchivist-r2
  source:
    identity:
      hostname: media
      sourcePath: /pvc/tubearchivist
      username: tubearchivist
      snapshotID: 068246068c6aad73f5316b46d08451af
  target:
    pvc:
      accessModes:
        - ReadWriteOnce
      capacity: 20Gi
      name: tubearchivist-k92-original-r2
      storageClassName: ceph-block
