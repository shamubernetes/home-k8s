# Qualified originals. Preserve the incumbent UTC daily cadence and disable pruning.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: grimmory-nas-to-r2
  annotations:
    kopiur.home-operations.com/run-requested: "2026-10-20T14:03:36Z"
spec:
  sourceRef:
    kind: Repository
    name: grimmory-nas-smb
  destinationRef:
    kind: Repository
    name: grimmory-r2
  schedule:
    # Follow the 16:45Z daily capture, with time for upload and verification.
    cron: "15 17 * * *"
    timezone: UTC
  selection:
    identities:
      include:
      - username: grimmory
        hostname: media
        sourcePath: /pvc/grimmory
    latestOnly: false
  migrate:
    policies: none
  pruning:
    none: {}
  suspend: false
