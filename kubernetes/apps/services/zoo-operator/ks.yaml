# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zoo-operator
  namespace: "${KS_NAMESPACE}"
spec:
  targetNamespace: &namespace services
  commonMetadata:
    labels:
      app.kubernetes.io/name: zoo-operator
  dependsOn:
  - name: cloudnative-pg-cluster
  - name: dragonfly-cluster
  - name: envoy-gateway
  - name: envoy-gateway-config
  - name: external-secrets-secret-store
  path: ./kubernetes/apps/services/zoo-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: true
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: 10m
  postBuild:
    substitute:
      APP: zoo-operator
      NAMESPACE: *namespace
