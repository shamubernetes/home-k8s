# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/job-batch-v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: plane-init-bucket
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-bucket
        image: docker.io/amazon/aws-cli:2.36.25@sha256:d5b61bcb558149739b6d17410bdff21ec66518f3c921f0b8fc8ffa725f3f1b00
        envFrom:
        - secretRef:
            name: plane-doc-store-secret
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          export AWS_DEFAULT_REGION="${AWS_REGION:-us-east-1}"
          aws --endpoint-url "$AWS_S3_ENDPOINT_URL" --region "$AWS_DEFAULT_REGION" s3 mb "s3://$AWS_S3_BUCKET_NAME" 2>/dev/null || true
