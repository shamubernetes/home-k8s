apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: stash-k92-native-original-nas
spec:
  credentialProjection:
    enabled: false
  failurePolicy:
    activeDeadlineSeconds: 3600
    backoffLimit: 0
    podStartupDeadlineSeconds: 300
  mover:
    podSecurityContext:
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add:
          - CHOWN
          - FOWNER
          - DAC_OVERRIDE
        drop:
          - ALL
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
  options:
    enableFileDeletion: false
    ignoreErrors: false
    ignorePermissionErrors: false
    parallel: 2
    skipOwners: false
    skipPermissions: false
    skipTimes: false
    writeFilesAtomically: true
  policy:
    onMissingSnapshot: Fail
    waitTimeout: 1m
  repository:
    kind: Repository
    name: stash-nas-smb
  source:
    identity:
      hostname: media
      snapshotID: 1e3c5b07dc00567645440ab7fa5e3c9c
      sourcePath: /pvc/stash-data
      username: stash
  target:
    pvc:
      accessModes:
        - ReadWriteOnce
      capacity: 4Gi
      name: stash-k92-native-original-nas
      storageClassName: ceph-block
