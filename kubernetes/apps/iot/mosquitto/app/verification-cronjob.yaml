# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mosquitto-verification
spec:
  schedule: "0 0 31 2 *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            mqtt.home.arpa/plaintext-client: "true"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1883
            runAsGroup: 1883
            fsGroup: 1883
            seccompProfile: {type: RuntimeDefault}
          containers:
          - name: verify
            image: docker.io/library/eclipse-mosquitto:2.1.2-alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
            command: ["/bin/sh", "/scripts/verify.sh"]
            env:
            - name: MQTT_HOST
              value: "mqtt.${HOME_DOMAIN}"
            - name: MQTT_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mosquitto-secret
                  key: admin-username
            - name: MQTT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-secret
                  key: admin-password
            - name: MQTT_HA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-secret
                  key: ha-password
            - name: MQTT_ESPRESENSE_BAR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-secret
                  key: espresense-bar-password
            - name: MQTT_ESPRESENSE_LIVINGROOM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-secret
                  key: espresense-livingroom-password
            - name: MQTT_RATGDO_MAIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-secret
                  key: ratgdo-main-password
            - name: MQTT_RATGDO_LEGACY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-ratgdo-legacy
                  key: password
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
          volumes:
          - name: scripts
            configMap:
              name: mosquitto-verification
              defaultMode: 0555
          - name: work
            emptyDir:
              medium: Memory
