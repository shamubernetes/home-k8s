# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  parallelism: 1
  talos:
    # renovate: datasource=github-releases depName=siderolabs/talos
    version: v1.14.5
  policy:
    placement: hard
    rebootMode: powercycle
    waitForVolumeDetach: true
  healthChecks:
  # VolSync is retired. Guard all active Kopiur data operations, including
  # hook Jobs whose Snapshot has not entered its running phase yet.
  - apiVersion: batch/v1
    kind: Job
    description: No active native backup, restore, replication or verification Jobs
    expr: |-
      !has(object.metadata.labels) ||
      !('app.kubernetes.io/managed-by' in object.metadata.labels) ||
      object.metadata.labels['app.kubernetes.io/managed-by'] != 'kopiur' ||
      (has(status.conditions) &&
       status.conditions.exists(c, c.type in ['Complete', 'Failed'] && c.status == 'True') &&
       (!has(status.active) || status.active == 0)) ||
      (has(object.spec.suspend) && object.spec.suspend && (!has(status.active) || status.active == 0)) ||
      (object.metadata.name.endsWith('-discovery') &&
       has(object.metadata.ownerReferences) &&
       object.metadata.ownerReferences.exists(o, o.kind in ['Repository', 'ClusterRepository']) &&
       object.spec.template.spec.volumes.all(v, !has(v.persistentVolumeClaim) && !has(v.hostPath)))
  - apiVersion: ceph.rook.io/v1
    kind: CephCluster
    expr: |-
      status.ceph.health in ['HEALTH_OK']
  - apiVersion: comcast.github.io/v1
    kind: KuberhealthyState
    name: plex-no-streams
    namespace: observability
    description: No active Plex streams
    expr: |-
      object.spec.OK == true
