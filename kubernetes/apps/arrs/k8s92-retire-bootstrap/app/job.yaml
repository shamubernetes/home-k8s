apiVersion: batch/v1
kind: Job
metadata:
  name: k8s92-retire-bootstrap
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  # Retain the completed recipe without rerunning retirement on image updates.
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s92-retire-bootstrap
    spec:
      serviceAccountName: k8s92-retire-bootstrap
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: retire
          image: ghcr.io/home-operations/home-assistant:2026.11.0@sha256:7c1ab60a4bb4cc1f34c314bc209d72d7b7336f0da38d4a69064935d01bba1ba6
          command:
            - python
            - /scripts/retire.py
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: k8s92-retire-bootstrap-code
