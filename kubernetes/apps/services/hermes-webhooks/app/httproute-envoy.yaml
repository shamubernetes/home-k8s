# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-webhooks-envoy
spec:
  parentRefs:
  - name: envoy-external
    namespace: network
    sectionName: https
  hostnames:
  - "hermes-webhooks.${HOME_DOMAIN}"
  rules:
  - matches:
    - path:
        type: Exact
        value: /webhooks/firecrawl-automation
    backendRefs:
    - name: hermes-webhooks
      port: 80
