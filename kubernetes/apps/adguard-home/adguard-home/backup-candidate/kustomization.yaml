# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: adguard-home
resources:
  - policy.yaml
  - repositories.yaml
  - externalsecret.yaml
  - schedule.yaml
  - replication.yaml
  - original.yaml
  - original-v2.yaml
  - restore-nas-v2.yaml
  - original-r2-v2.yaml
  - restore-r2-v2.yaml
  - native-proof-job.yaml
configMapGenerator:
  - name: adguard-home-k92-native-proof
    files:
      - native-proof.py
    options:
      annotations:
        reloader.stakater.com/ignore: "true"
