# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app palworld
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: palworld
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      palworld:
        strategy: Recreate
        initContainers:
          prepare:
            image:
              repository: &imageRepository ghcr.io/pocketpairjp/palserver
              tag: &imageTag v1.0.2.101103@sha256:09343cac3d92b997634f034ade4ce702388e156ec726668c85ad3bc47faa33f4
            command: ["/bin/sh", "-c"]
            args:
              - |
                mkdir -p /pal/Package/Pal/Saved/Config/LinuxServer
                cp /config/PalWorldSettings.ini /pal/Package/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini
                chown -R user:usergroup /pal/Package/Pal/Saved
            securityContext:
              runAsUser: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE"]
        containers:
          app:
            image:
              repository: *imageRepository
              tag: *imageTag
            args:
              - -port=8211
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 4
                memory: 32Gi
              limits:
                cpu: 8
                memory: 40Gi
    defaultPodOptions:
      annotations:
        descheduler.alpha.kubernetes.io/evict: "false"
      securityContext:
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: "${IPAM_IP_PALWORLD}"
        ports:
          game:
            port: 8211
            protocol: UDP

    persistence:
      saved:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        retain: true
        size: 50Gi
        globalMounts:
          - path: /pal/Package/Pal/Saved
      settings:
        type: configMap
        name: palworld-settings
        advancedMounts:
          palworld:
            prepare:
              - path: /config/PalWorldSettings.ini
                subPath: PalWorldSettings.ini
                readOnly: true
