# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
spec:
  interval: 10m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: home-assistant
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
  - name: rook-ceph-cluster
    namespace: rook-ceph
  - name: volsync
    namespace: volsync-system
  values:
    controllers:
      home-assistant:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 17.6.0@sha256:86a1992d46273c58fd4ad95b626081dfaabfe16bd56944675169e406d1a660dd
            envFrom: &envFrom
            - secretRef:
                name: home-assistant-secret
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 100m
                memory: 128Mi
          # Recovery bootstrap only; existing HACS is preserved and upgraded in Home Assistant.
          bootstrap-hacs:
            enabled: true
            image: &homeAssistantImage
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.8.0@sha256:99c0293b3ad103151a9d8b860232fd1c6db425eadb9eb4905c0ecbef65b27363
            command:
            - python
            - -c
            args:
            - |
              from pathlib import Path
              import os
              import shutil
              import tempfile
              import urllib.request
              import zipfile

              hacs_version = os.environ["HACS_VERSION"]
              hacs_dir = Path("/config/custom_components/hacs")
              if (hacs_dir / "manifest.json").is_file():
                  print("HACS is already installed; preserving the Home Assistant-managed version")
                  raise SystemExit(0)

              with tempfile.TemporaryDirectory() as work_dir_name:
                  work_dir = Path(work_dir_name)
                  archive = work_dir / "hacs.zip"
                  extracted = work_dir / "hacs"
                  url = f"https://github.com/hacs/integration/releases/download/{hacs_version}/hacs.zip"
                  with urllib.request.urlopen(url, timeout=60) as response, archive.open("wb") as output:
                      shutil.copyfileobj(response, output)
                  with zipfile.ZipFile(archive) as hacs_zip:
                      hacs_zip.extractall(extracted)
                  if not (extracted / "manifest.json").is_file():
                      raise RuntimeError("Downloaded HACS archive has no manifest.json")

                  hacs_dir.parent.mkdir(parents=True, exist_ok=True)
                  if hacs_dir.exists():
                      shutil.rmtree(hacs_dir)
                  shutil.move(extracted, hacs_dir)
              print(f"Bootstrapped HACS {hacs_version}")
            env:
              # renovate: datasource=github-releases depName=hacs/integration
              HACS_VERSION: 2.0.5
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 100m
                memory: 128Mi
          # VS Code Dev Containers requires the runtime UID/GID to have names.
          init-vscode-identity:
            image: *homeAssistantImage
            command:
            - python
            - -c
            args:
            - |
              from pathlib import Path

              uid = "568"
              gid = "568"
              passwd = Path("/etc/passwd").read_text().rstrip("\n").splitlines()
              group = Path("/etc/group").read_text().rstrip("\n").splitlines()
              if not any(line.split(":")[2] == uid for line in passwd):
                  passwd.append("homeassistant:x:568:568:Home Assistant:/config:/bin/bash")
              if not any(line.split(":")[2] == gid for line in group):
                  group.append("homeassistant:x:568:")
              Path("/identity/passwd").write_text("\n".join(passwd) + "\n")
              Path("/identity/group").write_text("\n".join(group) + "\n")
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 10m
                memory: 32Mi
        containers:
          app:
            image: *homeAssistantImage
            env:
              TZ: America/New_York
            envFrom: *envFrom
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 2
                memory: 2Gi
              limits:
                cpu: 2
                memory: 2Gi
          code-server:
            enabled: false
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.132.0@sha256:b88ed46a6ace76a0294a17a24f39aa88032ed0a3692c3d8ab5433b47ab57ccbf
            args: ["--auth", "none", "--user-data-dir", "/config/.vscode", "--extensions-dir", "/config/.vscode", "--port", "12321", "/config"]
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 250m
                memory: 512Mi
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      priorityClassName: home-assistant-critical
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123
    persistence:
      config:
        existingClaim: home-assistant
        globalMounts:
        - path: /config
      logs:
        type: emptyDir
        globalMounts:
        - path: /config/logs
      tts:
        type: emptyDir
        globalMounts:
        - path: /config/tts
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
      vscode-identity:
        type: emptyDir
        advancedMounts:
          home-assistant:
            init-vscode-identity:
            - path: /identity
            app:
            - path: /etc/passwd
              subPath: passwd
              readOnly: true
            - path: /etc/group
              subPath: group
              readOnly: true
