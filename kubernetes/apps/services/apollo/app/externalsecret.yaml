# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apollo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: apollo-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_CONNECTION_POOL_URL: postgres://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASSWORD }}@postgres17-pooler.database.svc.cluster.local:5432/apollo
        REGISTRATION_SECRET: "{{ .REGISTRATION_SECRET }}"
        APPLE_KEY_ID: "{{ .APNS_KEY_ID }}"
        APPLE_TEAM_ID: "{{ .APNS_TEAM_ID }}"
  dataFrom:
  - extract:
      key: apollo
  data:
  - secretKey: APNS_KEY_ID
    remoteRef: {key: Cowtail APNs, property: APNS_KEY_ID}
  - secretKey: APNS_TEAM_ID
    remoteRef: {key: Cowtail APNs, property: APNS_TEAM_ID}
---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apollo-apns
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: apollo-apns-secret
    creationPolicy: Owner
  data:
  - secretKey: apple.p8
    remoteRef: {key: Cowtail APNs, property: APNS_AUTH_KEY_P8}
