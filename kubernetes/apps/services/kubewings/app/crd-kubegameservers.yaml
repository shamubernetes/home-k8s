# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/apiextensions.k8s.io/v1/customresourcedefinition.json
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: kubegameservers.kubewings.maudeco.de
spec:
  group: kubewings.maudeco.de
  names:
    kind: KubeGameServer
    listKind: KubeGameServerList
    plural: kubegameservers
    shortNames:
    - kgs
    singular: kubegameserver
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              allocations:
                items:
                  properties:
                    address:
                      description: |-
                        Address is the requested LoadBalancer address shared by this server's
                        allocations. Multiple addresses are rejected because one Service cannot
                        preserve Pelican's per-address allocation shape.
                      format: ip
                      type: string
                    name:
                      description: Kubernetes container port names follow IANA service-name
                        rules.
                      maxLength: 15
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                      x-kubernetes-validations:
                      - message: port name must contain at least one letter
                        rule: self.matches('[a-z]')
                      - message: port name must not contain consecutive hyphens
                        rule: '!self.contains(''--'')'
                    port:
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    protocol:
                      description: Protocol defines network protocols supported for
                        things like container ports.
                      enum:
                      - TCP
                      - UDP
                      type: string
                  required:
                  - address
                  - name
                  - port
                  - protocol
                  type: object
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              desiredState:
                enum:
                - Running
                - Stopped
                type: string
              panelUUID:
                format: uuid
                maxLength: 36
                minLength: 36
                type: string
              resources:
                properties:
                  claims:
                    description: |-
                      Dynamic resource claims are represented solely so admission can reject
                      them explicitly instead of relying on unknown-field pruning.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 0
                    type: array
                  limits:
                    description: |-
                      ComputeResourceList deliberately exposes only the two resources supported by
                      the bounded runtime. Dynamic and extended resources cannot enter the API.
                    properties:
                      cpu:
                        anyOf:
                        - type: integer
                        - type: string
                        maxLength: 32
                        minLength: 1
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        type: string
                        x-kubernetes-int-or-string: true
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        maxLength: 32
                        minLength: 1
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        type: string
                        x-kubernetes-int-or-string: true
                    required:
                    - cpu
                    - memory
                    type: object
                  requests:
                    description: |-
                      ComputeResourceList deliberately exposes only the two resources supported by
                      the bounded runtime. Dynamic and extended resources cannot enter the API.
                    properties:
                      cpu:
                        anyOf:
                        - type: integer
                        - type: string
                        maxLength: 32
                        minLength: 1
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        type: string
                        x-kubernetes-int-or-string: true
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        maxLength: 32
                        minLength: 1
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        type: string
                        x-kubernetes-int-or-string: true
                    required:
                    - cpu
                    - memory
                    type: object
                required:
                - limits
                - requests
                type: object
              runtime:
                properties:
                  args:
                    items:
                      type: string
                    maxItems: 128
                    type: array
                  command:
                    items:
                      type: string
                    maxItems: 32
                    minItems: 1
                    type: array
                    x-kubernetes-validations:
                    - message: command[0] must be a non-blank executable
                      rule: self[0].matches('[^[:space:]]')
                  env:
                    description: Env deliberately permits only Secret key references,
                      never literal values.
                    items:
                      properties:
                        name:
                          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                          type: string
                        secretKeyRef:
                          properties:
                            key:
                              maxLength: 253
                              pattern: ^[-._A-Za-z0-9]+$
                              type: string
                              x-kubernetes-validations:
                              - message: Secret key must not be '.' or '..'
                                rule: self != '.' && self != '..'
                            name:
                              description: Managed environment Secret names are "kw-"
                                + UUID + "-env".
                              maxLength: 43
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - name
                      - secretKeyRef
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  image:
                    description: Image must include an sha256 digest and is immutable
                      after creation.
                    maxLength: 456
                    pattern: ^(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?)*(?::[0-9]+)?/|\[[a-fA-F0-9:]+\](?::[0-9]+)?/)?[a-z0-9]+(?:(?:[._]|__|[-]+)[a-z0-9]+)*(?:/[a-z0-9]+(?:(?:[._]|__|[-]+)[a-z0-9]+)*)*(?::[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?@sha256:[a-f0-9]{64}$
                    type: string
                  stop:
                    properties:
                      type:
                        enum:
                        - command
                        - signal
                        - stop
                        type: string
                      value:
                        maxLength: 4096
                        type: string
                    required:
                    - type
                    type: object
                required:
                - command
                - image
                - stop
                type: object
              storage:
                properties:
                  retentionPolicy:
                    default: Retain
                    enum:
                    - Retain
                    - Delete
                    type: string
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    maxLength: 32
                    minLength: 1
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    type: string
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - size
                type: object
                x-kubernetes-validations:
                - message: storage class is immutable
                  rule: has(self.storageClassName) == has(oldSelf.storageClassName)
                    && (!has(self.storageClassName) || self.storageClassName == oldSelf.storageClassName)
                - message: storage size must not decrease
                  rule: quantity(string(self.size)).compareTo(quantity(string(oldSelf.size)))
                    >= 0
            required:
            - allocations
            - desiredState
            - panelUUID
            - resources
            - runtime
            - storage
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpoints:
                items:
                  properties:
                    address:
                      type: string
                    port:
                      format: int32
                      type: integer
                    protocol:
                      description: Protocol defines network protocols supported for
                        things like container ports.
                      type: string
                  required:
                  - port
                  - protocol
                  type: object
                type: array
              installPhase:
                type: string
              lastExit:
                properties:
                  code:
                    format: int32
                    type: integer
                  finishedAt:
                    format: date-time
                    type: string
                  oomKilled:
                    type: boolean
                required:
                - code
                - finishedAt
                type: object
              observedGeneration:
                format: int64
                type: integer
              podName:
                type: string
              processPhase:
                type: string
              pvcName:
                type: string
              serviceName:
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: panel UUID is immutable
          rule: self.spec.panelUUID == oldSelf.spec.panelUUID
        - message: runtime image is immutable
          rule: self.spec.runtime.image == oldSelf.spec.runtime.image
        - message: environment variables may reference only the server's managed Secret
          rule: '!has(self.spec.runtime.env) || self.spec.runtime.env.all(e, e.secretKeyRef.name
            == ''kw-'' + self.spec.panelUUID.lowerAscii() + ''-env'')'
        - message: resource requests must be positive
          rule: quantity(string(self.spec.resources.requests.cpu)).isGreaterThan(quantity('0'))
            && quantity(string(self.spec.resources.requests.memory)).isGreaterThan(quantity('0'))
        - message: resource limits must be positive
          rule: quantity(string(self.spec.resources.limits.cpu)).isGreaterThan(quantity('0'))
            && quantity(string(self.spec.resources.limits.memory)).isGreaterThan(quantity('0'))
        - message: cpu request must not exceed its limit
          rule: quantity(string(self.spec.resources.limits.cpu)).compareTo(quantity(string(self.spec.resources.requests.cpu)))
            >= 0
        - message: memory request must not exceed its limit
          rule: quantity(string(self.spec.resources.limits.memory)).compareTo(quantity(string(self.spec.resources.requests.memory)))
            >= 0
        - message: storage size must be positive
          rule: quantity(string(self.spec.storage.size)).isGreaterThan(quantity('0'))
        - message: allocation protocol and port tuples must be unique
          rule: self.spec.allocations.all(x, self.spec.allocations.filter(y, y.port
            == x.port && y.protocol == x.protocol).size() == 1)
        - message: all allocations must use one address
          rule: self.spec.allocations.size() == 0 || self.spec.allocations.all(x,
            x.address == self.spec.allocations[0].address)
        - message: allocation name 'agent' is reserved
          rule: self.spec.allocations.all(x, x.name != 'agent')
        - message: TCP port 8080 is reserved for the private agent
          rule: self.spec.allocations.all(x, x.protocol != 'TCP' || x.port != 8080)
    served: true
    storage: true
    subresources:
      status: {}
