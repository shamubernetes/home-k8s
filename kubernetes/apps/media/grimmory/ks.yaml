# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app grimmory
  namespace: "${KS_NAMESPACE}"
spec:
  targetNamespace: &namespace media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
  - name: kopiur
  - name: snapshot-controller
  - name: rook-ceph-cluster
  - name: volsync
  - name: external-secrets-secret-store
  path: ./kubernetes/apps/media/grimmory/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: false
  healthChecks:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    name: grimmory-kopiur-nas
    namespace: media
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    name: grimmory-kopiur-r2
    namespace: media
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Repository
    name: grimmory-nas-smb
    namespace: media
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Repository
    name: grimmory-r2
    namespace: media
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: "${KS_TIMEOUT}"
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      GATUS_INTERNAL_PORT: "6060"
      GATUS_PATH: /api/v1/healthcheck
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_SCHEDULE: "${VOLSYNC_SCHEDULE_GRIMMORY}"
      VOLSYNC_R2_SCHEDULE: "${VOLSYNC_R2_SCHEDULE_GRIMMORY}"
