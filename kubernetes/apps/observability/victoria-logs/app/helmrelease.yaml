# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: ConfigMap
          name: victoria-logs-victoria-logs-single-vector-k8s-monitoring
        patch: |-
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: victoria-logs-victoria-logs-single-vector-k8s-monitoring
          $patch: delete
  dependsOn:
  - name: rook-ceph-cluster
    namespace: rook-ceph
  - name: kube-prometheus-stack
    namespace: observability
  values:
    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"
    server:
      fullnameOverride: victoria-logs
      image:
        registry: docker.io
        repository: victoriametrics/victoria-logs
        tag: v1.54.0@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
      retentionPeriod: 7d
      retentionDiskSpaceUsage: 85GiB
      persistentVolume:
        enabled: true
        accessModes:
        - ReadWriteOnce
        storageClassName: ceph-block
        size: 100Gi
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "4"
          memory: 4Gi
      serviceMonitor:
        enabled: true
    vector:
      enabled: false
