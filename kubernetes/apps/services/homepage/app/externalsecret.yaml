# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: homepage-oidc-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        HOMEPAGE_OIDC_PROVIDERS: >-
          [{"id":"pocket-id","name":"Pocket ID","issuerUrl":"https://sso.${HOME_DOMAIN}","clientId":"{{ .client_id }}","clientSecret":"{{ .client_secret }}","scopes":["openid","profile","email"],"buttonLabel":"Continue with Pocket ID","buttonColor":"#111827","buttonTextColor":"#ffffff"}]
        HOMEPAGE_SESSION_KEY: "{{ .session_key }}"
  data:
  - secretKey: client_id
    remoteRef:
      key: homepage-oidc
      property: client-id
  - secretKey: client_secret
    remoteRef:
      key: homepage-oidc
      property: client-secret
  - secretKey: session_key
    remoteRef:
      key: homepage-oidc
      property: session-key
