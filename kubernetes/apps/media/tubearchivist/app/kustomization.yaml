# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./ocirepository.yaml
- ./externalsecret-kopiur.yaml
- ./kopiur-repositories.yaml
- ./kopiur-policy.yaml
- ../../../../templates/volsync
- ./externalsecret.yaml
- ./helmrelease.yaml
- ./httproute-envoy.yaml
- ../../../../templates/gatus/guarded
configMapGenerator:
- name: tubearchivist-backup-contract
  files:
  - backup.py
  - recovery.py
  options:
    disableNameSuffixHash: true
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
