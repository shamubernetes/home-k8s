# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./renovate-6224-verification.yaml
- ./kopiur-native-original-restores.yaml
- ./kopiur-policy.yaml
- ./kopiur-original.yaml
- ./externalsecret-kopiur-postgres.yaml
- ./ocirepository.yaml
- ./pvc.yaml
- ./legacy-recovery-secrets.yaml
- ./externalsecret.yaml
- ./helmrelease.yaml
- ./httproute-envoy.yaml
- ../../../../templates/gatus/guarded
configMapGenerator:
- name: romm-kopiur-native
  files:
  - capture.sh
  options:
    annotations:
      reloader.stakater.com/ignore: "true"
- name: romm-configmap
  files:
  - config.yml=./resources/config.yml
generatorOptions:
  disableNameSuffixHash: true
