apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - original-v2.yaml
  - externalsecret.yaml
  - repositories.yaml
  - native-credentials.yaml
  - policy.yaml
  - schedule.yaml
  - replication.yaml
configMapGenerator:
  - name: tubearchivist-native-capture
    files:
      - capture.py
    options:
      annotations:
        reloader.stakater.com/ignore: "true"
generatorOptions:
  disableNameSuffixHash: true
