# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./kopiur-online-original.yaml
- ./ocirepository.yaml
- ./externalsecret.yaml
- ./externalsecret-oidc.yaml
- ./kopiur-retained-pvc.yaml
- ./legacy-recovery-secrets.yaml
- ./helmrelease.yaml
- ./httproute-envoy-api.yaml
- ./httproute-envoy-browser.yaml
- ./securitypolicy-oidc.yaml
- ./service-envoy-dns.yaml
- ../../../../templates/gatus/guarded
- ./externalsecret-kopiur.yaml
- ./kopiur-repositories.yaml
- ./kopiur-policy.yaml
- ./kopiur-original-snapshot.yaml
- ./kopiur-original-snapshot-bounded.yaml
- ./kopiur-original-snapshot-observed.yaml
- ./kopiur-original-snapshot-sized.yaml
- ./kopiur-original-replication.yaml
- ./kopiur-original-r2-retained.yaml
- ./kopiur-first-scheduled-r2-retained.yaml
components:
- ../../../../components/kopiur-postgres
patches:
- path: ./kopiur-postgres-patch.yaml
- path: ./kopiur-recurring-runtime-patch.yaml
configMapGenerator:
- name: sonarr-kopiur-online-capture
  files:
  - capture=./online-capture.sh
  options:
    annotations:
      reloader.stakater.com/ignore: "true"
- name: sonarr-kopiur-recurring
  files:
  - recurring.sh=./recurring.sh
  - recurring-capture.sh=./recurring-capture.sh
generatorOptions:
  disableNameSuffixHash: true
replacements:
- source:
    kind: ConfigMap
    name: sonarr-kopiur-online-capture
    fieldPath: data.capture
  targets:
  - select:
      kind: SnapshotPolicy
      name: sonarr
    fieldPaths:
    - spec.hooks.beforeSnapshot.0.workloadExec.command.2
