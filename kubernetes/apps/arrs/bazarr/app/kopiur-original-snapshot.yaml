# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kopiur.home-operations.com/snapshot_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  name: bazarr-k8s92-original
spec:
  policyRef:
    name: bazarr
  deletionPolicy: Retain
  # Match the existing arrs Kopiur admission cap, not a new retention/RPO policy.
  failurePolicy:
    activeDeadlineSeconds: 3600
    backoffLimit: 0
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  name: bazarr-k8s92-original-retry1
spec:
  policyRef:
    name: bazarr
  deletionPolicy: Retain
  # Preserve the first attempt and capture this mover's live diagnostic output.
  failurePolicy:
    activeDeadlineSeconds: 3600
    backoffLimit: 0
