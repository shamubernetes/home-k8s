# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cowtail
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: cowtail
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      cowtail:
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/maudecode/cowtail
              tag: 0.17.0@sha256:db9789a11b6c097f6258082dd2e9627f39d5158eea56fb7e97eef3641c1ffc8d
            env:
              TZ: America/New_York
              CONVEX_API_UPSTREAM: http://convex-backend.services.svc.cluster.local:3210
              CONVEX_ACTIONS_UPSTREAM: http://convex-backend.services.svc.cluster.local:3211/
              PROMETHEUS_UPSTREAM: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/
              UNIVERSAL_LINKS_APP_ID:
                valueFrom:
                  secretKeyRef:
                    name: cowtail-secret
                    key: UNIVERSAL_LINKS_APP_ID
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              # nginx's entrypoint needs its default root startup behavior here
              # (envsubst, temp dir ownership, then dropping privileges).
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi

    configMaps:
      config:
        data:
          config.json: |
            {
              "cephDashboardUrl": "https://rook.${HOME_DOMAIN}"
            }
    persistence:
      config:
        type: configMap
        name: cowtail
        advancedMounts:
          cowtail:
            app:
            - path: /etc/cowtail
              readOnly: true

    defaultPodOptions:
      securityContext:
        # Cowtail's nginx image renders config and Universal Links files at startup,
        # which requires write access to root-owned image paths under /etc/nginx and
        # /usr/share/nginx/html.
        runAsNonRoot: false
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: cowtail
        ports:
          http:
            port: *port
