# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kopiur-canary
  namespace: "${KS_NAMESPACE}"
spec:
  dependsOn:
  - name: kopiur
  - name: external-secrets-secret-store
  - name: rook-ceph-cluster
  - name: snapshot-controller
  targetNamespace: &namespace kopiur-canary
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/kopiur-system/canary/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: true
  # Kopiur 0.10.0 does not refresh status.observedGeneration for a
  # schedule-only SnapshotReplication update until the next run. Keep Flux
  # health-aware without blocking an otherwise Ready replication scheduler.
  healthCheckExprs:
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: SnapshotReplication
    # Kopiur 0.10.0 leaves observedGeneration stale after schedule-only
    # updates, and status-based overrides remain InProgress in this Flux
    # release. Replication failures and staleness remain covered by Kopiur's
    # PrometheusRule.
    current: "true"
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: 15m
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
