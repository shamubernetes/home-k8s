# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zoo-database-bootstrap
  labels:
    app.kubernetes.io/component: database-bootstrap
    app.kubernetes.io/instance: zoo
    app.kubernetes.io/name: zoo
    app.kubernetes.io/part-of: zoo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: zoo-database-bootstrap
    creationPolicy: Owner
  data:
  - secretKey: INIT_POSTGRES_HOST
    remoteRef:
      key: The Zoo - Website
      property: INIT_POSTGRES_HOST
  - secretKey: INIT_POSTGRES_DBNAME
    remoteRef:
      key: The Zoo - Website
      property: INIT_POSTGRES_DBNAME
  - secretKey: INIT_POSTGRES_USER
    remoteRef:
      key: The Zoo - Website
      property: INIT_POSTGRES_USER
  - secretKey: INIT_POSTGRES_PASS
    remoteRef:
      key: The Zoo - Website
      property: INIT_POSTGRES_PASS
  - secretKey: INIT_POSTGRES_SUPER_PASS
    remoteRef:
      key: cloudnative-pg
      property: POSTGRES_SUPER_PASS
---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/job-batch-v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: zoo-database-bootstrap
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    app.kubernetes.io/component: database-bootstrap
    app.kubernetes.io/instance: zoo
    app.kubernetes.io/name: zoo
    app.kubernetes.io/part-of: zoo
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database-bootstrap
        app.kubernetes.io/instance: zoo
        app.kubernetes.io/name: zoo
        app.kubernetes.io/part-of: zoo
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: init-db
        image: ghcr.io/home-operations/postgres-init:17.6.0@sha256:86a1992d46273c58fd4ad95b626081dfaabfe16bd56944675169e406d1a660dd
        envFrom:
        - secretRef:
            name: zoo-database-bootstrap
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
