apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: nas-primary-to-r2
spec:
  sourceRef:
    kind: Repository
    name: nas-primary
  destinationRef:
    kind: Repository
    name: r2-offsite
  schedule:
    cron: "0 6 * * *"
    jitter: 30m
  selection:
    latestOnly: false
  migrate:
    parallel: 2
    policies: none
  pruning:
    retention:
      keepDaily: 7
      keepWeekly: 4
  suspend: false
