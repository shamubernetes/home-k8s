# yaml-language-server: $schema=https://k8s-schemas.pages.dev/tailscale.com/connector_v1alpha1.json
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: titans-exit-node
spec:
  hostname: titans-exit-node
  exitNode: true
  tags:
  - tag:k8s

# yamllint disable-line rule:document-start
---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/tailscale.com/connector_v1alpha1.json
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: titans-subnet-router
spec:
  hostnamePrefix: titans-subnet-router
  # Two devices advertising the same routes give Tailscale HA failover.
  # maude also advertises the LAN and node network as a fallback when the
  # cluster itself is down.
  replicas: 2
  proxyClass: titans-subnet-router
  subnetRouter:
    advertiseRoutes:
    - 10.0.10.0/24
    - 10.0.222.0/24
    - 10.50.0.0/24
    - 10.100.0.0/24
    - 10.100.47.0/24
    # Host routes for DNS, ingress and LB services. These help iOS prefer
    # Tailscale over overlapping private routes on arbitrary WiFi networks.
    - ${IPAM_IP_ADGUARD_0}/32
    - ${IPAM_IP_ADGUARD_1}/32
    - ${IPAM_IP_ADGUARD_2}/32
    - ${IPAM_IP_PLEX}/32
    - ${IPAM_IP_ENVOY_EXTERNAL}/32
    - ${IPAM_IP_ENVOY_INTERNAL}/32
    - 10.107.104.0/22
    - 10.108.108.0/23
    - 10.255.253.0/24
  tags:
  - tag:k8s

# yamllint disable-line rule:document-start
---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/tailscale.com/proxyclass_v1alpha1.json
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: titans-subnet-router
spec:
  statefulSet:
    pod:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            tailscale.com/parent-resource: titans-subnet-router
            tailscale.com/parent-resource-type: connector
