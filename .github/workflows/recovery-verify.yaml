# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Recovery - Verify"
run-name: "Recovery ${{ inputs.suite }} at ${{ inputs.commit }}"

# Merge this CI-only prerequisite first. Dispatch from main after reviewing the
# exact candidate commit. No pull-request event may execute code on this runner.
# gh workflow run recovery-verify.yaml --ref main -f suite=tunarr -f commit=<full-sha>
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Reviewed full lowercase commit SHA at a branch tip in this repository"
        required: true
        type: string
      suite:
        description: "Isolated recovery verification suite"
        required: true
        type: choice
        options:
        - tunarr
        - deadlines
        # One native fixture per dispatch, never seven sequential apps in 45 minutes.
        - postgres-bazarr
        - postgres-radarr
        - postgres-radarr-3d
        - postgres-sonarr
        - postgres-whisparr
        - mixed-grimmory
        - mixed-tubearchivist
        - identities

permissions:
  contents: read

jobs:
  verify:
    name: Verify recovery
    if: ${{ github.repository == 'shamubernetes/home-k8s' && github.ref == 'refs/heads/main' }}
    runs-on: ["ghar-set-zoo"]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      KUBECONFIG: /dev/null
      K8S_AUTH_KUBECONFIG: /dev/null
      TALOSCONFIG: /dev/null
      SOPS_AGE_KEY_FILE: /dev/null

    steps:
    - name: Validate dispatch before checkout
      env:
        COMMIT: ${{ inputs.commit }}
        SUITE: ${{ inputs.suite }}
      run: |
        set -euo pipefail
        [[ $COMMIT =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected an exact lowercase commit SHA' >&2; exit 1; }
        case "$SUITE" in
          tunarr|deadlines) ;;
          postgres-bazarr|postgres-radarr|postgres-radarr-3d|postgres-sonarr|postgres-whisparr) ;;
          mixed-grimmory|mixed-tubearchivist) ;;
          identities) ;;
          *) echo 'Unknown recovery suite' >&2; exit 1 ;;
        esac
        # GitHub can resolve fork objects by SHA. Require an actual branch tip
        # from this repository, not merely a commit reachable in its fork network.
        git ls-remote --heads https://github.com/shamubernetes/home-k8s.git > "$RUNNER_TEMP/recovery-heads"
        found=false
        while read -r sha ref; do
          if [[ $sha == "$COMMIT" && $ref == refs/heads/* ]]; then
            found=true
          fi
        done < "$RUNNER_TEMP/recovery-heads"
        [[ $found == true ]] || { echo 'Commit is not a repository branch tip' >&2; exit 1; }
        mkdir -p "$RUNNER_TEMP/recovery-tools"
        # mise-action writes its mise_toml input in the checkout, not working_directory.
        # Keep the trusted config beside the tools installation instead.
        case "$SUITE" in
          tunarr)
            cat > "$RUNNER_TEMP/recovery-tools/mise.toml" <<'TOML'
        [tools]
        python = "3.14.7"
        node = "24.21.0"
        yq = "4.53.6"
        kubectl = "1.37.1"
        helm = "4.3.0"
        jq = "1.8.2"
        flux2 = "2.9.5"
        TOML
            ;;
          deadlines)
            cat > "$RUNNER_TEMP/recovery-tools/mise.toml" <<'TOML'
        [tools]
        python = "3.14.7"
        yq = "4.53.6"
        kyverno = "1.19.1"
        TOML
            ;;
          postgres-*)
            cat > "$RUNNER_TEMP/recovery-tools/mise.toml" <<'TOML'
        [tools]
        python = "3.14.7"
        yq = "4.53.6"
        kustomize = "5.8.1"
        kubectl = "1.37.1"
        helm = "4.3.0"
        jq = "1.8.2"
        flux2 = "2.9.5"
        TOML
            ;;
          mixed-*|identities)
            cat > "$RUNNER_TEMP/recovery-tools/mise.toml" <<'TOML'
        [tools]
        python = "3.14.7"
        TOML
            ;;
        esac
        printf 'TMPDIR=%s\nMISE_TRUSTED_CONFIG_PATHS=%s/recovery-tools\n' \
          "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

    - name: Checkout exact candidate
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: shamubernetes/home-k8s
        ref: ${{ inputs.commit }}
        persist-credentials: false
        fetch-depth: 1

    - name: Verify checkout identity
      env:
        COMMIT: ${{ inputs.commit }}
      run: |
        set -euo pipefail
        [[ $(git rev-parse HEAD) == "$COMMIT" ]]
        printf 'Candidate: %s\n' "$COMMIT" >> "$GITHUB_STEP_SUMMARY"

    # Keep tooling outside the candidate checkout. Do not load its Mise hooks,
    # credential paths or unrelated tools. Export real bin paths, not Mise shims.
    - name: Setup recovery tools
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        version: 2026.9.14
        working_directory: ${{ runner.temp }}/recovery-tools
        cache: true
        cache_key_prefix: recovery-${{ inputs.suite }}-v2
        fetch_from_github: false
        github_token: ""
        env: true
        add_shims_to_path: false
        export_path: true

    - name: Verify exported recovery tools
      env:
        SUITE: ${{ inputs.suite }}
      run: |
        set -euo pipefail
        [[ $(python3 --version) == 'Python 3.14.7' ]]
        case "$SUITE" in
          tunarr) tools=(python3 node yq kubectl helm jq flux) ;;
          deadlines) tools=(python3 yq kyverno) ;;
          postgres-*) tools=(python3 yq kustomize kubectl helm jq flux) ;;
          mixed-*|identities) tools=(python3) ;;
          *) exit 1 ;;
        esac
        for tool in "${tools[@]}"; do
          actual=$(command -v "$tool")
          expected=$(cd "$RUNNER_TEMP/recovery-tools" && mise which "$tool")
          [[ $actual == "$expected" ]] || { echo "Unexpected PATH resolution for $tool" >&2; exit 1; }
          printf '%s: %s\n' "$tool" "$actual" >> "$GITHUB_STEP_SUMMARY"
        done

    - name: Tunarr host recovery regressions
      if: ${{ inputs.suite == 'tunarr' }}
      run: python3 scripts/tests/test_tunarr_kopiur_host.py -v

    - name: Pull exact native fixture images into ARC DinD
      if: ${{ inputs.suite == 'tunarr' }}
      run: |
        set -euo pipefail
        docker info >/dev/null
        python3 - <<'PY'
        import re
        import runpy
        import subprocess

        images = runpy.run_path('scripts/tunarr-kopiur-boot.py')['IMAGES']
        if not isinstance(images, dict) or not images:
            raise ValueError('Missing native fixture images')
        for image in images.values():
            if not isinstance(image, str) or not re.fullmatch(
                r'ghcr\.io/chrisbenincasa/tunarr:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}', image
            ):
                raise ValueError('Native fixture image must use an immutable Tunarr digest')
            subprocess.run(['docker', 'pull', '--platform', 'linux/amd64', image],
                           check=True, timeout=600)
        PY

    - name: Tunarr native schema and isolated boot regressions
      if: ${{ inputs.suite == 'tunarr' }}
      run: python3 scripts/tests/test_tunarr_kopiur.py -v

    - name: Offline Tunarr application validation
      if: ${{ inputs.suite == 'tunarr' }}
      run: scripts/validate-app --offline media/tunarr

    - name: Offline mover deadline policy regressions
      if: ${{ inputs.suite == 'deadlines' }}
      run: python3 scripts/tests/test_kopiur_mover_deadlines.py -v

    # No GitHub credential storage or Kubernetes access is added. The operator
    # feeds the approved service identities through the exact runner's stdin.
    - name: Real backend identity and encryption qualification
      if: ${{ inputs.suite == 'identities' }}
      run: python3 scripts/kopiur-identity-transport.py --serve

    - name: PostgreSQL manifest and unit regressions
      if: ${{ startsWith(inputs.suite, 'postgres-') }}
      run: python3 -m unittest discover -s scripts/tests -p test_kopiur_postgres.py -v

    - name: Offline PostgreSQL application validation
      if: ${{ startsWith(inputs.suite, 'postgres-') }}
      env:
        SUITE: ${{ inputs.suite }}
      run: scripts/validate-app --offline "arrs/${SUITE#postgres-}"

    - name: Pull selected database fixture images into ARC DinD
      if: ${{ startsWith(inputs.suite, 'postgres-') || startsWith(inputs.suite, 'mixed-') }}
      env:
        SUITE: ${{ inputs.suite }}
      run: |
        set -euo pipefail
        docker info >/dev/null
        python3 - <<'PY'
        import ast
        import os
        from pathlib import Path
        import re
        import runpy
        import subprocess

        suite = os.environ['SUITE']
        if suite.startswith('postgres-'):
            fixture = runpy.run_path('scripts/kopiur-postgres-drill')
            images = [fixture['PG_IMAGE'], fixture['CONTRACTS'][suite.removeprefix('postgres-')][0]]
        else:
            # Read constants without running the mixed fixture's scratch setup.
            required = {
                'mixed-grimmory': ('MARIA', 'GRIMM'),
                'mixed-tubearchivist': ('TA', 'ES', 'REDIS'),
            }[suite]
            tree = ast.parse(Path('scripts/k8s92-mixed-db-test.py').read_text())
            constants = {}
            for statement in tree.body:
                if isinstance(statement, ast.Assign):
                    for target in statement.targets:
                        if isinstance(target, ast.Name) and target.id in required:
                            if target.id in constants:
                                raise ValueError('Duplicate native fixture image constant')
                            constants[target.id] = ast.literal_eval(statement.value)
            images = [constants[name] for name in required]
        for image in images:
            if not isinstance(image, str) or not re.fullmatch(
                r'[A-Za-z0-9./:_-]+@sha256:[0-9a-f]{64}', image
            ):
                raise ValueError('Native fixture image must use an immutable digest')
            subprocess.run(['docker', 'pull', '--platform', 'linux/amd64', image],
                           check=True, timeout=600)
        PY

    - name: PostgreSQL native application recovery fixture
      if: ${{ startsWith(inputs.suite, 'postgres-') }}
      env:
        SUITE: ${{ inputs.suite }}
        DOCKER_DEFAULT_PLATFORM: linux/amd64
      run: python3 scripts/kopiur-postgres-drill --fixture --app "${SUITE#postgres-}"

    - name: Mixed database native application recovery fixture
      if: ${{ startsWith(inputs.suite, 'mixed-') }}
      env:
        SUITE: ${{ inputs.suite }}
        DOCKER_DEFAULT_PLATFORM: linux/amd64
        K8S92_COLIMA_ROOT_DISK: "0"
      run: python3 scripts/k8s92-mixed-db-test.py --app "${SUITE#mixed-}"
