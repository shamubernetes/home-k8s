# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-backup-identities
  namespace: ${KS_NAMESPACE}
spec:
  targetNamespace: arrs
  dependsOn:
  - name: external-secrets-secret-store
  - name: bazarr
  - name: radarr
  - name: radarr-3d
  - name: sonarr
  - name: whisparr
  path: ./kubernetes/apps/arrs/kopiur-backup-identities/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: ${KS_GIT_REPO_NAME}
  wait: true
  interval: ${KS_INTERVAL}
  retryInterval: ${KS_RETRY_INTERVAL}
  timeout: 5m
