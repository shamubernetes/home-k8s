# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: konflate
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    config:
      repo: github://shamubernetes/home-k8s
      clusterPath: ""
      refreshInterval: 30m
      rerenderInterval: 12h
      maxDiffConcurrency: 1
      prFilterExpr: '!pr.draft && pr.baseRef == "main"'
      renderForkPrs: false
      restrictEgress: "true"
      mcp: false
      verifyImages: false
      kubeVersion: "1.36.2"
      diffTimeout: 5m
      fetchTimeout: 1m
      closedPrMax: 25
      closedPrTtl: 336h
      statusChecks: false
      prComments: false
    serviceAccount:
      create: true
      automount: false
    ingress:
      enabled: true
      className: internal
      annotations:
        external-dns.alpha.kubernetes.io/target: internal.${HOME_DOMAIN}
      hosts:
      - host: konflate.${HOME_DOMAIN}
        paths:
        - path: /
          pathType: Prefix
    networkPolicy:
      enabled: true
      type: cilium
      allowDNS: true
      egressPorts:
      - 443
    persistence:
      enabled: true
      storageClass: ceph-block
      accessModes:
      - ReadWriteOnce
      size: 5Gi
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    startupProbe:
      httpGet:
        path: /readyz
        port: http
      periodSeconds: 5
      failureThreshold: 30
    monitoring:
      serviceMonitor:
        enabled: true
        interval: 30s
        scrapeTimeout: 10s
