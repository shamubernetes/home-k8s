# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app chaptarr
  namespace: "${KS_NAMESPACE}"
spec:
  targetNamespace: &namespace arrs
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
  - name: cloudnative-pg-cluster
  - name: external-secrets-secret-store
  path: ./kubernetes/apps/arrs/chaptarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: false
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: "${KS_TIMEOUT}"
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      GATUS_INTERNAL_PORT: "8789"
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_SCHEDULE: "${VOLSYNC_SCHEDULE_CHAPTARR}"
      VOLSYNC_R2_SCHEDULE: "${VOLSYNC_R2_SCHEDULE_CHAPTARR}"
---
# Dedicated prepared backends only. No app or capture activation.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: chaptarr-kopiur-backends
  namespace: ${KS_NAMESPACE}
spec:
  targetNamespace: arrs
  dependsOn:
    - name: external-secrets-secret-store
    - name: kopiur
  path: ./kubernetes/apps/arrs/chaptarr/backup-backends
  prune: true
  sourceRef:
    kind: GitRepository
    name: ${KS_GIT_REPO_NAME}
  wait: true
  interval: ${KS_INTERVAL}
  retryInterval: ${KS_RETRY_INTERVAL}
  timeout: ${KS_TIMEOUT}
