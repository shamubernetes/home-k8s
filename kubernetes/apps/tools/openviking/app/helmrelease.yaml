# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app openviking
spec:
  interval: 10m
  timeout: 20m
  chartRef:
    kind: OCIRepository
    name: openviking
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      openviking:
        type: deployment
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          bootstrap-oauth:
            image:
              repository: docker.io/library/busybox
              tag: latest@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
            - /bin/sh
            - -c
            args:
            - |
              set -eu
              if [ ! -s /auth/codex_auth.json ]; then
                cp /bootstrap/auth.json /auth/codex_auth.json
                chmod 0600 /auth/codex_auth.json
              fi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
        containers:
          app:
            image:
              repository: ghcr.io/volcengine/openviking
              tag: v0.4.17.1@sha256:14553ec16f2bda9bd08a188cffb659fcfff4fde5891cbb881ed1bd8488b23294
            command:
            - /bin/sh
            - -c
            args:
            - |
              until curl -fsS http://127.0.0.1:11434/api/tags | grep -q 'qwen3-embedding:0.6b'; do sleep 2; done
              exec openviking-entrypoint
            env:
              OPENVIKING_CODEX_AUTH_PATH: /auth/codex_auth.json
              OPENVIKING_CONFIG_FILE: /tmp/ov.conf
              OPENVIKING_CONF_CONTENT:
                valueFrom:
                  secretKeyRef:
                    name: openviking-secret
                    key: OPENVIKING_CONF_CONTENT
              OPENVIKING_PUBLIC_BASE_URL: https://openviking.${HOME_DOMAIN}
              OPENVIKING_SERVER_HOST: 0.0.0.0
              OPENVIKING_WITH_BOT: "0"
              TZ: ${TIMEZONE}
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 1933
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 12
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
          ollama:
            image:
              repository: docker.io/ollama/ollama
              tag: 0.33.2@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
            env:
              HOME: /tmp
              OLLAMA_HOST: 0.0.0.0:11434
              OLLAMA_KEEP_ALIVE: 10m
              OLLAMA_MODELS: /models
              OLLAMA_NUM_PARALLEL: "1"
            lifecycle:
              postStart:
                exec:
                  command:
                  - /bin/sh
                  - -c
                  - |
                    until OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1; do sleep 2; done
                    OLLAMA_HOST=http://127.0.0.1:11434 ollama pull qwen3-embedding:0.6b
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/tags
                    port: &ollamaPort 11434
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/tags
                    port: *ollamaPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 12
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/tags
                    port: *ollamaPort
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 240
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 2Gi
    defaultPodOptions:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: openviking
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          openviking:
            app:
            - path: /app/.openviking
      auth:
        type: persistentVolumeClaim
        suffix: auth
        retain: true
        accessMode: ReadWriteOnce
        size: 100Mi
        storageClass: ceph-block
        advancedMounts:
          openviking:
            bootstrap-oauth:
            - path: /auth
            app:
            - path: /auth
      oauth-bootstrap:
        type: secret
        name: openviking-secret
        items:
        - key: CODEX_AUTH_JSON
          path: auth.json
        advancedMounts:
          openviking:
            bootstrap-oauth:
            - path: /bootstrap/auth.json
              subPath: auth.json
              readOnly: true
      models:
        type: persistentVolumeClaim
        suffix: models
        retain: true
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: ceph-block
        advancedMounts:
          openviking:
            ollama:
            - path: /models
      tmp:
        type: emptyDir
        advancedMounts:
          openviking:
            app:
            - path: /tmp
