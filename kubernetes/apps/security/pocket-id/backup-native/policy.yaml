# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: pocket-id-native
spec:
  repository:
    kind: Repository
    name: pocket-id-nas-smb
  identity:
    username: pocket-id
    hostname: security
  sources:
    - pvc:
        name: pocket-id-kopiur-capture
      sourcePathOverride: /pvc/pocket-id-kopiur-capture
      readOnly: true
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  staging:
    timeout: 10m
    storageClassName: ceph-block
    accessModes:
      - ReadWriteOnce
  defaultDeletionPolicy: Retain
  retention:
    keepDaily: 7
    keepWeekly: 4
  mover:
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
      runAsNonRoot: true
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 1Gi
  verification:
    quick:
      schedule:
        cron: 20 21 * * *
        jitter: 10m
      maxErrors: 0
    deep:
      schedule:
        cron: 20 22 * * 0
        jitter: 10m
      capacity: 2Gi
      storageClassName: ceph-block
    successExpr: snapshot != null && stats.errors == 0
    verifyFilesPercent: 100
  hooks:
    beforeSnapshot:
      - runJob:
          jobSpec:
            backoffLimit: 0
            activeDeadlineSeconds: 600
            ttlSecondsAfterFinished: 86400
            template:
              metadata:
                labels:
                  backup.home.arpa/cohort: k92-system
                  backup.home.arpa/app: pocket-id
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext:
                  runAsUser: 568
                  runAsGroup: 568
                  fsGroup: 568
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                initContainers:
                  - name: objects
                    image: docker.io/amazon/aws-cli:2.39.2@sha256:ed0f6b551cd77b6f34e240488739e4cb90b7534409d404a0c9a2be05c4690ca1
                    command:
                      - sh
                      - -ec
                      - |
                        set -eu
                        umask 077
                        rm -rf /capture/pending
                        mkdir -m 700 /capture/pending
                        aws --endpoint-url http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc.cluster.local:80 s3api list-objects-v2 --bucket "$BUCKET" --query 'Contents[].{Key:Key,ETag:ETag,Size:Size}' > /capture/pending/objects-before.json 2>/dev/null
                        aws --endpoint-url http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc.cluster.local:80 s3 sync "s3://$BUCKET" /capture/pending/rgw --only-show-errors 2>/dev/null
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
                    resources:
                      requests:
                        cpu: 25m
                        memory: 128Mi
                      limits:
                        memory: 1Gi
                    volumeMounts:
                      - name: capture
                        mountPath: /capture
                      - name: tmp
                        mountPath: /tmp
                    env:
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom:
                          secretKeyRef:
                            name: pocket-id-bucket
                            key: AWS_ACCESS_KEY_ID
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom:
                          secretKeyRef:
                            name: pocket-id-bucket
                            key: AWS_SECRET_ACCESS_KEY
                      - name: AWS_DEFAULT_REGION
                        value: us-east-1
                      - name: AWS_EC2_METADATA_DISABLED
                        value: "true"
                      - name: AWS_PAGER
                        value: ""
                      - name: BUCKET
                        valueFrom:
                          configMapKeyRef:
                            name: pocket-id-bucket
                            key: BUCKET_NAME
                  - name: database
                    image: docker.io/library/postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
                    command:
                      - sh
                      - -ec
                      - |
                        set -eu
                        umask 077
                        mkdir -p /capture/pending
                        pg_dump --format=custom --no-owner --no-privileges --file=/capture/pending/database.dump 2>/dev/null || { printf 'online database export failed\n' >&2; exit 1; }
                        pg_restore --list /capture/pending/database.dump >/dev/null 2>&1
                        test -s /identity/ENCRYPTION_KEY
                        cp /identity/ENCRYPTION_KEY /capture/pending/ENCRYPTION_KEY
                        chmod 600 /capture/pending/ENCRYPTION_KEY
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
                    resources:
                      requests:
                        cpu: 25m
                        memory: 128Mi
                      limits:
                        memory: 1Gi
                    volumeMounts:
                      - name: capture
                        mountPath: /capture
                      - name: tmp
                        mountPath: /tmp
                      - name: identity
                        mountPath: /identity
                        readOnly: true
                    env:
                      - name: PGHOST
                        value: postgres17-rw.database.svc.cluster.local
                      - name: PGPORT
                        value: "5432"
                      - name: PGSSLMODE
                        value: require
                      - name: PGCONNECT_TIMEOUT
                        value: "15"
                      - name: PGUSER
                        valueFrom:
                          secretKeyRef:
                            name: pocket-id-kopiur-postgres
                            key: PGUSER
                      - name: PGPASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: pocket-id-kopiur-postgres
                            key: PGPASSWORD
                      - name: PGDATABASE
                        valueFrom:
                          secretKeyRef:
                            name: pocket-id-kopiur-postgres
                            key: PGDATABASE
                  - name: database-references
                    image: docker.io/library/postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
                    command:
                      - sh
                      - -ec
                      - |
                        set -eu
                        umask 077
                        unset PGPASSWORD PGDATABASE PGSSLMODE
                        export PGHOST=/tmp PGPORT=5432 PGUSER=kopiur_validator
                        # Official PG image supports arbitrary non-root UIDs through nss_wrapper.
                        if ! getent passwd "$(id -u)" >/dev/null; then
                          export LD_PRELOAD=''
                          for library in /usr/lib/*/libnss_wrapper.so /usr/lib/libnss_wrapper.so; do
                            if test -f "$library"; then export LD_PRELOAD="$library"; break; fi
                          done
                          test -n "$LD_PRELOAD"
                          printf 'kopiur_validator:x:%s:%s::/tmp:/bin/sh\n' "$(id -u)" "$(id -g)" > /tmp/nss-passwd
                          printf 'kopiur_validator:x:%s:\n' "$(id -g)" > /tmp/nss-group
                          export NSS_WRAPPER_PASSWD=/tmp/nss-passwd NSS_WRAPPER_GROUP=/tmp/nss-group
                        fi
                        initdb -D /tmp/validation-db -U kopiur_validator -A trust >/dev/null 2>&1
                        trap 'pg_ctl -D /tmp/validation-db -m immediate -w stop >/dev/null 2>&1 || true' EXIT
                        pg_ctl -D /tmp/validation-db -l /tmp/validation.log -o "-k /tmp -c listen_addresses=''" -w start >/dev/null 2>&1
                        pg_restore --no-owner --no-privileges --exit-on-error -d postgres /capture/pending/database.dump >/dev/null 2>&1
                        psql -XAt -v ON_ERROR_STOP=1 -d postgres -f /scripts/references.sql > /capture/pending/required-objects.json 2>/dev/null
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
                    resources:
                      requests:
                        cpu: 25m
                        memory: 128Mi
                      limits:
                        memory: 1Gi
                    volumeMounts:
                      - name: capture
                        mountPath: /capture
                      - name: tmp
                        mountPath: /tmp
                      - name: script
                        mountPath: /scripts
                        readOnly: true
                    env: []
                  - name: objects-validate
                    image: docker.io/amazon/aws-cli:2.39.2@sha256:ed0f6b551cd77b6f34e240488739e4cb90b7534409d404a0c9a2be05c4690ca1
                    command:
                      - sh
                      - -ec
                      - |
                        set -eu
                        umask 077
                        aws --endpoint-url http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc.cluster.local:80 s3api list-objects-v2 --bucket "$BUCKET" --query 'Contents[].{Key:Key,ETag:ETag,Size:Size}' > /capture/pending/objects-after.json 2>/dev/null
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
                    resources:
                      requests:
                        cpu: 25m
                        memory: 128Mi
                      limits:
                        memory: 1Gi
                    volumeMounts:
                      - name: capture
                        mountPath: /capture
                      - name: tmp
                        mountPath: /tmp
                    env:
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom:
                          secretKeyRef:
                            name: pocket-id-bucket
                            key: AWS_ACCESS_KEY_ID
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom:
                          secretKeyRef:
                            name: pocket-id-bucket
                            key: AWS_SECRET_ACCESS_KEY
                      - name: AWS_DEFAULT_REGION
                        value: us-east-1
                      - name: AWS_EC2_METADATA_DISABLED
                        value: "true"
                      - name: AWS_PAGER
                        value: ""
                      - name: BUCKET
                        valueFrom:
                          configMapKeyRef:
                            name: pocket-id-bucket
                            key: BUCKET_NAME
                containers:
                  - name: publish
                    image: ghcr.io/home-operations/home-assistant:2026.10.4@sha256:81271a8bbe2a6019659e9d5cde98b884dd0d67fad6819bb4ab177dceb0c1c5e1
                    command:
                      - sh
                      - -ec
                      - |
                        set -eu
                        umask 077
                        python /scripts/validate.py
                        rm -rf /capture/previous
                        if test -d /capture/current; then mv /capture/current /capture/previous; fi
                        mv /capture/pending /capture/current
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
                    resources:
                      requests:
                        cpu: 25m
                        memory: 128Mi
                      limits:
                        memory: 1Gi
                    volumeMounts:
                      - name: capture
                        mountPath: /capture
                      - name: tmp
                        mountPath: /tmp
                      - name: script
                        mountPath: /scripts
                        readOnly: true
                    env: []
                volumes:
                  - name: capture
                    persistentVolumeClaim:
                      claimName: pocket-id-kopiur-capture
                  - name: tmp
                    emptyDir: {}
                  - name: identity
                    secret:
                      secretName: pocket-id-secret
                      items:
                        - key: ENCRYPTION_KEY
                          path: ENCRYPTION_KEY
                  - name: script
                    configMap:
                      name: pocket-id-native-validation
          timeout: 12m
          continueOnFailure: false
  suspend: false
