# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Availability Gate

on:
  # This gate always executes from the trusted default-branch workflow.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: ["main"]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: "image-availability-gate-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  gate:
    name: Evaluate Talos image availability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Publish pending exact-head gate
      id: pending
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPOSITORY: ${{ github.repository }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        RUN_ID: ${{ github.run_id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        check_id=$(jq -n \
          --arg external_id "talos-image-availability:${RUN_ID}:${RUN_ATTEMPT}" \
          --arg head_sha "$HEAD_SHA" \
          --arg url "$RUN_URL" \
          '{
            name: "Talos Image Availability",
            head_sha: $head_sha,
            status: "in_progress",
            external_id: $external_id,
            details_url: $url,
            output: {
              title: "Talos Image Availability",
              summary: "Checking registry availability for the exact pull request head."
            }
          }' | gh api \
            "repos/${REPOSITORY}/check-runs" \
            --method POST \
            --header 'Accept: application/vnd.github+json' \
            --input - \
            --jq '.id')
        printf 'check_id=%s\n' "$check_id" >> "$GITHUB_OUTPUT"

    - name: Checkout trusted gate
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/heads/main
        path: trusted
        persist-credentials: false

    - name: Classify trusted pull request scope
      id: scope
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        EVENT_ACTION: ${{ github.event.action }}
        EVENT_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
        GH_TOKEN: ${{ github.token }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PULL_REQUEST: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        if [[ $HEAD_REPOSITORY != "$REPOSITORY" ]]; then
          echo 'Registry inspection is not available to fork pull requests.'
          exit 0
        fi
        pr_json=$(gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST}")
        [[ $(jq -r '.head.sha' <<<"$pr_json") == "$HEAD_SHA" ]]
        expected_file_count=$(jq -er \
          '.changed_files | select(type == "number" and . >= 1 and floor == .)' \
          <<<"$pr_json")
        gh api --paginate --slurp \
          "repos/${REPOSITORY}/pulls/${PULL_REQUEST}/files?per_page=100" \
          > changed-files.json
        trusted/scripts/talos-pr-files \
          --expected-count "$expected_file_count" \
          changed-files.json > changed-files.txt
        scope=$(trusted/scripts/talos-image-gate-scope < changed-files.txt)
        if [[ $scope != applicable ]]; then
          echo 'No eligible Kubernetes application changes require Talos image availability.'
          exit 0
        fi

        printf 'applicable=true\n' >> "$GITHUB_OUTPUT"

    - name: Setup trusted inspection tools
      if: steps.scope.outputs.applicable == 'true'
      uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      with:
        working_directory: trusted
        install_args: python crane
        cache: true
        fetch_from_github: false

    - name: Resolve trusted pull request metadata
      id: metadata
      if: steps.scope.outputs.applicable == 'true'
      env:
        EVENT_ACTION: ${{ github.event.action }}
        EVENT_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        pr=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
        metadata=$(jq -c '.pull_request | {number, base_sha: .base.sha, head_sha: .head.sha, head_repo: .head.repo.full_name}' "$GITHUB_EVENT_PATH")
        trigger_id="pull_request_target:${pr}:${EVENT_ACTION}:${EVENT_UPDATED_AT}"
        [[ $(jq -r '.head_repo' <<<"$metadata") == "$REPOSITORY" ]]
        {
          printf 'pull_request=%s\n' "$pr"
          printf 'base_sha=%s\n' "$(jq -r '.base_sha' <<<"$metadata")"
          printf 'head_sha=%s\n' "$(jq -r '.head_sha' <<<"$metadata")"
          printf 'trigger_id=%s\n' "$trigger_id"
        } >> "$GITHUB_OUTPUT"

    - name: Checkout pull request head
      if: steps.scope.outputs.applicable == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ steps.metadata.outputs.head_sha }}
        path: head
        persist-credentials: false

    - name: Checkout exact pull request base
      if: steps.scope.outputs.applicable == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ steps.metadata.outputs.base_sha }}
        path: base
        persist-credentials: false

    - name: Setup Flate
      if: steps.scope.outputs.applicable == 'true'
      uses: home-operations/flate/action@bbb6ebc344da051752dbdb1b413860ceffcfb63d # v0.7.3
      with:
        base: ""
        cache: true
        version: 0.6.5

    - name: Render base and head image inventories
      if: steps.scope.outputs.applicable == 'true'
      env:
        GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        GHCR_USERNAME: ${{ vars.GHCR_READ_USERNAME }}
      run: |
        set -euo pipefail
        registry_config=$(mktemp)
        trap 'rm -f "$registry_config"' EXIT
        auth=$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_TOKEN" | base64 | tr -d '\n')
        jq -n --arg auth "$auth" '{auths:{"ghcr.io":{auth:$auth}}}' > "$registry_config"

        python3 - <<'PY'
        from pathlib import Path
        manifest = """apiVersion: v1
        kind: ConfigMap
        metadata:
          name: loki-bucket
          namespace: observability
        data:
          BUCKET_NAME: flate-offline-placeholder
          BUCKET_REGION: us-east-1
        """
        for checkout in (Path("base"), Path("head")):
            values = checkout / "kubernetes/flux/vars/flate-ci-values.yaml"
            values.write_text(manifest)
            kustomization = checkout / "kubernetes/flux/vars/kustomization.yaml"
            content = kustomization.read_text().replace(
                "resources:\n", "resources:\n- ./flate-ci-values.yaml\n", 1
            )
            kustomization.write_text(content)
        PY

        for checkout in base head; do
          trusted/scripts/render-flate-image-inventory \
            --checkout "$checkout" \
            --registry-config "$registry_config" \
            --output "$PWD/${checkout}-images.json"
        done

    - name: Build and inspect commit-bound image plan
      if: steps.scope.outputs.applicable == 'true'
      env:
        GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        GHCR_USERNAME: ${{ vars.GHCR_READ_USERNAME }}
        BASE_SHA: ${{ steps.metadata.outputs.base_sha }}
        HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
        PULL_REQUEST: ${{ steps.metadata.outputs.pull_request }}
        REPOSITORY: ${{ github.repository }}
        TRIGGER_ID: ${{ steps.metadata.outputs.trigger_id }}
      run: |
        set -euo pipefail
        trusted/scripts/talos-image-plan build \
          --base-inventory base-images.json \
          --head-inventory head-images.json \
          --repository "$REPOSITORY" \
          --pull-request "$PULL_REQUEST" \
          --base-sha "$BASE_SHA" \
          --head-sha "$HEAD_SHA" \
          --trigger-id "$TRIGGER_ID" \
          --output image-plan.json
        trusted/scripts/talos-image-plan verify \
          --plan image-plan.json \
          --repository "$REPOSITORY" \
          --pull-request "$PULL_REQUEST" \
          --base-sha "$BASE_SHA" \
          --head-sha "$HEAD_SHA" \
          --trigger-id "$TRIGGER_ID" > images.json
        export DOCKER_CONFIG
        DOCKER_CONFIG=$(mktemp -d)
        trap 'rm -rf "$DOCKER_CONFIG"' EXIT
        auth=$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_TOKEN" | base64 | tr -d '\n')
        jq -n --arg auth "$auth" '{auths:{"ghcr.io":{auth:$auth}}}' > "$DOCKER_CONFIG/config.json"
        python3 trusted/scripts/check-registry-image-availability \
          --images-json "$(cat images.json)"

    - name: Complete exact-head gate
      if: ${{ always() && steps.pending.outputs.check_id != '' }}
      env:
        CHECK_ID: ${{ steps.pending.outputs.check_id }}
        GATE_RESULT: ${{ job.status }}
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        conclusion=failure
        summary='Talos image availability evaluation failed or did not complete.'
        if [[ $GATE_RESULT == success ]]; then
          conclusion=success
          summary='Changed pinned images are registry-accessible for linux/amd64, or no eligible changes require inspection.'
        fi
        jq -n \
          --arg conclusion "$conclusion" \
          --arg summary "$summary" \
          '{
            status: "completed",
            conclusion: $conclusion,
            output: {
              title: "Talos Image Availability",
              summary: $summary
            }
          }' | gh api \
            "repos/${REPOSITORY}/check-runs/${CHECK_ID}" \
            --method PATCH \
            --header 'Accept: application/vnd.github+json' \
            --input - >/dev/null
