# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/homelab.rafaribe.com/volsyncmonitor_v1alpha1.json
apiVersion: homelab.rafaribe.com/v1alpha1
kind: VolSyncMonitor
metadata:
  # A new identity retries jobs deduplicated by the old false-success template.
  name: volsync-monitor-safe-unlock
spec:
  # Enable the monitor
  enabled: true
  # Scan for failed jobs every 30 seconds
  scanInterval: 30s
  # Monitor ALL namespaces for VolSync jobs (namePrefix matches job names)
  jobSelector:
    namePrefix: "volsync-"
  # Remove failed jobs after creating unlock jobs
  removeFailedJobs: true
  # Cleanup unlock jobs after 1 hour
  ttlSecondsAfterFinished: 3600
  # Unlock job template - inherits environment variables, volumes, and mounts from failed job
  unlockJobTemplate:
    image: restic/restic:latest@sha256:9940e6c7421ab3a21ee9fdc4e91596d04c792b600d31b102696c75cbf3ac4481
    command: ["/bin/sh"]
    args:
    - "-c"
    - |
      set -eu
      echo "Unlocking stale locks for failed job: $FAILED_JOB_NAME"
      # The inherited cache can be owned by a different UID. Unlock needs no cache.
      # Keep active locks intact and propagate failures instead of reporting success.
      restic --no-cache unlock
      echo "Stale repository locks removed successfully"
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
