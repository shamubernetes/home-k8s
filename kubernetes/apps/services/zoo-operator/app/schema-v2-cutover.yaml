apiVersion: v1
kind: ServiceAccount
metadata:
  name: zoo-schema-v2-cutover
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zoo-schema-v2-cutover
rules:
- apiGroups: [zoo.thezoo.house]
  resources: [zoos]
  resourceNames: [zoo]
  verbs: [get, patch]
- apiGroups: [helm.toolkit.fluxcd.io]
  resources: [helmreleases]
  resourceNames: [zoo-operator]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zoo-schema-v2-cutover
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zoo-schema-v2-cutover
subjects:
- kind: ServiceAccount
  name: zoo-schema-v2-cutover
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zoo-schema-v2-cutover-v5
  labels:
    app.kubernetes.io/name: zoo-schema-v2-cutover
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zoo-schema-v2-cutover
    spec:
      serviceAccountName: zoo-schema-v2-cutover
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: fetch-helmrelease
        image: docker.io/bitnami/kubectl:latest@sha256:1a86ba502f618724fd493f6a2b129f060454db04f06faa58d8ed94510280b17f
        command: [/bin/sh, -c]
        args:
        - kubectl get helmrelease zoo-operator -o json > /work/helmrelease.json
        volumeMounts:
        - {name: work, mountPath: /work}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        securityContext: &container-security
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
      - name: build-patch
        image: docker.io/library/python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
        command: [python3, -c]
        args:
        - |
          import json
          from pathlib import Path

          document = json.loads(Path('/work/helmrelease.json').read_text())
          services = document['spec']['values']['zoo']['spec']['services']
          if not isinstance(services, list) or not services:
              raise SystemExit('HelmRelease services must be a nonempty list')
          patch = {'spec': {'services': services}}
          Path('/work/patch.json').write_text(json.dumps(patch, separators=(',', ':')))
        volumeMounts:
        - {name: work, mountPath: /work}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        securityContext: *container-security
      - name: apply-patch
        image: docker.io/bitnami/kubectl:latest@sha256:1a86ba502f618724fd493f6a2b129f060454db04f06faa58d8ed94510280b17f
        command: [/bin/sh, -c]
        args:
        - |
          set -eu
          kubectl patch zoo zoo --type=merge --patch-file=/work/patch.json
          kubectl get zoo zoo -o json > /work/zoo.json
        volumeMounts:
        - {name: work, mountPath: /work}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        securityContext: *container-security
      containers:
      - name: verify
        image: docker.io/library/python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
        command: [python3, -c]
        args:
        - |
          import json
          from pathlib import Path

          document = json.loads(Path('/work/zoo.json').read_text())
          services = document['spec']['services']
          names = {service['name'] for service in services}
          if names != {'gate', 'zoo', 'cowbell'}:
              raise SystemExit(f'unexpected service set: {sorted(names)}')
        volumeMounts:
        - {name: work, mountPath: /work}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        securityContext: *container-security
      volumes:
      - name: work
        emptyDir: {}
