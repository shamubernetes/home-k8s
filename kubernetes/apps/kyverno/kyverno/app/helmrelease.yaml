# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kyverno
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Job
              name: kyverno-migrate-resources
            patch: |-
              - op: replace
                path: /metadata/name
                value: kyverno-migrate-resources-v1-18-2
  values:
    config:
      # This repo uses Kyverno generate rules heavily; keep UR threshold above the
      # default (1000) to avoid skipping UpdateRequest creation during rollouts.
      updateRequestThreshold: "10000"
    crds:
      install: true
      migration:
        image:
          tag: v1.18.2@sha256:7224ed05508c24419c3df98114c28ba682ad0a940dcdb7b9fdba0a4b6bf943cf
    test:
      image:
        tag: v1.18.2@sha256:4fb1870b1a4adfed0fa7a32b7c3bcaf736fb889c7e1947ee8b20710bc2f5a5ce
    webhooksCleanup:
      image:
        tag: v1.18.2@sha256:4fb1870b1a4adfed0fa7a32b7c3bcaf736fb889c7e1947ee8b20710bc2f5a5ce
    grafana:
      enabled: true
      annotations:
        grafana_folder: Infrastructure
    backgroundController:
      image:
        tag: v1.18.2@sha256:d62566ce41bd0d4a32bf2cf44b9ebfc02c36374f821f83070890287f62f68671
      replicas: 2
      serviceMonitor:
        enabled: true
      rbac:
        clusterRole:
          extraResources:
          - apiGroups:
            - ""
            resources:
            - pods
            - secrets
            verbs:
            - create
            - update
            - patch
            - delete
            - get
            - list
          - apiGroups:
            - external-secrets.io
            resources:
            - pushsecrets
            verbs:
            - create
            - update
            - patch
            - delete
            - get
            - list
      nodeAffinity: &nodeAffinity
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
      tolerations: &tolerations
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
      topologySpreadConstraints:
        - &constraint
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: &key kyverno-background
              app.kubernetes.io/component: *key
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 192Mi
    cleanupController:
      image:
        tag: v1.18.2@sha256:b0395d29ae332276e6910eb40418be9bc127c068d659f90aa1bcddd6be99ccb4
      replicas: 2
      serviceMonitor:
        enabled: true
      nodeAffinity: *nodeAffinity
      tolerations: *tolerations
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: &key kyverno-cleanup
            app.kubernetes.io/component: *key
    reportsController:
      image:
        tag: v1.18.2@sha256:f09cf305170014e191b94e1c54f5be73163d8824eefad49349675c4efe43159a
      replicas: 2
      serviceMonitor:
        enabled: true
      nodeAffinity: *nodeAffinity
      tolerations: *tolerations
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: &key kyverno-reports
            app.kubernetes.io/component: *key
    admissionController:
      initContainer:
        image:
          tag: v1.18.2@sha256:cd8cb4a31d25b3992734fb8f24a90ef691c90ce49338c89bea96792160eacb98
      replicas: 3
      serviceMonitor:
        enabled: true
      rbac:
        clusterRole:
          extraResources:
          - apiGroups:
            - ""
            resources:
            - pods
            verbs:
            - create
            - update
            - delete
          # Kyverno's validate-policy webhook runs in the admission-controller and
          # checks if it can read the resources referenced by generate rules.
          - apiGroups:
            - ""
            resources:
            - secrets
            verbs:
            - get
            - list
            - watch
          - apiGroups:
            - external-secrets.io
            resources:
            - pushsecrets
            verbs:
            - get
            - list
            - watch
      container:
        image:
          tag: v1.18.2@sha256:0a540e2ddf74d0d2d3d45f9ef248d7dbc96576accdbcc6a2dd7eaff9fea56504
        resources:
          requests:
            cpu: 500m
            memory: 384Mi
          limits:
            memory: 512Mi
      nodeAffinity: *nodeAffinity
      tolerations: *tolerations
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: &key kyverno-admission
            app.kubernetes.io/component: *key
