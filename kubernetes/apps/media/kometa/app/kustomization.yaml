# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./externalsecret-kopiur.yaml
- ./kopiur-repositories.yaml
- ./kopiur-policy.yaml
- ./kopiur-existing-originals.yaml
- ./kopiur-sqlite-originals.yaml
- ./ocirepository.yaml
- ./legacy-recovery-secrets.yaml
- ./externalsecret.yaml
- ./helmrelease.yaml
configMapGenerator:
- name: kometa-config
  files:
  - config.yml=./configs/config.yml
  - kids-movies.yml=./configs/kids-movies.yml
  - kids-tv.yml=./configs/kids-tv.yml
generatorOptions:
  disableNameSuffixHash: true
components:
- ../../../../components/kopiur-sqlite-originals
