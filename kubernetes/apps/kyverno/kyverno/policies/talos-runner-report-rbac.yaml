# yaml-language-server: $schema=https://k8s-schemas.pages.dev/rbac.authorization.k8s.io/clusterrole_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:reports-controller:talos-runner-boundary
  labels:
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
- apiGroups: [""]
  resources: [pods/ephemeralcontainers]
  verbs: [get, list, watch]
- apiGroups: [talos.dev]
  resources: [serviceaccounts]
  verbs: [get, list, watch]
