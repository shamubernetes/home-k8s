apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: pocket-id-nas-smb
spec:
  backend:
    rclone:
      remotePath: mnemosyne:kopiur-pocket-id
      configSecretRef:
        name: pocket-id-kopiur-nas
      startupTimeout: 2m
  encryption:
    passwordSecretRef:
      name: pocket-id-kopiur-nas
      key: KOPIA_PASSWORD
  create:
    enabled: true
  scheduleDefaults:
    timezone: America/New_York
  deletionProtection:
    threshold: 10
  health:
    probe:
      enabled: true
      interval: 5m
      failureThreshold: 3
      onFailure: Degrade
  maintenance:
    enabled: false
  moverDefaults:
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 1Gi
---
apiVersion: kopiur.home-operations.com/v1alpha1
