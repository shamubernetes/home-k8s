data_dir: /vector-data-dir
api:
  enabled: true
  address: 0.0.0.0:8686

#
# Sources
#

sources:
  journald_source:
    type: vector
    version: "2"
    address: 0.0.0.0:6000

  kubernetes_source:
    type: vector
    version: "2"
    address: 0.0.0.0:6010

#
# Transforms
#

transforms:
  kubernetes_remap:
    type: remap
    inputs: ["kubernetes_source"]
    source: |
      # Standardize 'app' index and ensure sink labels are always renderable
      .custom_app_name = .pod_labels."app.kubernetes.io/name" || .pod_labels.app || .pod_labels."k8s-app" || "unknown"
      .kubernetes.pod_namespace = .kubernetes.pod_namespace || "unknown"
      .kubernetes.pod_node_name = .kubernetes.pod_node_name || "unknown"
      # Keep encoded Loki entries comfortably below the 256 KiB server limit
      if is_string(.message) && length!(.message) > 200000 {
        .message = truncate!(.message, 200000)
      }
      # Drop pod_labels
      del(.pod_labels)

#
# Sinks
#

sinks:
  journald:
    inputs: ["journald_source"]
    type: loki
    dangerously_allow_unconfined_template_resolution: true
    endpoint: http://loki-gateway.observability.svc.cluster.local
    encoding: {codec: json}
    out_of_order_action: accept
    remove_label_fields: true
    remove_timestamp: true
    labels:
      hostname: '{{ host }}'

  kubernetes:
    inputs: ["kubernetes_remap"]
    type: loki
    dangerously_allow_unconfined_template_resolution: true
    endpoint: http://loki-gateway.observability.svc.cluster.local
    encoding: {codec: json}
    out_of_order_action: accept
    remove_label_fields: true
    remove_timestamp: true
    labels:
      app: '{{ custom_app_name }}'
      namespace: '{{ kubernetes.pod_namespace }}'
      node: '{{ kubernetes.pod_node_name }}'
