# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: palworld-settings
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: palworld-settings
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PalWorldSettings.ini: |
          [/Script/Pal.PalGameWorldSettings]
          OptionSettings=(ServerName="The Zoo",ServerDescription="Kilian's Palworld server",ServerPlayerMaxNum=16,AdminPassword="{{ .ADMIN_PASSWORD }}",RESTAPIEnabled=True,RESTAPIPort=8212,AutoSaveSpan=300.000000,bIsUseBackupSaveData=True,CrossplayPlatforms=(Steam,Xbox,PS5,Mac),ExpRate=1.500000,PalCaptureRate=1.500000,PalEggDefaultHatchingTime=0.500000,CollectionDropRate=1.500000,EnemyDropItemRate=1.500000,ItemWeightRate=0.750000,NightTimeSpeedRate=1.500000,PlayerDamageRateAttack=1.250000,PlayerDamageRateDefense=0.750000,DeathPenalty=Item,BaseCampMaxNumInGuild=10,BaseCampWorkerMaxNum=50,MaxBuildingLimitNum=0,BuildObjectDeteriorationDamageRate=0.000000,PlayerStaminaDecreaceRate=0.750000,PlayerStomachDecreaceRate=0.750000,EquipmentDurabilityDamageRate=0.750000,ItemCorruptionMultiplier=0.750000,MonsterFarmActionSpeedRate=1.250000,WorkSpeedRate=2.000000,CollectionObjectRespawnSpeedRate=0.750000,SupplyDropSpan=120,bShowPlayerList=True,PalStomachDecreaceRate=0.500000,PalStaminaDecreaceRate=0.500000,PlayerAutoHPRegeneRate=1.250000,PalAutoHPRegeneRate=1.250000,PlayerAutoHpRegeneRateInSleep=1.500000,PalAutoHpRegeneRateInSleep=1.500000,bEnableNonLoginPenalty=False)
  dataFrom:
    - extract:
        key: palworld