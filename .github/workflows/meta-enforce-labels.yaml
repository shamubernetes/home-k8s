# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Check - Enforce PR labels"

on:
  pull_request:
    types:
    - opened
    - closed
    - synchronize
    - labeled
    - unlabeled

concurrency:
  group: "enforce-pr-labels-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  enforce-label:
    name: Enforce PR labels
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Reject blocking labels
      env:
        PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        if jq -e 'any(.[]; IN("do-not-merge", "broken-links", "hold/upstream"))' <<<"$PR_LABELS" >/dev/null; then
          echo "A blocking label is present." >&2
          exit 1
        fi
