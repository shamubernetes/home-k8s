# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/job-batch-v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: plane-init-uploads-bucket
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-bucket
        image: docker.io/amazon/aws-cli:2.36.24@sha256:cd11f6e909d42f066a03e15f072853fcc19f033e343cb83b2d553e2082cbb5a7
        envFrom:
        - secretRef:
            name: plane-doc-store-secret
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          export AWS_DEFAULT_REGION="${AWS_REGION:-us-east-1}"
          aws --endpoint-url "$AWS_S3_ENDPOINT_URL" --region "$AWS_DEFAULT_REGION" s3 mb "s3://uploads" 2>/dev/null || true
