apiVersion: batch/v1
kind: Job
metadata:
  name: bazarr-kopiur-grants-v1
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazarr-kopiur-grants
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grants
        image: docker.io/library/postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        command: [sh, -ec]
        args:
        - |
          # SQL contains credential interpolation. Suppress all client diagnostics.
          if ! psql -X -w -q -v ON_ERROR_STOP=1 -f /grants/provision.sql >/dev/null 2>/dev/null; then
            printf 'scoped backup grant provisioning failed; diagnostics withheld\n' >&2
            exit 1
          fi
          export PGUSER="$BACKUP_USER" PGPASSWORD="$BACKUP_PASSWORD"
          if ! psql -X -w -q -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM information_schema.tables WHERE table_schema = '\''public'\'';' >/dev/null 2>/dev/null; then
            printf 'backup identity connection readback failed\n' >&2
            exit 1
          fi
          printf 'scoped backup role and connection verified\n'
        env:
        - name: PGHOST
          value: postgres17-rw.database.svc.cluster.local
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: bazarr
        - name: PGSSLMODE
          value: require
        - name: PGCONNECT_TIMEOUT
          value: "10"
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: bazarr-secret
              key: INIT_POSTGRES_SUPER_PASS
        - name: APPLICATION_OWNER
          valueFrom:
            secretKeyRef:
              name: bazarr-secret
              key: POSTGRES_USERNAME
        - name: BACKUP_USER
          valueFrom:
            secretKeyRef:
              name: bazarr-kopiur-postgres
              key: PGUSER
        - name: BACKUP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bazarr-kopiur-postgres
              key: PGPASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: grants
          mountPath: /grants
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: grants
        configMap:
          name: bazarr-kopiur-grants
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 8Mi
