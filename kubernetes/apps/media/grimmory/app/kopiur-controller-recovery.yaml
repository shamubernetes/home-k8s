# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/deployment-apps-v1.json
# Disposable restored-original consumers only. Native probes qualify recovery.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grimmory-k8s92-books-recovery-nas
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app.kubernetes.io/name: grimmory-k8s92-books-recovery
      k8s92-backend: nas
  template:
    metadata:
      annotations:
        k8s92.home.arpa/controller-recovery-attempt: "books-native-probe-v3"
      labels:
        app.kubernetes.io/name: grimmory-k8s92-books-recovery
        k8s92-backend: nas
    spec:
      restartPolicy: Always
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare
          image: docker.io/library/python:3.15-alpine@sha256:1afb480ba8d3b3b7a8439a84f2365ce5c75ac45a79cf07daa091b49235cbe27b
          command:
            - python3
            - -B
            - /contract/consumer-prepare.py
          volumeMounts:
            - name: original
              mountPath: /data/restored
              readOnly: true
            - name: appdata
              mountPath: /appdata
              readOnly: false
            - name: books
              mountPath: /books
              readOnly: false
            - name: tools
              mountPath: /tools
              readOnly: false
            - name: contract
              mountPath: /contract
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
                # Preserve the qualified foreign-GID SGID Books directories.
                - FSETID
            runAsUser: 0
            runAsGroup: 568
            runAsNonRoot: false
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 512Mi
      containers:
        - name: database
          image: docker.io/linuxserver/mariadb:11.8.8@sha256:fbcaa0806a41c80824978de600005b2620567fd557963ea53990de528c310f1f
          command:
            - bash
            - -c
            - set -a; source /tools/database.env; set +a; exec /init >/private/database.log 2>&1
          volumeMounts:
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: control
              mountPath: /control
              readOnly: false
            - name: contract
              mountPath: /contract
              readOnly: true
            - name: original
              mountPath: /original
              readOnly: true
            - name: database
              mountPath: /config
              readOnly: false
            - name: private
              mountPath: /private
              readOnly: false
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 0
            runAsGroup: 568
            runAsNonRoot: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETUID
                - SETGID
                - FOWNER
                - DAC_OVERRIDE
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 1Gi
          lifecycle:
            postStart:
              exec:
                command:
                  - bash
                  - -c
                  - bash /contract/controller-database.sh >/private/database-bootstrap.log 2>&1 &
          livenessProbe:
            exec:
              command:
                - /usr/bin/mariadb-admin
                - ping
                - -h
                - localhost
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            initialDelaySeconds: 30
          readinessProbe:
            exec:
              command:
                - /usr/bin/mariadb-admin
                - ping
                - -h
                - localhost
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            initialDelaySeconds: 30
          startupProbe:
            exec:
              command:
                - /usr/bin/mariadb-admin
                - ping
                - -h
                - localhost
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
        - name: application
          image: docker.io/grimmory/grimmory:v3.5.0@sha256:83597bf02da48a8ec4042fd4d4f58b9631f5b131d6dee7d2fcc5cf3f2eec2526
          command:
            - sh
            - /contract/controller-app.sh
          volumeMounts:
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: control
              mountPath: /control
              readOnly: false
            - name: contract
              mountPath: /contract
              readOnly: true
            - name: appdata
              mountPath: /app/data
              readOnly: false
            - name: books
              mountPath: /books
              readOnly: true
            - name: books
              mountPath: /bookdrop
              subPath: bookdrop
              readOnly: true
            - name: app-tmp
              mountPath: /tmp
            - name: private
              mountPath: /private
              readOnly: false
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
          resources:
            requests:
              cpu: 25m
              memory: 512Mi
            limits:
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: 6060
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: 6060
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            initialDelaySeconds: 30
          startupProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: 6060
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
        - name: verify
          image: docker.io/library/python:3.15-alpine@sha256:1afb480ba8d3b3b7a8439a84f2365ce5c75ac45a79cf07daa091b49235cbe27b
          command:
            - python3
            - -B
            - /contract/controller-verify.py
          volumeMounts:
            - name: control
              mountPath: /control
              readOnly: false
            - name: contract
              mountPath: /contract
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          env:
            - name: BACKEND
              value: nas
          readinessProbe:
            exec:
              command:
                - python3
                - -B
                - -c
                - from pathlib import Path; raise SystemExit(0 if Path('/control/qualification-complete').exists() and not Path('/control/failed').exists() else 1)
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 1
      volumes:
        - name: original
          persistentVolumeClaim:
            claimName: grimmory-k8s92-books-original-nas
            readOnly: true
        - name: contract
          configMap:
            name: grimmory-books-controller-recovery-contract
            defaultMode: 292
        - name: tools
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: control
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: private
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: appdata
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: books
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: app-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: database
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
      terminationGracePeriodSeconds: 60
---
