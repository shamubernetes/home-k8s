# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
- name: pelican-provisioning
  files:
  - ./provisioning/provision.php
  - ./provisioning/catalog/project-zomboid.json
  - ./provisioning/catalog/windrose.json
generatorOptions:
  disableNameSuffixHash: true
resources:
- ./ocirepository.yaml
- ./externalsecret.yaml
- ./helmrelease.yaml
- ./httproute-envoy.yaml
- ../../../../templates/gatus/guarded
