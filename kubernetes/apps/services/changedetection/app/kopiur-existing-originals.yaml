# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kopiur.home-operations.com/snapshot_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  name: changedetection-daily-20261020053300
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  deletionPolicy: Retain
  onScheduleDelete: Retain
  policyRef:
    name: changedetection

---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: changedetection-k92-existing-nas
spec:
  credentialProjection:
    enabled: false
  failurePolicy:
    activeDeadlineSeconds: 3600
    backoffLimit: 0
    podStartupDeadlineSeconds: 300
  mover:
    podSecurityContext:
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add:
          - CHOWN
          - FOWNER
          - DAC_OVERRIDE
        drop:
          - ALL
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
  options:
    enableFileDeletion: false
    ignoreErrors: false
    ignorePermissionErrors: false
    parallel: 8
    skipOwners: false
    skipPermissions: false
    skipTimes: false
    writeFilesAtomically: true
  policy:
    onMissingSnapshot: Fail
    waitTimeout: 1m
  repository:
    kind: Repository
    name: changedetection-nas-smb
  source:
    identity:
      hostname: services
      snapshotID: 1bf1bdd97f0f6b0f03fd81434cc07301
      sourcePath: /pvc/changedetection
      username: changedetection
  target:
    pvc:
      accessModes:
        - ReadWriteOnce
      capacity: 1Gi
      name: changedetection-k92-existing-nas
      storageClassName: ceph-block

