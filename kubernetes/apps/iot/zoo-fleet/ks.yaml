# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zoo-fleet
  namespace: "${KS_NAMESPACE}"
spec:
  # Zoo Fleet v0.2.0 is pinned, but first activation remains suspended until
  # the required External Secrets source item exists.
  suspend: true
  targetNamespace: &namespace iot
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
  - name: cloudnative-pg-cluster
  - name: csi-driver-nfs
  - name: external-secrets-secret-store
  - name: mosquitto
  path: ./kubernetes/apps/iot/zoo-fleet/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: true
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: "${KS_TIMEOUT}"
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
