# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./ocirepository.yaml
- ../../../../templates/volsync
- ./externalsecret-kopiur.yaml
- ./helmrelease.yaml
- ./httproute-envoy.yaml
- ./kopiur-policy.yaml
- ./kopiur-repositories.yaml
- ./kopiur-original-restores.yaml
- ./kopiur-native-originals.yaml
