# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kopiur.home-operations.com/snapshotreplication_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: whisparr-k8s92-original-to-r2
  annotations:
    kopiur.home-operations.com/run-requested: "2026-10-11T00:39:00Z"
spec:
  sourceRef:
    kind: Repository
    name: whisparr-nas-smb
  destinationRef:
    kind: Repository
    name: whisparr-r2
  # One supplemental paired seed; normal full-history replication is unchanged.
  # Restore this original lane to suspended/full-history before its next daily slot.
  schedule:
    cron: "0 8 * * *"
    jitter: 10m
  selection:
    identities:
      include:
      - username: whisparr
        hostname: arrs
        sourcePath: /pvc/whisparr
    latestOnly: true
  migrate:
    parallel: 2
    policies: none
  pruning:
    none: {}
  suspend: false
