# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kopiur.home-operations.com/snapshot_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  name: plex-k92-native-original
spec:
  policyRef:
    name: plex
  deletionPolicy: Retain
  pin: true
  description: K8S-92 existing Plex native SQLite and persistent configuration scope
  failurePolicy:
    activeDeadlineSeconds: 3600
    backoffLimit: 0
