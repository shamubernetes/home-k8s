# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: tuppr
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    replicaCount: 2
    podAnnotations:
      maintenance.home.arpa/rollback-restart: "2026-08-03T14:18:25Z"
    monitoring:
      serviceMonitor:
        enabled: true
    controller:
      extraArgs:
      - --cleanup-legacy-plans=true
