# Native retained originals qualified on ARC38165202482. No pruning enabled.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: grimmory
spec:
  # K8S-92: native NAS/R2 originals and controller byte/ownership proofs passed.
  # Online runtime/transactional SQL/Books hooks never stop or hold the app.
  suspend: false
  repository:
    kind: Repository
    name: grimmory-nas-smb
  identity:
    username: grimmory
    hostname: media
  sources:
  - pvc:
      name: grimmory
    readOnly: true
    sourcePathOverride: /pvc/grimmory
    sourcePathStrategy: PvcName
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  staging:
    timeout: 10m
    storageClassName: ceph-block
    accessModes: [ReadWriteOnce]
  defaultDeletionPolicy: Retain
  verification:
    # Full file-content verification, in addition to independent native originals.
    # The first eligible reconciliation catches up; later runs stay daily.
    quick:
      schedule:
        cron: "35 18 * * *"
        timezone: UTC
    verifyFilesPercent: 100
    successExpr: "stats.files > 0 && stats.errors == 0"
  files:
    # Explicit lists replace the installed defaults; preserve those first.
    ignoreRules:
    - /lost+found
    - System Volume Information
    - $RECYCLE.BIN
    - '@eaDir'
    - .snapshot
    # Root-only coordination and incomplete exports are not recovery payloads.
    # Keep all completed runtime, native SQL, app-data and Books archives.
    - /grimmory-runtime/fence
    - /grimmory-runtime/.capture.*
  errorHandling:
    ignoreDirErrors: false
    ignoreFileErrors: false
    ignoreUnknownTypes: false
  hooks:
    beforeSnapshot:
    - workloadExec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: grimmory
            app.kubernetes.io/controller: grimmory
        container: app
        command: [sh, /backup-contract/runtime.sh, capture]
        timeout: 4m
        continueOnFailure: false
    - workloadExec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: grimmory
            app.kubernetes.io/controller: grimmory
        container: mariadb
        command: [s6-setuidgid, abc, bash, /backup-contract/backup.sh]
        timeout: 4m
        continueOnFailure: false
    - workloadExec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: grimmory
            app.kubernetes.io/controller: grimmory
        container: app
        command: [sh, /backup-contract/runtime.sh, verify]
        timeout: 4m
        continueOnFailure: false
  mover:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: grimmory-hourly
spec:
  policyRef:
    name: grimmory
  schedule:
    # Keep the existing object UID and retained history; capture once daily.
    cron: "45 16 * * *"
    timezone: UTC
    runOnCreate: false
    concurrencyPolicy: Forbid
    suspend: false
  deletion:
    onScheduleDelete: Retain
