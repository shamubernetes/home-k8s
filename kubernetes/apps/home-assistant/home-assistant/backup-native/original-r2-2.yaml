apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: home-assistant-k92-original-r2-2
spec:
  credentialProjection:
    enabled: false
  failurePolicy:
    activeDeadlineSeconds: 3600
    backoffLimit: 0
    podStartupDeadlineSeconds: 300
  mover:
    podSecurityContext:
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add:
          - CHOWN
          - FOWNER
          - DAC_OVERRIDE
        drop:
          - ALL
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
  options:
    enableFileDeletion: false
    ignoreErrors: false
    ignorePermissionErrors: false
    parallel: 8
    skipOwners: false
    skipPermissions: false
    skipTimes: false
    writeFilesAtomically: true
  policy:
    onMissingSnapshot: Fail
    waitTimeout: 1m
  repository:
    kind: Repository
    name: home-assistant-r2
  source:
    identity:
      username: home-assistant
      hostname: home-assistant
      sourcePath: /pvc/home-assistant-kopiur-capture
      asOf: "2026-10-21T17:28:31Z"
  target:
    pvc:
      accessModes:
        - ReadWriteOnce
      capacity: 20Gi
      name: home-assistant-k92-original-r2-2
      storageClassName: ceph-block
