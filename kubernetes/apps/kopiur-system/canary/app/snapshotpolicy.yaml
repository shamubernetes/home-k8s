apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: kopiur-canary
spec:
  repository:
    kind: Repository
    name: nas-smb-primary
  sources:
  - pvc:
      name: kopiur-canary-data
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  staging:
    timeout: 10m
    storageClassName: ceph-block
    accessModes:
    - ReadWriteOnce
  defaultDeletionPolicy: Delete
  retention:
    keepDaily: 7
    keepWeekly: 4
  mover:
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
  verification:
    quick:
      schedule:
        cron: "0 4 * * *"
        jitter: 30m
      parallel: 4
      fileParallelism: 2
      maxErrors: 0
    deep:
      schedule:
        cron: "0 5 * * 0"
        jitter: 1h
      capacity: 1Gi
      storageClassName: ceph-block
      parallel: 2
    successExpr: "stats.errors == 0 && (stats.files > 0 || stats.bytes > 0)"
    verifyFilesPercent: 100
