                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              result:
                maxLength: 32768
                type: string
              startedAt:
                format: date-time
                type: string
              updatedAt:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be the deterministic operation identity
          rule: self.metadata.name == 'kgso.' + self.spec.serverRef.uid.lowerAscii()
            + '.' + self.spec.kind.lowerAscii() + '.' + self.spec.requestID.lowerAscii()
        - message: command must be non-blank exactly for Command operations
          rule: 'self.spec.kind == ''Command'' ? has(self.spec.arguments) && has(self.spec.arguments.command)
            && self.spec.arguments.command.matches(''[^[:space:]]'') : !has(self.spec.arguments)
            || !has(self.spec.arguments.command) || self.spec.arguments.command.size()
            == 0'
        - message: gateway input is accepted only for Install operations
          rule: '!has(self.spec.gateway) || self.spec.kind == ''Install'''
        - message: operation spec is immutable
          rule: self.spec == oldSelf.spec
    served: true
    storage: true
    subresources:
      status: {}
