# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: volsync-schedules
  namespace: flux-system
data:
  # ============================================================================
  # Daily backup cadence shared by Kopiur and remaining VolSync consumers
  # Staggered to prevent I/O storms on Ceph cluster
  # ============================================================================

  # --- Daily NFS backups (01:00-01:59, preserving the minute staggering) ---
  VOLSYNC_SCHEDULE_ADGUARD_HOME: "0 1 * * *"
  VOLSYNC_SCHEDULE_HOME_ASSISTANT: "3 1 * * *"
  VOLSYNC_SCHEDULE_SABNZBD: "6 1 * * *"
  VOLSYNC_SCHEDULE_WIZARR: "9 1 * * *"
  VOLSYNC_SCHEDULE_WHISPARR: "12 1 * * *"
  VOLSYNC_SCHEDULE_PROFILARR: "15 1 * * *"
  VOLSYNC_SCHEDULE_SEERR: "18 1 * * *"
  VOLSYNC_SCHEDULE_RADARR_3D: "21 1 * * *"
  VOLSYNC_SCHEDULE_ROMM: "24 1 * * *"
  VOLSYNC_SCHEDULE_SONARR: "27 1 * * *"
  VOLSYNC_SCHEDULE_STASH: "30 1 * * *"
  VOLSYNC_SCHEDULE_STASH_DATA: "33 1 * * *"
  VOLSYNC_SCHEDULE_BAZARR: "36 1 * * *"
  VOLSYNC_SCHEDULE_RADARR: "39 1 * * *"
  VOLSYNC_SCHEDULE_TAUTULLI: "42 1 * * *"
  VOLSYNC_SCHEDULE_CALIBRE_WEB_AUTOMATED: "45 1 * * *"
  VOLSYNC_SCHEDULE_CWA_BDL: "48 1 * * *"
  VOLSYNC_SCHEDULE_AUDIOBOOKSHELF: "51 1 * * *"
  VOLSYNC_SCHEDULE_LISTENARR: "54 1 * * *"
  VOLSYNC_SCHEDULE_GRIMMORY: "57 1 * * *"
  VOLSYNC_SCHEDULE_CHAPTARR: "59 1 * * *"
  VOLSYNC_SCHEDULE_VICTORIA_METRICS_HA: "1 1 * * *"
  VOLSYNC_SCHEDULE_VICTORIA_TRACES: "4 1 * * *"
  VOLSYNC_SCHEDULE_KOMETA: "7 1 * * *"
  # Plex is large (~77GiB) - daily only at 4 AM
  VOLSYNC_SCHEDULE_PLEX: "0 4 * * *"

  # --- Daily R2 Backups (offsite, at 3:45-4:59 AM) ---
  # Offsite slots follow the primary capture window; Plex keeps its later slot.
  VOLSYNC_R2_SCHEDULE_ADGUARD_HOME: "45 3 * * *"
  VOLSYNC_R2_SCHEDULE_SABNZBD: "46 3 * * *"
  VOLSYNC_R2_SCHEDULE_WIZARR: "47 3 * * *"
  VOLSYNC_R2_SCHEDULE_WHISPARR: "48 3 * * *"
  VOLSYNC_R2_SCHEDULE_PROFILARR: "49 3 * * *"
  VOLSYNC_R2_SCHEDULE_SEERR: "50 3 * * *"
  VOLSYNC_R2_SCHEDULE_RADARR_3D: "51 3 * * *"
  VOLSYNC_R2_SCHEDULE_ROMM: "52 3 * * *"
  VOLSYNC_R2_SCHEDULE_HOME_ASSISTANT: "53 3 * * *"
  VOLSYNC_R2_SCHEDULE_SONARR: "54 3 * * *"
  VOLSYNC_R2_SCHEDULE_STASH: "55 3 * * *"
  VOLSYNC_R2_SCHEDULE_STASH_DATA: "56 3 * * *"
  VOLSYNC_R2_SCHEDULE_BAZARR: "57 3 * * *"
  VOLSYNC_R2_SCHEDULE_RADARR: "58 3 * * *"
  VOLSYNC_R2_SCHEDULE_TAUTULLI: "59 3 * * *"
  VOLSYNC_R2_SCHEDULE_CALIBRE_WEB_AUTOMATED: "0 4 * * *"
  VOLSYNC_R2_SCHEDULE_CWA_BDL: "1 4 * * *"
  VOLSYNC_R2_SCHEDULE_AUDIOBOOKSHELF: "2 4 * * *"
  VOLSYNC_R2_SCHEDULE_LISTENARR: "3 4 * * *"
  VOLSYNC_R2_SCHEDULE_GRIMMORY: "4 4 * * *"
  VOLSYNC_R2_SCHEDULE_VICTORIA_METRICS_HA: "5 4 * * *"
  VOLSYNC_R2_SCHEDULE_CHAPTARR: "6 4 * * *"
  VOLSYNC_R2_SCHEDULE_VICTORIA_TRACES: "7 4 * * *"
  VOLSYNC_R2_SCHEDULE_KOMETA: "8 4 * * *"
  # Plex R2 runs last (large backup)- after Plex NFS completes at 4:00
  VOLSYNC_R2_SCHEDULE_PLEX: "30 4 * * *"
