# yaml-language-server: $schema=https://k8s-schemas.pages.dev/batch/v1/job.json
apiVersion: batch/v1
kind: Job
metadata:
  name: oceanus-drain-recovery-v3
  namespace: system-upgrade
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oceanus-drain-recovery
    spec:
      serviceAccountName: oceanus-drain-recovery
      restartPolicy: Never
      containers:
      - name: recover
        image: docker.io/bitnami/kubectl:latest@sha256:f7f9e4f64d9e114650c115a4ac6fd383394b3d494061a8f17b1a0f6c8d55bc25
        command:
        - /bin/sh
        - -c
        - |
          set -eux
          # Flux typed normalization removes false Node booleans. Use a bounded
          # GitOps-owned recovery, never an agent-side uncordon.
          test "$(kubectl get talosupgrade talos -o go-template='{{index .metadata.annotations "tuppr.home-operations.com/suspend"}}')" = true
          test "$(kubectl get talosupgrade talos -o jsonpath='{.status.phase}')" = Pending
          test -z "$(kubectl get talosupgrade talos -o jsonpath='{.status.currentNode}')"
          # The existing legacy cleanup Job starts alongside this Job. Wait
          # boundedly for it instead of racing its first active status.
          attempts=0
          while :; do
            busy=false
            for job in $(kubectl -n system-upgrade get jobs -o jsonpath='{range .items[*]}{.metadata.name}:{.status.active}{"\n"}{end}'); do
              case "$${job}" in
                oceanus-drain-recovery-v3:*) ;;
                *:|*:0) ;;
                *) busy=true ;;
              esac
            done
            [ "$${busy}" = true ] || break
            attempts=$((attempts + 1))
            [ "$${attempts}" -lt 18 ] || exit 1
            sleep 5
          done
          # Recheck suspension after the bounded wait and before node mutation.
          test "$(kubectl get talosupgrade talos -o go-template='{{index .metadata.annotations "tuppr.home-operations.com/suspend"}}')" = true
          test "$(kubectl get talosupgrade talos -o jsonpath='{.status.phase}')" = Pending
          test -z "$(kubectl get talosupgrade talos -o jsonpath='{.status.currentNode}')"
          test "$(kubectl get node k8s-oceanus -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')" = True
          if [ "$(kubectl get node k8s-oceanus -o jsonpath='{.spec.unschedulable}')" = true ]; then
            rv="$(kubectl get node k8s-oceanus -o jsonpath='{.metadata.resourceVersion}')"
            kubectl patch node k8s-oceanus --type=json -p "[{\"op\":\"test\",\"path\":\"/metadata/resourceVersion\",\"value\":\"$${rv}\"},{\"op\":\"test\",\"path\":\"/spec/unschedulable\",\"value\":true},{\"op\":\"replace\",\"path\":\"/spec/unschedulable\",\"value\":false}]"
          fi
          test "$(kubectl get node k8s-oceanus -o jsonpath='{.spec.unschedulable}')" != true
          printf "%s\n" "Verified oceanus recovery while Talos remains paused"
