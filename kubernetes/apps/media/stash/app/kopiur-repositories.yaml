apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: stash-nas-smb
spec:
  backend:
    rclone:
      remotePath: mnemosyne:Backups/kopiur/stash-smb
      configSecretRef:
        name: stash-kopiur-nas
      startupTimeout: 2m
  encryption:
    passwordSecretRef:
      name: stash-kopiur-nas
      key: KOPIA_PASSWORD
  create:
    enabled: true
  scheduleDefaults:
    timezone: America/New_York
  deletionProtection:
    threshold: 10
  health:
    probe:
      enabled: false
  maintenance:
    enabled: false
  moverDefaults:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 2Gi
  suspend: true

---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: stash-r2
spec:
  backend:
    s3:
      bucket: storage-backup
      prefix: kopiur/stash/r2/
      endpoint: 0834f4848c703f1fcf5b524bdf5f1722.r2.cloudflarestorage.com
      region: auto
      auth:
        secretRef:
          name: stash-kopiur-r2
  encryption:
    passwordSecretRef:
      name: stash-kopiur-r2
      key: KOPIA_PASSWORD
  create:
    enabled: true
  scheduleDefaults:
    timezone: America/New_York
  deletionProtection:
    threshold: 10
  health:
    probe:
      enabled: false
  maintenance:
    enabled: false
  moverDefaults:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
