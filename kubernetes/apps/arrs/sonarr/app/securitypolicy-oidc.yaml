# yaml-language-server: $schema=https://k8s-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: sonarr-oidc
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: sonarr-envoy-browser
  oidc:
    provider:
      issuer: https://sso.${HOME_DOMAIN}
    clientIDRef:
      group: ""
      kind: Secret
      name: sonarr-oidc-secret
    clientSecret:
      group: ""
      kind: Secret
      name: sonarr-oidc-secret
    redirectURL: https://sonarr.${HOME_DOMAIN}/oauth2/callback
    logoutPath: /oauth2/logout
    cookieConfig:
      sameSite: Lax
    cookieNames:
      accessToken: sonarr-access-token
      idToken: sonarr-id-token
    forwardAccessToken: false
    passThroughAuthHeader: false
    scopes:
    - openid
    - profile
    - email
