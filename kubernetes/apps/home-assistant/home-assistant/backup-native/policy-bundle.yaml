apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: home-assistant-native-bundle
  labels:
    backup.home.arpa/daily-set: home-assistant-native
spec:
  repository:
    kind: Repository
    name: home-assistant-nas-smb
  identity:
    username: home-assistant
    hostname: home-assistant
  sources:
    - pvc:
        name: home-assistant-kopiur-capture
      sourcePathOverride: /pvc/home-assistant-kopiur-capture
      readOnly: true
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  staging:
    timeout: 10m
    storageClassName: ceph-block
    accessModes:
      - ReadWriteOnce
  defaultDeletionPolicy: Retain
  retention:
    keepDaily: 7
    keepWeekly: 4
  mover:
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 1Gi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - CHOWN
          - FOWNER
          - DAC_OVERRIDE
  verification:
    quick:
      schedule:
        cron: 10 21 * * *
        jitter: 10m
      maxErrors: 0
    deep:
      schedule:
        cron: 10 22 * * 0
        jitter: 10m
      capacity: 20Gi
      storageClassName: ceph-block
    successExpr: snapshot != null && stats.errors == 0
    verifyFilesPercent: 100
  hooks:
    beforeSnapshot:
      - runJob:
          jobSpec:
            backoffLimit: 0
            activeDeadlineSeconds: 600
            ttlSecondsAfterFinished: 86400
            template:
              metadata:
                labels:
                  backup.home.arpa/cohort: k92-system
                  backup.home.arpa/app: home-assistant
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext:
                  runAsUser: 568
                  runAsGroup: 568
                  fsGroup: 568
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                initContainers:
                  - name: prepare
                    image: docker.io/library/postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
                    command:
                      - sh
                      - -ec
                      - umask 077; mkdir -p /capture/pending; chmod 700 /capture/pending
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
                    resources:
                      requests:
                        cpu: 25m
                        memory: 128Mi
                      limits:
                        memory: 1Gi
                    volumeMounts:
                      - name: capture
                        mountPath: /capture
                      - name: tmp
                        mountPath: /tmp
                  - name: native-config
                    image: ghcr.io/home-operations/home-assistant:2026.10.4@sha256:81271a8bbe2a6019659e9d5cde98b884dd0d67fad6819bb4ab177dceb0c1c5e1
                    command:
                      - python
                      - /scripts/capture
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
                    resources:
                      requests:
                        cpu: 25m
                        memory: 128Mi
                      limits:
                        memory: 1Gi
                    volumeMounts:
                      - name: capture
                        mountPath: /capture
                        subPath: pending
                      - name: tmp
                        mountPath: /tmp
                      - name: script
                        mountPath: /scripts
                        readOnly: true
                      - name: credentials
                        mountPath: /credentials
                        readOnly: true
                    env:
                      - name: RECORDER_BACKEND_QUALIFIED
                        value: postgresql
                containers:
                  - name: database
                    image: docker.io/library/postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
                    command:
                      - sh
                      - -ec
                      - |
                        set -eu
                        umask 077
                        mkdir -p /capture/pending
                        pg_dump --format=custom --no-owner --no-privileges --file=/capture/pending/database.dump 2>/dev/null || { printf 'online database export failed\n' >&2; exit 1; }
                        pg_restore --list /capture/pending/database.dump >/dev/null 2>&1
                        test -s /capture/pending/homeassistant.tar
                        test -s /capture/pending/native.json
                        rm -rf /capture/previous
                        if test -d /capture/current; then mv /capture/current /capture/previous; fi
                        mv /capture/pending /capture/current
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
                    resources:
                      requests:
                        cpu: 25m
                        memory: 128Mi
                      limits:
                        memory: 1Gi
                    volumeMounts:
                      - name: capture
                        mountPath: /capture
                      - name: tmp
                        mountPath: /tmp
                    env:
                      - name: PGHOST
                        value: postgres17-rw.database.svc.cluster.local
                      - name: PGPORT
                        value: "5432"
                      - name: PGSSLMODE
                        value: require
                      - name: PGCONNECT_TIMEOUT
                        value: "15"
                      - name: PGUSER
                        valueFrom:
                          secretKeyRef:
                            name: home-assistant-kopiur-postgres
                            key: PGUSER
                      - name: PGPASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: home-assistant-kopiur-postgres
                            key: PGPASSWORD
                      - name: PGDATABASE
                        valueFrom:
                          secretKeyRef:
                            name: home-assistant-kopiur-postgres
                            key: PGDATABASE
                volumes:
                  - name: capture
                    persistentVolumeClaim:
                      claimName: home-assistant-kopiur-capture
                  - name: tmp
                    emptyDir: {}
                  - name: script
                    configMap:
                      name: home-assistant-native-capture
                  - name: credentials
                    secret:
                      secretName: home-assistant-kopiur-api
          timeout: 12m
          continueOnFailure: false
  suspend: false
  errorHandling:
    failFast: true
    ignoreDirErrors: false
    ignoreFileErrors: false
    ignoreUnknownTypes: false
