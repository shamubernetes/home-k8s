# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app plane-mcp
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: plane-mcp
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      plane-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/maudecode/plane-cli
              tag: v0.2.3@sha256:6fa004f31637efc2c58f339bef5ce590f98d99835e9c546531cc5adf5a3e318a
            env:
              HOST: 0.0.0.0
              PORT: &port 3000
              PLANE_CLI_HOME: /data
              PLANE_BASE_URL: http://plane-api.services.svc.cluster.local:8000
              PLANE_MCP_ALLOWED_ORIGINS: https://hermes-gateway.${HOME_DOMAIN},https://plane-mcp.${HOME_DOMAIN}
              PLANE_MCP_REDIS_PREFIX: plane-cli:mcp
              PLANE_MCP_REDIS_URL: redis://dragonfly.database.svc.cluster.local:6379/11
              PLANE_MCP_SESSION_TTL_SECONDS: "86400"
              TZ: ${TIMEZONE}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: plane-mcp
        ports:
          http:
            port: *port
    persistence:
      data:
        type: emptyDir
        advancedMounts:
          plane-mcp:
            app:
            - path: /data
