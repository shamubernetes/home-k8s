# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apollo-prereqs
  namespace: flux-system
spec:
  targetNamespace: services
  dependsOn:
  - name: cloudnative-pg-cluster
  - name: external-secrets-secret-store
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/apps/services/apollo/prereqs
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app apollo
  namespace: "${KS_NAMESPACE}"
spec:
  targetNamespace: &namespace services
  dependsOn:
  - name: apollo-prereqs
  - name: dragonfly-cluster
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/services/apollo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: true
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: "${KS_TIMEOUT}"
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
