# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tracearr-envoy
  annotations:
    homepage.shamubernetes.com/enabled: "true"
    homepage.shamubernetes.com/name: "Tracearr"
    homepage.shamubernetes.com/description: "Inspect media activity and streams"
    homepage.shamubernetes.com/group: "Observability"
    homepage.shamubernetes.com/order: "70"
    homepage.shamubernetes.com/favorite: "false"
    homepage.shamubernetes.com/icon: "dashboard-icons:tracearr"
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - "tracearr.${HOME_DOMAIN}"
  rules:
  - backendRefs:
    - name: tracearr
      port: 3000
