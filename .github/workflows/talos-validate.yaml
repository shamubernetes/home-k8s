# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Talos - Validate"

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Talos - Validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install tools
      uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      with:
        install_args: task talosctl github:budimanjojo/talhelper

    - name: Check coordinated Talos target
      run: scripts/check-talos-version-sync

    - name: Validate Talos machine configs
      run: task talos:validate