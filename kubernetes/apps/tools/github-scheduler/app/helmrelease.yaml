# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app github-scheduler
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: github-scheduler
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      github-scheduler:
        replicas: 1
        # One scheduler per SQLite database: never run two instances, even during a rollout.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/maudecode/github-scheduler
              tag: 0.1.6@sha256:4e708ae5798f99797905aba3425655ad455b26d2dd4153fa3f606b94565b2fb8
            # The image defaults to PORT=8080 and DATA_DIR=/data.
            env:
              OIDC_ISSUER_URL: https://sso.${HOME_DOMAIN}
              PUBLIC_URL: https://github-scheduler.${HOME_DOMAIN}
            envFrom:
            - secretRef:
                name: github-scheduler-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  # Ready once the SQLite database answers; unauthenticated.
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests: {cpu: 20m, memory: 128Mi}
              limits: {memory: 384Mi}
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: *app
        globalMounts:
        - path: /data
      tmp:
        type: emptyDir
        sizeLimit: 64Mi
        globalMounts:
        - path: /tmp
