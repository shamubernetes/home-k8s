# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  interval: 10m
  values:
    controllers:
      sonarr:
        containers:
          kopiur-postgres:
            image:
              repository: docker.io/library/postgres
              tag: 17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
            command: [sleep, infinity]
            env:
              PGHOST: postgres17-rw.database.svc.cluster.local
              PGPORT: "5432"
              PGDATABASES: sonarr_main
              CAPTURE_MODE: single-db-stable-filetree
              PGSSLMODE: require
              CONFIG_FILE: /config/config.xml
            envFrom:
            - secretRef:
                name: sonarr-kopiur-postgres
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 512Mi
    persistence:
      kopiur-postgres-script:
        type: configMap
        name: sonarr-kopiur-postgres
        advancedMounts:
          sonarr:
            kopiur-postgres:
            - path: /kopiur
              readOnly: true
      media:
        globalMounts: null
        advancedMounts:
          sonarr:
            app:
            - path: /media
            - path: /media/Books
              subPath: Books
              readOnly: true
