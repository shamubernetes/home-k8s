# yaml-language-server: $schema=https://k8s-schemas.pages.dev/batch/job_v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: homarr-k92-native-originals
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        recovery.kopiur.home.arpa/role: homarr-original-native
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: native
          image: ghcr.io/homarr-labs/homarr:v2.9.0@sha256:9e866425f4e2bcd03b662f7a7a04b6c180f1de95a3812868fd0a306df026e08c
          command:
            - node
            - /kopiur/original-native.js
          workingDir: /app
          env:
            - name: RECOVERY_TARGET
              value: isolated
            - name: ORIGINAL_POINTS
              value: '{"nas":"929120697646986589890e31f11519e6","r2":"5bc6d0a7504f5b969b0808db51c8d940"}'
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: homarr-secret
                  key: SECRET_ENCRYPTION_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              memory: 1Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: nas
              mountPath: /original/nas
              readOnly: true
            - name: r2
              mountPath: /original/r2
              readOnly: true
            - name: work
              mountPath: /work
            - name: helper
              mountPath: /kopiur
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nas
          persistentVolumeClaim:
            claimName: homarr-k92-existing-nas
            readOnly: true
        - name: r2
          persistentVolumeClaim:
            claimName: homarr-k92-existing-r2
            readOnly: true
        - name: work
          emptyDir:
            sizeLimit: 2Gi
        - name: helper
          configMap:
            name: homarr-k92-original-native
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homarr-k92-original-native
spec:
  podSelector:
    matchLabels:
      recovery.kopiur.home.arpa/role: homarr-original-native
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
