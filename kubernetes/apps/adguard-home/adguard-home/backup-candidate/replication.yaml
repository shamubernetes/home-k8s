apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: adguard-home-native-nas-to-r2
  annotations:
    kopiur.home.arpa/original-copy-only: "true"
    kopiur.home-operations.com/run-requested: "2026-10-20T21:21:21Z"
spec:
  sourceRef:
    kind: Repository
    name: adguard-home-nas-smb
  destinationRef:
    kind: Repository
    name: adguard-home-r2
  schedule:
    timezone: UTC
    cron: 20 22 * * *
    jitter: 10m
  selection:
    identities:
      include:
        - username: adguard-home
          hostname: adguard-home
          sourcePath: /pvc/data-adguard-home-0
    latestOnly: true
  migrate:
    parallel: 2
    policies: none
  pruning:
    none: {}
  suspend: false
