apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-webhooks
  annotations:
    external-dns.alpha.kubernetes.io/target: external.${HOME_DOMAIN}
spec:
  ingressClassName: external
  rules:
  - host: hermes-webhooks.${HOME_DOMAIN}
    http:
      paths:
      - path: /webhooks/firecrawl-automation
        pathType: Exact
        backend:
          service:
            name: hermes-webhooks
            port:
              name: http
