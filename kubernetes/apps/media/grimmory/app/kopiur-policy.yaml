# Repositories are declared here; parent provisions unique app credentials.
# Keep suspended until both backend restores and live hook authorization pass.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: grimmory
spec:
  suspend: true
  repository:
    kind: Repository
    name: grimmory-nas-smb
  identity:
    username: grimmory
    hostname: media
  sources:
  - pvc:
      name: grimmory
    sourcePathOverride: /pvc/grimmory
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  staging:
    timeout: 10m
    storageClassName: ceph-block
    accessModes: [ReadWriteOnce]
  defaultDeletionPolicy: Delete
  retention:
    keepDaily: 7
    keepWeekly: 4
  hooks:
    beforeSnapshot:
    - workloadExec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: grimmory
            app.kubernetes.io/controller: grimmory
        container: mariadb
        command: [bash, /backup-contract/backup.sh]
        timeout: 4m
        continueOnFailure: false
  mover:
    # Parent must qualify the namespace gate before enabling this root reader.
    securityContext:
      runAsNonRoot: false
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
        add: [DAC_READ_SEARCH]
    # MariaDB/TA private files are not all group-readable. Root only in the
    # isolated mover, never change the app's runtime UID to obtain readability.
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
  verification:
    quick:
      schedule:
        cron: "40 8 * * *"
        jitter: 30m
      parallel: 2
      fileParallelism: 2
      maxErrors: 0
    deep:
      schedule:
        cron: "40 9 * * 0"
        jitter: 1h
      capacity: 10Gi
      storageClassName: ceph-block
      parallel: 2
    successExpr: "stats.files > 0 && stats.errors == 0"
    verifyFilesPercent: 100
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: grimmory-daily
spec:
  policyRef:
    name: grimmory
  schedule:
    suspend: true
    cron: "40 1 * * *"
    jitter: 10m
    runOnCreate: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: grimmory-nas-to-r2
spec:
  sourceRef:
    kind: Repository
    name: grimmory-nas-smb
  destinationRef:
    kind: Repository
    name: grimmory-r2
  schedule:
    cron: "0 8 * * *"
    jitter: 10m
  selection:
    identities:
      include:
      - username: grimmory
        hostname: media
        sourcePath: /pvc/grimmory
    latestOnly: false
  migrate:
    parallel: 2
    policies: none
  pruning:
    retention:
      keepDaily: 7
      keepWeekly: 4
  suspend: true
