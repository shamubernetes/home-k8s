# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./externalsecret-kopiur.yaml
- ./kopiur-repositories.yaml
- ./kopiur-policy.yaml
- ./kopiur-shared-originals.yaml
- ./kopiur-shared-original-consumer.yaml
- ./ocirepository.yaml
- ../../../../templates/volsync
- ./helmrelease.yaml
- ./httproute-envoy.yaml
- ../../../../templates/gatus/guarded
configMapGenerator:
- name: k92-shared-sqlite-originals
  files:
  - shared-original-reader.py
  options:
    annotations:
      reloader.stakater.com/ignore: "true"
- name: cwa-bdl-kopiur-startup
  files:
  # Byte-identical copy of the existing CWA guard, checked by startup-test.py.
  # Keep the native BDL entrypoint adaptation in its separate two-line shim.
  - startup-hold.py=kopiur-startup-hold.py
  - native-init.sh=kopiur-init.sh
generatorOptions:
  disableNameSuffixHash: true
patches:
- patch: |-
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${APP}
      annotations:
        kustomize.toolkit.fluxcd.io/prune: disabled
