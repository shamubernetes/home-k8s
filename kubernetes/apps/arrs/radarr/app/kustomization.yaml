# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./ocirepository.yaml
- ./externalsecret.yaml
- ./externalsecret-oidc.yaml
- ../../../../templates/volsync
- ./helmrelease.yaml
- ./httproute-envoy-api.yaml
- ./httproute-envoy-browser.yaml
- ./securitypolicy-oidc.yaml
- ./service-envoy-dns.yaml
- ../../../../templates/gatus/guarded
- ./externalsecret-kopiur.yaml
- ./kopiur-repositories.yaml
- ./kopiur-policy.yaml
- ./kopiur-original-snapshot.yaml
components:
- ../../../../components/kopiur-postgres
configMapGenerator:
- name: radarr-kopiur-quiesce
  files:
  - quiesce.sh=./kopiur-quiesce.sh
  options:
    disableNameSuffixHash: true
patches:
- path: ./kopiur-postgres-patch.yaml
- path: ./kopiur-quiesce-patch.yaml
