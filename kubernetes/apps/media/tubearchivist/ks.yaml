# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tubearchivist
  namespace: "${KS_NAMESPACE}"
spec:
  targetNamespace: &namespace media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
  - name: kopiur
  - name: snapshot-controller
  - name: rook-ceph-cluster
  - name: volsync
  - name: external-secrets-secret-store
  - name: elasticsearch
  - name: dragonfly-cluster
  path: ./kubernetes/apps/media/tubearchivist/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: false
  healthChecks:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    name: tubearchivist-kopiur-nas
    namespace: media
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    name: tubearchivist-kopiur-r2
    namespace: media
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Repository
    name: tubearchivist-nas-smb
    namespace: media
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Repository
    name: tubearchivist-r2
    namespace: media
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: "${KS_TIMEOUT}"
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      GATUS_INTERNAL_PORT: "8000"
      GATUS_HOST_HEADER: "tube.${HOME_DOMAIN}"
      GATUS_SUBDOMAIN: tube
      GATUS_PATH: /api/health/
      VOLSYNC_CAPACITY: 20Gi
      VOLSYNC_CACHE_CAPACITY: 5Gi
      VOLSYNC_SCHEDULE: "0 6 * * *"
      VOLSYNC_R2_SCHEDULE: "0 7 * * *"
