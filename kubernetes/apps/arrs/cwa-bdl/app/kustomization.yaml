# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./externalsecret-kopiur.yaml
- ./kopiur-repositories.yaml
- ./kopiur-policy.yaml
- ./ocirepository.yaml
- ../../../../templates/volsync
- ./helmrelease.yaml
- ./httproute-envoy.yaml
- ../../../../templates/gatus/guarded
configMapGenerator:
- name: cwa-bdl-kopiur-startup
  files:
  # Byte-identical copy of the existing CWA guard, checked by startup-test.py.
  # Keep the native BDL entrypoint adaptation in its separate two-line shim.
  - startup-hold.py=kopiur-startup-hold.py
  - native-init.sh=kopiur-init.sh
generatorOptions:
  disableNameSuffixHash: true
