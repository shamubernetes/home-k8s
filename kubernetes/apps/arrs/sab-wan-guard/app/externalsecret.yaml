# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sab-wan-guard
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: sab-wan-guard-secret
    creationPolicy: Owner
  data:
  - secretKey: UNIFI_USER
    remoteRef:
      key: unpoller
      property: UP_UNIFI_DEFAULT_USER
  - secretKey: UNIFI_PASS
    remoteRef:
      key: unpoller
      property: UP_UNIFI_DEFAULT_PASS
