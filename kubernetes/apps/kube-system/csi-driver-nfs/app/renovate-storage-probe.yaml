# yaml-language-server: $schema=https://k8s-schemas.pages.dev/storage.k8s.io/storageclass_v1.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: csi-nfs-renovate-probe-20261011
provisioner: nfs.csi.k8s.io
parameters:
  server: "${IPAM_IP_NFS}"
  share: /mnt/user/Media
  subDir: .renovate-csi-probe-20261011
  onDelete: delete
  mountPermissions: "0777"
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.2
  - hard
  - noatime
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: csi-nfs-renovate-probe-20261011-v2
  labels:
    app.kubernetes.io/name: csi-nfs-renovate-probe
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: csi-nfs-renovate-probe-20261011
  resources:
    requests:
      storage: 1Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: csi-nfs-renovate-probe-20261011-v2
  labels:
    app.kubernetes.io/name: csi-nfs-renovate-probe
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: docker.io/library/busybox:latest@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
      command: [sh, -ec]
      args:
        - |
          umask 077
          printf 'csi-nfs-probe\n' > /probe/receipt
          sync
          printf 'csi-nfs-probe\n' | cmp - /probe/receipt
          sha256sum /probe/receipt
          rm /probe/receipt
          printf 'NFS provision, mount, write, sync, read and owned receipt cleanup passed\n'
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          memory: 32Mi
      volumeMounts:
        - name: probe
          mountPath: /probe
  volumes:
    - name: probe
      persistentVolumeClaim:
        claimName: csi-nfs-renovate-probe-20261011-v2
