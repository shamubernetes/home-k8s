# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./ocirepository.yaml
- ../../../../templates/volsync
- ./externalsecret.yaml
- ./externalsecret-kopiur.yaml
- ./externalsecret-oidc.yaml
- ./helmrelease.yaml
- ./httproute-envoy-browser.yaml
- ./kopiur-policy.yaml
- ./kopiur-existing-originals.yaml
- ./kopiur-native-originals.yaml
- ./kopiur-repositories.yaml
- ./securitypolicy-oidc.yaml
- ./service-envoy-dns.yaml
configMapGenerator:
- name: homarr-k92-original-native
  files:
  - original-native.js
  options:
    annotations:
      reloader.stakater.com/ignore: "true"
generatorOptions:
  disableNameSuffixHash: true
patches:
- patch: |-
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${APP}
      annotations:
        kustomize.toolkit.fluxcd.io/prune: disabled
