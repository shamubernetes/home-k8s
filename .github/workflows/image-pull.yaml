# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Talos Image Availability

on:
  # This default-branch workflow never checks out or executes pull-request code.
  # It verifies exact-run artifacts, PR provenance, and required checks first.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Image Availability Plan"]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: talos-image-availability
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify provenance and required checks
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      images: ${{ steps.verify.outputs.images }}
      plan_digest: ${{ steps.verify.outputs.plan_digest }}
      pull_request: ${{ steps.verify.outputs.pull_request }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
    steps:
    - name: Checkout trusted verifier
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/heads/main
        persist-credentials: false

    - name: Download and verify source artifact
      id: verify
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        SOURCE_ACTOR: ${{ github.event.workflow_run.actor.login }}
        SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        SOURCE_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      run: |
        set -euo pipefail
        [[ $SOURCE_HEAD_REPOSITORY == "$REPOSITORY" ]]
        source_path=$(gh api "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.path')
        [[ $source_path == '.github/workflows/image-plan.yaml' ]]
        case "$SOURCE_EVENT" in
          pull_request_target) [[ $SOURCE_ACTOR == 'shamubot[bot]' ]] ;;
          workflow_dispatch)
            [[ $SOURCE_ACTOR == 'MaudeBot' ]]
            [[ $SOURCE_HEAD_BRANCH == 'main' ]]
            ;;
          *) echo "unsupported source event: $SOURCE_EVENT" >&2; exit 1 ;;
        esac

        artifacts=$(gh api "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")
        mapfile -t artifact_ids < <(jq -r '.artifacts[] | select(.expired == false and (.name | startswith("talos-image-plan-"))) | .id' <<<"$artifacts")
        [[ ${#artifact_ids[@]} -eq 1 ]]
        artifact_size=$(jq -r '.artifacts[] | select(.id == $id) | .size_in_bytes' --argjson id "${artifact_ids[0]}" <<<"$artifacts")
        (( artifact_size <= 1048576 ))
        gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_ids[0]}/zip" > artifact.zip
        unzip -q artifact.zip -d artifact
        [[ -f artifact/image-plan.json ]]
        [[ $(find artifact -type f | wc -l | tr -d ' ') -eq 1 ]]

        pr=$(jq -r '.pull_request' artifact/image-plan.json)
        head_sha=$(jq -r '.head_sha' artifact/image-plan.json)
        base_sha=$(jq -r '.base_sha' artifact/image-plan.json)
        pr_json=$(gh api "repos/${REPOSITORY}/pulls/${pr}")
        [[ $(jq -r '.state' <<<"$pr_json") == open ]]
        [[ $(jq -r '.head.repo.full_name' <<<"$pr_json") == "$REPOSITORY" ]]
        [[ $(jq -r '.head.sha' <<<"$pr_json") == "$head_sha" ]]
        [[ $(jq -r '.base.sha' <<<"$pr_json") == "$base_sha" ]]
        if [[ $SOURCE_EVENT == pull_request_target ]]; then
          [[ $(jq -r '.user.login' <<<"$pr_json") == 'shamubot[bot]' ]]
        fi
        {
          printf 'pull_request=%s\n' "$pr"
          printf 'head_sha=%s\n' "$head_sha"
        } >> "$GITHUB_OUTPUT"

        mapfile -t changed_files < <(gh api --paginate "repos/${REPOSITORY}/pulls/${pr}/files?per_page=100" --jq '.[].filename')
        protected='^(\.github/workflows/|scripts/|kubernetes/apps/actions-runner-system/|talos/patches/controlplane/talos-api\.yaml)'
        for file in "${changed_files[@]}"; do
          if [[ $file =~ $protected ]]; then
            echo "privileged boundary changed in source pull request: $file" >&2
            exit 1
          fi
        done

        # Branch protection binds both contexts to GitHub Actions app ID 15368.
        # The plan workflow can finish first, so wait boundedly for concurrent CI.
        for attempt in {1..60}; do
          gh api "repos/${REPOSITORY}/commits/${head_sha}/check-runs?filter=latest&per_page=100" > checks.json
          set +e
          check_result=$(scripts/talos-check-gate \
            --checks checks.json \
            --app-id 15368 \
            --required 'Static Analysis - Success' \
            --required 'Flate - Success' 2>&1)
          check_status=$?
          set -e
          case "$check_status" in
            0) printf '%s\n' "$check_result"; break ;;
            10)
              if (( attempt == 60 )); then
                printf '%s\n' "$check_result" >&2
                exit 1
              fi
              sleep 10
              ;;
            *) printf '%s\n' "$check_result" >&2; exit "$check_status" ;;
          esac
        done

        images=$(scripts/talos-image-plan verify \
          --plan artifact/image-plan.json \
          --repository "$REPOSITORY" \
          --pull-request "$pr" \
          --base-sha "$base_sha" \
          --head-sha "$head_sha")
        artifact_name=$(jq -r '.artifacts[] | select(.id == $id) | .name' --argjson id "${artifact_ids[0]}" <<<"$artifacts")
        [[ $artifact_name == "talos-image-plan-${head_sha}" ]]
        plan_digest=$(sha256sum artifact/image-plan.json | cut -d' ' -f1)
        {
          printf 'images=%s\n' "$images"
          printf 'plan_digest=%s\n' "$plan_digest"
        } >> "$GITHUB_OUTPUT"

  pull:
    name: Pull approved images on Talos workers
    needs: preflight
    runs-on: ghar-set-talos
    timeout-minutes: 30
    environment: talos-image-pull
    env:
      IMAGES_JSON: ${{ needs.preflight.outputs.images }}
      PLAN_DIGEST: ${{ needs.preflight.outputs.plan_digest }}
      PLAN_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
      PLAN_PULL_REQUEST: ${{ needs.preflight.outputs.pull_request }}
      TALOSCONFIG: /var/run/secrets/talos.dev/config
    steps:
    - name: Pull and verify approved images
      shell: bash
      run: |
        set -euo pipefail
        talosctl=/opt/talosctl/talosctl
        [[ -x $talosctl ]]
        "$talosctl" version --client --short

        mapfile -t images < <(jq -r '.[]' <<<"$IMAGES_JSON")
        [[ ${#images[@]} -le 20 ]]
        nodes=(10.100.47.50 10.100.47.51)
        max_image_bytes=5000000000
        max_total_bytes=20000000000
        total_bytes=0

        size_bytes() {
          local number=$1 unit=$2 multiplier
          case "$unit" in
            B) multiplier=1 ;;
            KB|kB) multiplier=1000 ;;
            MB) multiplier=1000000 ;;
            GB) multiplier=1000000000 ;;
            TB) multiplier=1000000000000 ;;
            *) echo "unknown image size unit: $unit" >&2; return 1 ;;
          esac
          awk -v number="$number" -v multiplier="$multiplier" 'BEGIN {printf "%.0f", number * multiplier}'
        }

        printf 'plan=%s pr=%s head=%s images=%s\n' \
          "$PLAN_DIGEST" "$PLAN_PULL_REQUEST" "$PLAN_HEAD_SHA" "${#images[@]}"
        for image in "${images[@]}"; do
          digest=${image##*@}
          for node in "${nodes[@]}"; do
            printf 'pull node=%s image=%s\n' "$node" "$image"
            timeout 10m "$talosctl" --nodes "$node" image pull "$image"
            read -r size unit < <(
              "$talosctl" --nodes "$node" image list |
                awk -v digest="$digest" '$3 == digest {print $4, $5; exit}'
            )
            [[ -n ${size:-} && -n ${unit:-} ]]
            bytes=$(size_bytes "$size" "$unit")
            if (( bytes > max_image_bytes )); then
              echo "image exceeds per-image size limit: $image ($size $unit)" >&2
              exit 1
            fi
            total_bytes=$((total_bytes + bytes))
            if (( total_bytes > max_total_bytes )); then
              echo "plan exceeds aggregate size limit" >&2
              exit 1
            fi
            printf 'verified node=%s image=%s size=%s%s\n' "$node" "$image" "$size" "$unit"
          done
        done
        printf 'completed plan=%s total_bytes=%s\n' "$PLAN_DIGEST" "$total_bytes"

  report:
    name: Report trusted image pre-pull
    if: ${{ always() && needs.preflight.outputs.head_sha != '' }}
    needs:
    - preflight
    - pull
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
    - name: Publish exact-head result
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
        PREFLIGHT_RESULT: ${{ needs.preflight.result }}
        PULL_RESULT: ${{ needs.pull.result }}
        REPOSITORY: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        conclusion=failure
        summary="Talos image pre-pull did not complete successfully."
        if [[ $PREFLIGHT_RESULT == success && $PULL_RESULT == success ]]; then
          conclusion=success
          summary="All approved images are available on every configured Talos worker."
        fi
        jq -n \
          --arg conclusion "$conclusion" \
          --arg head_sha "$HEAD_SHA" \
          --arg summary "$summary" \
          --arg url "$RUN_URL" \
          '{
            name: "Talos Image Prepull",
            head_sha: $head_sha,
            status: "completed",
            conclusion: $conclusion,
            details_url: $url,
            output: {
              title: "Talos Image Prepull",
              summary: $summary
            }
          }' | gh api \
            "repos/${REPOSITORY}/check-runs" \
            --method POST \
            --header 'Accept: application/vnd.github+json' \
            --input - >/dev/null
