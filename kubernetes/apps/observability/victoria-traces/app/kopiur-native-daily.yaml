# Daily fresh CSI capture of the actual production PVC, never the retained clone.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: victoria-traces-native-daily
spec:
  policyRef:
    name: victoria-traces-native
  failedJobsHistoryLimit: 3
  schedule:
    suspend: false
    cron: "46 1 * * *"
    timezone: America/New_York
    jitter: 0s
    runOnCreate: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
