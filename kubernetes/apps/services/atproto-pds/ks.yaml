# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app atproto-pds
  namespace: "${KS_NAMESPACE}"
spec:
  targetNamespace: &namespace services
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
  - name: external-secrets-secret-store
  path: ./kubernetes/apps/services/atproto-pds/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: false
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: "${KS_TIMEOUT}"
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      GATUS_APP_NAME: AT Protocol PDS
      GATUS_DOMAIN: kiliantyler.com
      GATUS_PATH: /xrpc/_health
      GATUS_SUBDOMAIN: pds
      VOLSYNC_CAPACITY: 20Gi
      VOLSYNC_PGID: "1000"
      VOLSYNC_PUID: "1000"
      VOLSYNC_R2_SCHEDULE: "17 4 * * *"
      VOLSYNC_SCHEDULE: "17 * * * *"
