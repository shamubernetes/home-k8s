apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s92-retire-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s92-retire-bootstrap
rules:
  - apiGroups:
      - volsync.backube
    resources:
      - replicationdestinations
    resourceNames:
      - overseerr-dst
    verbs:
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s92-retire-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s92-retire-bootstrap
subjects:
  - kind: ServiceAccount
    name: k8s92-retire-bootstrap
    namespace: arrs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s92-retire-bootstrap
rules:
  - apiGroups:
      - volsync.backube
    resources:
      - replicationsources
      - replicationdestinations
    verbs:
      - list
  - apiGroups:
      - homelab.rafaribe.com
    resources:
      - volsyncmonitors
    verbs:
      - list
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    resourceNames:
      - volsync
      - homelab-assistant
      - homelab-assistant-crds
    verbs:
      - get
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    resourceNames:
      - replicationsources.volsync.backube
      - replicationdestinations.volsync.backube
      - volsyncmonitors.homelab.rafaribe.com
    verbs:
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s92-retire-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s92-retire-bootstrap
subjects:
  - kind: ServiceAccount
    name: k8s92-retire-bootstrap
    namespace: arrs
