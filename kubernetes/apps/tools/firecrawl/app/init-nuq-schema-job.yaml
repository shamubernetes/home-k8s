# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/job-batch-v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: firecrawl-init-nuq-schema-v3
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-nuq-schema
        image: docker.io/library/postgres:17-alpine@sha256:aa90e97ee862e558111d34cfb8b2c4bec768c2b039fb791341686928560263b3
        envFrom:
        - secretRef:
            name: firecrawl-secret
        command:
        - /bin/sh
        - -ec
        - psql "$NUQ_DATABASE_URL" -v ON_ERROR_STOP=1 -f /schema/nuq-schema.sql
        volumeMounts:
        - name: schema
          mountPath: /schema
          readOnly: true
      volumes:
      - name: schema
        configMap:
          name: firecrawl-nuq-schema
