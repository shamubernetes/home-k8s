# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tunarr
  namespace: "${KS_NAMESPACE}"
spec:
  targetNamespace: &namespace media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
  - name: kopiur
  - name: snapshot-controller
  - name: rook-ceph-cluster
  - name: volsync
  - name: external-secrets-secret-store
  path: ./kubernetes/apps/media/tunarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: false
  # Replication is verified separately: its observedGeneration may stay stale.
  healthChecks:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    name: tunarr-kopiur-nas
    namespace: media
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    name: tunarr-kopiur-r2
    namespace: media
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Repository
    name: tunarr-nas-smb
    namespace: media
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Repository
    name: tunarr-r2
    namespace: media
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: SnapshotPolicy
    name: tunarr
    namespace: media
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: SnapshotSchedule
    name: tunarr-daily
    namespace: media
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: "${KS_TIMEOUT}"
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_SCHEDULE: "43 * * * *"
      VOLSYNC_R2_SCHEDULE: "43 5 * * *"
      GATUS_INTERNAL_PORT: "8000"
      GATUS_PATH: /api/version
