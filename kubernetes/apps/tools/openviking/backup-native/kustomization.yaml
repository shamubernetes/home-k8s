apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tools
resources:
  - policy-data.yaml
  - hook-recovery.yaml
  - policy-auth.yaml
  - policy-models.yaml
  - original-nas-0.yaml
  - original-nas-1.yaml
  - original-nas-2.yaml
  - original-r2-0.yaml
  - original-r2-1.yaml
  - original-r2-2.yaml
  - policy.yaml
  - repositories.yaml
  - externalsecret.yaml
  - schedule.yaml
  - capture-recovery.yaml
  - replication.yaml
  - original-0.yaml
  - original-1.yaml
  - original-2.yaml
configMapGenerator:
  - name: openviking-native-capture
    files:
      - capture.py
      - original-native.py
    options:
      annotations:
        reloader.stakater.com/ignore: "true"
generatorOptions:
  disableNameSuffixHash: true
