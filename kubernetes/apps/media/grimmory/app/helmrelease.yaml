# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ${APP}
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: ${APP}
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
  - name: rook-ceph-cluster
    namespace: rook-ceph
  - name: volsync
    namespace: volsync-system
  values:
    controllers:
      grimmory:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/grimmory/grimmory
              tag: v3.3.0@sha256:1669c8754ada37f06d8f08d852a00d70b68cfaed6e82c4ced9506b1c215fa5f3
            env:
              TZ: ${TIMEZONE}
              USER_ID: "568"
              GROUP_ID: "568"
              SWAGGER_ENABLED: "false"
              FORCE_DISABLE_OIDC: "false"
            envFrom: &envFrom
            - secretRef:
                name: grimmory-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/healthcheck
                    port: &port 6060
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/healthcheck
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"]
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
          mariadb:
            image:
              repository: docker.io/linuxserver/mariadb
              tag: 11.8.8@sha256:1172113f3ca35208c6f802a5e4c0e9ef7ae171cb6661b7cb8522d67209701014
            env:
              PUID: "568"
              PGID: "568"
              TZ: ${TIMEZONE}
            envFrom: *envFrom
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - /usr/bin/mariadb-admin
                    - ping
                    - -h
                    - localhost
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness: &mariadbProbes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - /usr/bin/mariadb-admin
                    - ping
                    - -h
                    - localhost
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *mariadbProbes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"]
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: grimmory
        ports:
          http:
            port: *port
    persistence:
      config:
        existingClaim: *app
        advancedMounts:
          grimmory:
            app:
            - path: /app/data
              subPath: grimmory-data
            mariadb:
            - path: /config
              subPath: mariadb-config
      media:
        type: nfs
        server: "${IPAM_IP_NFS}"
        path: /mnt/user/Media
        advancedMounts:
          grimmory:
            app:
            - path: /books
              subPath: Books
            - path: /bookdrop
              subPath: Books/bookdrop
