# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./policy.yaml
- ./capture-pvc.yaml
- ./native-identity.yaml
- ./schedule.yaml
- ./replication.yaml
- ./original.yaml
configMapGenerator:
- name: pocket-id-native-validation
  files:
  - validate.py
  - references.sql
  options:
    annotations:
      reloader.stakater.com/ignore: "true"
generatorOptions:
  disableNameSuffixHash: true
