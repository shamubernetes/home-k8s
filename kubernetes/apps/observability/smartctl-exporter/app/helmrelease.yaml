# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app smartctl-exporter
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: smartctl-exporter
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
  - name: kube-prometheus-stack
    namespace: observability
  values:
    image:
      repository: quay.io/prometheuscommunity/smartctl-exporter
      tag: v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
    fullnameOverride: *app
    config:
      devices:
      - /dev/sda
      - /dev/nvme0n1
    serviceMonitor:
      enabled: true
      relabelings:
      - action: replace
        regex: (.*)
        replacement: $1
        sourceLabels: ["__meta_kubernetes_pod_node_name"]
        targetLabel: kubernetes_node
    prometheusRules:
      enabled: false
