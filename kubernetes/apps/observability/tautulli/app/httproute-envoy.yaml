# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tautulli-envoy
  annotations:
    homepage.shamubernetes.com/enabled: "true"
    homepage.shamubernetes.com/name: "Tautulli"
    homepage.shamubernetes.com/description: "Plex activity and history"
    homepage.shamubernetes.com/group: "Media"
    homepage.shamubernetes.com/order: "80"
    homepage.shamubernetes.com/favorite: "false"
    homepage.shamubernetes.com/icon: "dashboard-icons:tautulli"
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - "tautulli.${HOME_DOMAIN}"
  rules:
  - backendRefs:
    - name: tautulli
      port: 80
