# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./kopiur-native-consumers.yaml
- ./kopiur-original-r2-restore.yaml
- ./kopiur-original-nas-restore.yaml
- ./kopiur-rollback-original.yaml
- ./replicationsource.yaml
configMapGenerator:
- name: tunarr-frozen-original-native
  files:
  - original-native.py
  options:
    annotations:
      reloader.stakater.com/ignore: "true"
generatorOptions:
  disableNameSuffixHash: true
