# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sabnzbd
  namespace: "${KS_NAMESPACE}"
spec:
  targetNamespace: &namespace arrs
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
  - name: kopiur
  - name: rook-ceph-cluster
  - name: snapshot-controller
  - name: external-secrets-secret-store
  path: ./kubernetes/apps/arrs/sabnzbd/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: false
  # Replication is verified separately: its observedGeneration may stay stale.
  healthChecks:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    name: sabnzbd-kopiur-nas
    namespace: arrs
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    name: sabnzbd-kopiur-r2
    namespace: arrs
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Repository
    name: sabnzbd-nas-smb
    namespace: arrs
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Repository
    name: sabnzbd-r2
    namespace: arrs
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: SnapshotPolicy
    name: sabnzbd
    namespace: arrs
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: SnapshotSchedule
    name: sabnzbd-daily
    namespace: arrs
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: "${KS_TIMEOUT}"
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      GATUS_SUBDOMAIN: sab
      VOLSYNC_CAPACITY: 3Gi
      VOLSYNC_SCHEDULE: "${VOLSYNC_SCHEDULE_SABNZBD}"
      VOLSYNC_R2_SCHEDULE: "${VOLSYNC_R2_SCHEDULE_SABNZBD}"
