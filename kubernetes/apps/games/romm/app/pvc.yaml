# Retain exact existing bound volume and its historical bootstrap identity.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  dataSource:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: romm-dst
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: romm-dst
  resources:
    requests:
      storage: 10Gi
  storageClassName: ceph-block
  volumeMode: Filesystem
  volumeName: pvc-738c1631-68c5-4835-885b-adcff08f39eb
