# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./ocirepository.yaml
- ../../../../templates/volsync
- ./volsync-data.yaml
- ./helmrelease.yaml
- ./httproute-envoy.yaml
- ../../../../templates/gatus/guarded
- ./externalsecret-kopiur.yaml
- ./kopiur-repositories.yaml
- ./kopiur-policy.yaml
- ./kopiur-original-data.yaml
- ./kopiur-original-restore.yaml
- ./kopiur-original-r2-restore.yaml
- ./kopiur-native-originals.yaml
configMapGenerator:
- name: stash-kopiur-native
  files:
  - capture.py
  - restore.py
  - original-native.py
  options:
    annotations:
      reloader.stakater.com/ignore: "true"
generatorOptions:
  disableNameSuffixHash: true
