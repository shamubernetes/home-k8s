# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kopiur.home-operations.com/repository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: bazarr-nas-smb
spec:
  backend:
    rclone:
      remotePath: mnemosyne:kopiur-bazarr
      configSecretRef:
        name: bazarr-kopiur-nas
      startupTimeout: 2m
  encryption:
    passwordSecretRef:
      name: bazarr-kopiur-nas
      key: KOPIA_PASSWORD
  create:
    enabled: true
  scheduleDefaults:
    timezone: America/New_York
  deletionProtection:
    threshold: 10
  health:
    probe:
      enabled: true
      interval: 5m
      failureThreshold: 3
      onFailure: Degrade
  maintenance:
    enabled: false
    schedule:
      quick:
        cron: "20 */6 * * *"
        jitter: 30m
      full:
        cron: "20 3 * * *"
        jitter: 1h
  moverDefaults:
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        # Native NAS mover was OOMKilled at 512Mi during repository connection.
        memory: 2Gi
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Repository
metadata:
  name: bazarr-r2
spec:
  backend:
    s3:
      bucket: kopiur-bazarr
      prefix: kopiur/bazarr/r2/
      endpoint: 0834f4848c703f1fcf5b524bdf5f1722.r2.cloudflarestorage.com
      region: auto
      auth:
        secretRef:
          name: bazarr-kopiur-r2
  encryption:
    passwordSecretRef:
      name: bazarr-kopiur-r2
      key: KOPIA_PASSWORD
  create:
    enabled: true
  scheduleDefaults:
    timezone: America/New_York
  deletionProtection:
    threshold: 10
  health:
    probe:
      enabled: true
      interval: 5m
      failureThreshold: 3
      onFailure: Degrade
  maintenance:
    enabled: false
    schedule:
      quick:
        cron: "35 */6 * * *"
        jitter: 30m
      full:
        cron: "35 4 * * *"
        jitter: 1h
  moverDefaults:
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
