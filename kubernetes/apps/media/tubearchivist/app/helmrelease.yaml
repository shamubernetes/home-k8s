# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tubearchivist
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: tubearchivist
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
  - name: elasticsearch
    namespace: database
  - name: rook-ceph-cluster
    namespace: rook-ceph

  values:
    controllers:
      tubearchivist:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: bbilly1/tubearchivist
              tag: v0.6.0@sha256:0cbc18aa953c72ec7dfdd6f8fa7c2fe89b5d04489857d7baa354fecbd6181e69
            env:
              ES_URL: http://elasticsearch.database.svc.cluster.local:9200
              REDIS_CON: redis://dragonfly.database.svc.cluster.local:6379/15
              TA_HOST: https://tube.${HOME_DOMAIN}
              TZ: ${TIMEZONE}
            envFrom:
            - secretRef:
                name: tubearchivist-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/
                    port: &port 8000
                    httpHeaders:
                    - name: Host
                      value: tube.${HOME_DOMAIN}
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/
                    port: *port
                    httpHeaders:
                    - name: Host
                      value: tube.${HOME_DOMAIN}
                  periodSeconds: 10
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                add: ["DAC_OVERRIDE"]
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 4Gi
        pod:
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups: [4000]
            seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      cache:
        existingClaim: *app
        globalMounts:
        - path: /cache
      youtube:
        type: nfs
        server: "${IPAM_IP_NFS}"
        path: /mnt/user/Media
        globalMounts:
        - path: /youtube
          subPath: TubeArchivist
