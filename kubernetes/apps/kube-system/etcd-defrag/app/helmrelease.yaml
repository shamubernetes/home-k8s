# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app etcd-defrag
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: etcd-defrag
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      etcd-defrag:
        type: cronjob
        cronjob:
          schedule: "0 */3 * * *"  # Every 3 hours; observed fragmentation crossed 50% between 6-hour checks
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        serviceAccount:
          identifier: *app
        containers:
          app:
            image:
              repository: alpine
              tag: "3.24@sha256:5b02b42e375f7426f8d65c3af331ca05d9878f9989230354504e0b9dfd431f60"
            command:
              - /bin/sh
              - /scripts/defrag.sh
            env:
              TZ: "${TIMEZONE}"
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
        pod:
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            fsGroup: 0
    serviceAccount:
      etcd-defrag: {}
    rbac:
      roles:
        etcd-defrag:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: ["nodes"]
              verbs: ["list"]
      bindings:
        etcd-defrag:
          type: ClusterRoleBinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: etcd-defrag
          subjects:
            - kind: ServiceAccount
              name: etcd-defrag
              namespace: kube-system
    persistence:
      script:
        type: configMap
        name: etcd-defrag-script
        globalMounts:
          - path: /scripts
            readOnly: true
      talosconfig:
        type: secret
        name: etcd-defrag-talosconfig
        globalMounts:
          - path: /var/run/secrets/talos
            readOnly: true
