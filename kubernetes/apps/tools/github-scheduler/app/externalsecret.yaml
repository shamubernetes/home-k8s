# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-scheduler
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: github-scheduler-secret
    creationPolicy: Owner
  # OPERATOR_TOKEN, GITHUB_APP_ID and GITHUB_APP_PRIVATE_KEY. Schedulable repositories come from the
  # GitHub App's installation; GITHUB_REPOSITORIES must not be set.
  dataFrom:
  - extract:
      key: github-scheduler
