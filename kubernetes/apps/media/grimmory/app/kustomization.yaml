# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./ocirepository.yaml
- ./externalsecret-kopiur.yaml
- ./kopiur-repositories.yaml
- ./kopiur-policy.yaml
- ./kopiur-original.yaml
- ./kopiur-original-restores.yaml
- ./kopiur-original-proof.yaml
- ./kopiur-controller-consumers.yaml
- ./kopiur-replication.yaml
- ../../../../templates/volsync
- ./secret.sops.yaml
- ./helmrelease.yaml
- ./httproute-envoy.yaml
- ../../../../templates/gatus/guarded
configMapGenerator:
- name: grimmory-controller-consumer-contract
  files:
  - consumer-prepare.py
  - consumer-database.sh
  - consumer-app.sh
  - consumer-verify.py
  - restore.sh
  - runtime.sh
  options:
    disableNameSuffixHash: true
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
- name: grimmory-backup-contract
  files:
  - backup.sh
  - runtime.sh
  options:
    disableNameSuffixHash: true
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
