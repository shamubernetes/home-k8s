# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: victoria-metrics-native
spec:
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  staging:
    timeout: 10m
    storageClassName: ceph-block
    accessModes:
      - ReadWriteOnce
  defaultDeletionPolicy: Retain
  errorHandling:
    failFast: true
    ignoreDirErrors: false
    ignoreFileErrors: false
    ignoreUnknownTypes: false

  identity:
    username: victoria-metrics-ha
    hostname: observability
  mover:
    podSecurityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - CHOWN
          - FOWNER
          - DAC_OVERRIDE
  repository:
    kind: Repository
    name: victoria-metrics-ha-nas-smb
  retention:
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: server-volume-victoria-metrics-ha-0
      readOnly: true
      sourcePathOverride: /pvc/victoria-metrics-ha-native
  suspend: false
  hooks:
    beforeSnapshot:
      - runJob:
          timeout: 12m
          continueOnFailure: false
          jobSpec:
            activeDeadlineSeconds: 600
            backoffLimit: 0
            ttlSecondsAfterFinished: 86400
            template:
              metadata:
                labels:
                  backup.home.arpa/app: victoria-metrics-ha
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                affinity:
                  podAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchLabels:
                            statefulset.kubernetes.io/pod-name: victoria-metrics-ha-0
                        topologyKey: kubernetes.io/hostname
                securityContext:
                  runAsNonRoot: false
                  runAsUser: 0
                  runAsGroup: 0
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: capture
                    image: ghcr.io/home-operations/sabnzbd:5.1.3@sha256:a605d07cc0e3a789e3491201cba4871418c203b3d974a0b9afc497c2bf25243f
                    command:
                      - python3
                      - /kopiur/capture-native.py
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
                        add:
                          - DAC_OVERRIDE
                          - FOWNER
                    resources:
                      requests:
                        cpu: 25m
                        memory: 64Mi
                      limits:
                        memory: 256Mi
                    volumeMounts:
                      - name: source
                        mountPath: /capture
                      - name: helper
                        mountPath: /kopiur
                        readOnly: true
                volumes:
                  - name: source
                    persistentVolumeClaim:
                      claimName: server-volume-victoria-metrics-ha-0
                  - name: helper
                    configMap:
                      name: victoria-metrics-native-capture
  verification:
    deep:
      capacity: 20Gi
      parallel: 2
      schedule:
        cron: 0 11 * * 0
        jitter: 1h
      storageClassName: ceph-block
    quick:
      maxErrors: 0
      parallel: 2
      schedule:
        cron: 0 10 * * *
        jitter: 30m
    successExpr: stats.errors == 0 && stats.files > 0
    verifyFilesPercent: 100

---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  name: victoria-metrics-native-k92-original
spec:
  policyRef:
    name: victoria-metrics-native
  deletionPolicy: Retain
  pin: true
  failurePolicy:
    activeDeadlineSeconds: 3600
    backoffLimit: 0

---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: victoria-metrics-native-nas-to-r2
  annotations:
    kopiur.home-operations.com/run-requested: "2026-10-21T06:00:00Z"
spec:
  destinationRef:
    kind: Repository
    name: victoria-metrics-ha-r2
  migrate:
    parallel: 8
    policies: none
  schedule:
    cron: 47 2 * * *
    timezone: America/New_York
    jitter: 0s
  selection:
    identities:
      include:
        - username: victoria-metrics-ha
          hostname: observability
          sourcePath: /pvc/victoria-metrics-ha-native
    latestOnly: true
  sourceRef:
    kind: Repository
    name: victoria-metrics-ha-nas-smb
  suspend: false
