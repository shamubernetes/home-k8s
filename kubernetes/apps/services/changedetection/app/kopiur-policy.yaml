apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: changedetection
spec:
  repository:
    kind: Repository
    name: changedetection-nas-smb
  identity:
    username: changedetection
    hostname: services
  sources:
  - pvc:
      name: changedetection
    sourcePathOverride: /pvc/changedetection
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  staging:
    timeout: 10m
    storageClassName: ceph-block
    accessModes:
    - ReadWriteOnce
  defaultDeletionPolicy: Delete
  retention:
    keepDaily: 7
    keepWeekly: 4
  hooks:
    beforeSnapshot:
    - workloadExec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: changedetection
            app.kubernetes.io/controller: changedetection
        container: app
        command:
        - python3
        - -c
        - |
          import json
          import os

          root = "/datastore"
          json_files = []
          for directory, _, filenames in os.walk(root):
              for filename in filenames:
                  if filename.endswith(".json"):
                      json_files.append(os.path.join(directory, filename))
          if not json_files:
              raise RuntimeError("datastore contains no JSON state files")
          for path in json_files:
              with open(path, "rb") as file_handle:
                  json.load(file_handle)
          if not os.path.exists(root + "/changedetection.json"):
              raise RuntimeError("primary ChangeDetection state file is missing")
          os.sync()
        timeout: 2m
        continueOnFailure: false
  mover:
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
  verification:
    quick:
      schedule:
        cron: "25 8 * * *"
        jitter: 30m
      parallel: 4
      fileParallelism: 2
      maxErrors: 0
    deep:
      schedule:
        cron: "25 9 * * 0"
        jitter: 1h
      capacity: 1Gi
      storageClassName: ceph-block
      parallel: 2
    # Allow light snapshots: changedetection.io stores watch data in SQLite,
    # so its /pvc source can legitimately drop to a few KB when watches are
    # pruned. Trust kopia error count and snapshot presence to catch corruption
    # instead of insisting on a non-empty file list.
    successExpr: "snapshot != null && stats.errors == 0"
    verifyFilesPercent: 100
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: changedetection-daily
spec:
  policyRef:
    name: changedetection
  schedule:
    cron: "25 1 * * *"
    jitter: 10m
    runOnCreate: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: changedetection-nas-to-r2
spec:
  sourceRef:
    kind: Repository
    name: changedetection-nas-smb
  destinationRef:
    kind: Repository
    name: changedetection-r2
  schedule:
    cron: "40 7 * * *"
    jitter: 10m
  selection:
    identities:
      include:
      - username: changedetection
        hostname: services
        sourcePath: /pvc/changedetection
    latestOnly: false
  migrate:
    parallel: 2
    policies: none
  pruning:
    retention:
      keepDaily: 7
      keepWeekly: 4
  suspend: false
