# yaml-language-server: $schema=https://k8s-schemas.pages.dev/batch/job_v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: chaptarr-k92-native-originals-v3
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  # The actual paired PG17 recovery passed; preserve the drill without replay.
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        recovery.kopiur.home.arpa/role: chaptarr-k92-native-originals
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: native-postgres
          image: docker.io/library/postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
          command:
            - bash
            - /kopiur/original-native.sh
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 2Gi
              ephemeral-storage: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            - name: helper
              mountPath: /kopiur
              readOnly: true
      volumes:
        - name: nas
          persistentVolumeClaim:
            claimName: chaptarr-k92-original-nas
            readOnly: true
        - name: r2
          persistentVolumeClaim:
            claimName: chaptarr-k92-original-r2
            readOnly: true
        - name: work
          emptyDir:
            sizeLimit: 4Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: helper
          projected:
            sources:
              - configMap:
                  name: chaptarr-kopiur-original-native
              - configMap:
                  name: chaptarr-k92-sqlite-original
                  items:
                    - key: original-sqlite.py
                      path: original_sqlite.py
      initContainers:
        - name: prepare
          image: ghcr.io/home-operations/sabnzbd:5.1.3@sha256:c89b0322721c3eba47221e5f916505e7e742684651f73c5215717340b6b5402f
          command:
            - python3
            - /kopiur/original-native.py
          env:
            - name: RECOVERY_TARGET
              value: isolated
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: ORIGINAL_POINTS
              value: '{"nas": "b15de742ebb7ff40874613aef2d3ea2d", "r2": "3e7f2ed9e5d1b39be9bb33163e45b68b"}'
            - name: PYTHONPATH
              value: /kopiur
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 2Gi
              ephemeral-storage: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          volumeMounts:
            - name: nas
              mountPath: /original/nas
              readOnly: true
            - name: r2
              mountPath: /original/r2
              readOnly: true
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            - name: helper
              mountPath: /kopiur
              readOnly: true

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chaptarr-k92-native-originals
spec:
  podSelector:
    matchLabels:
      recovery.kopiur.home.arpa/role: chaptarr-k92-native-originals
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
