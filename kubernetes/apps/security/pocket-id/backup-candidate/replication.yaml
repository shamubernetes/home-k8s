apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: pocket-id-native-nas-to-r2
spec:
  sourceRef:
    kind: Repository
    name: pocket-id-nas-smb
  destinationRef:
    kind: Repository
    name: pocket-id-r2
  schedule:
    cron: 20 20 * * *
    jitter: 10m
  selection:
    identities:
      include:
        - username: pocket-id
          hostname: security
          sourcePath: /pvc/pocket-id-kopiur-capture
    latestOnly: false
  migrate:
    parallel: 2
    policies: none
  pruning:
    retention:
      keepDaily: 7
      keepWeekly: 4
  suspend: false
