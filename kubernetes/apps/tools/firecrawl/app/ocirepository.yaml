# yaml-language-server: $schema=https://k8s-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: firecrawl
spec:
  interval: 30m
  url: oci://ghcr.io/shamubernetes/charts/firecrawl
  ref:
    # firecrawl-oci-digest: sha256:c079781136a8ef7fe79c57be6d879e05e048c18837c16e79ef70365626abe6f4
    tag: 0.2.0-maude.6
  secretRef:
    name: ghcr-pull-secret
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
    - issuer: ^https://token.actions.githubusercontent.com$
      subject: ^https://github.com/shamubernetes/firecrawl-helm/.*$
