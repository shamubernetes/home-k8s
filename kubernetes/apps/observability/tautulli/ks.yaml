# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tautulli
  namespace: "${KS_NAMESPACE}"
spec:
  targetNamespace: &namespace observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
  - name: external-secrets-secret-store
  - name: kopiur
  - name: rook-ceph-cluster
  - name: snapshot-controller
  path: ./kubernetes/apps/observability/tautulli/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: false
  # SnapshotReplication readiness is monitored separately because schedule-only
  # updates can leave observedGeneration stale on otherwise healthy resources.
  healthChecks:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    name: tautulli-kopiur-nas
    namespace: observability
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    name: tautulli-kopiur-r2
    namespace: observability
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Repository
    name: tautulli-nas
    namespace: observability
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Repository
    name: tautulli-r2
    namespace: observability
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: SnapshotPolicy
    name: tautulli
    namespace: observability
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: SnapshotSchedule
    name: tautulli-daily
    namespace: observability
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: "${KS_TIMEOUT}"
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_SCHEDULE: "${VOLSYNC_SCHEDULE_TAUTULLI}"
      VOLSYNC_R2_SCHEDULE: "${VOLSYNC_R2_SCHEDULE_TAUTULLI}"
