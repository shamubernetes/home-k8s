# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name ghar-set-maudecode
  namespace: actions-runner-system
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: ghar-set-maudecode
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: ghar-controller
      namespace: actions-runner-system
  values:
    nameOverride: ghar-set-maudecode
    runnerScaleSetName: ghar-set-maudecode
    githubConfigSecret: ghar-set-maudecode-secret
    githubConfigUrl: https://github.com/MaudeCode
    minRunners: 0
    # Capacity floor: never lower below 8 or serialize jobs for disk saturation.
    # Repair the storage/I/O cause instead; changing this requires owner approval.
    maxRunners: 8
    containerMode:
      type: dind
    template:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
                    # Rhea's degraded SATA link saturates even with one runner.
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - k8s-rhea
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                actions.github.com/scale-set-name: ghar-set-maudecode
        containers:
          - name: runner
            # home-operations runner plus the MaudeCode CI toolchain and a preloaded Node/Python/Ruby tool cache.
            image: ghcr.io/shamubernetes/actions-runner:2.337.0@sha256:42088d6262027df4cbcb748af0b8cd24b615b0220be10b8accf4f264da7fe50b
            command: ["/home/runner/run.sh"]
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: NODE
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
    controllerServiceAccount:
      name: ghar-controller
      namespace: actions-runner-system
