# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./ocirepository.yaml
- ./externalsecret-kopiur.yaml
- ./kopiur-repositories.yaml
- ./kopiur-policy.yaml
- ./kopiur-original.yaml
- ./kopiur-books-original.yaml
- ./kopiur-online-original-v2.yaml
- ./kopiur-original-restores.yaml
- ./kopiur-books-restores.yaml
- ./kopiur-online-restores.yaml
- ./kopiur-original-proof.yaml
- ./kopiur-books-proof.yaml
- ./kopiur-online-proof.yaml
- ./kopiur-replication.yaml
- ./kopiur-retained-copies.yaml
- ../../../../templates/volsync
- ./secret.sops.yaml
- ./helmrelease.yaml
- ./httproute-envoy.yaml
- ../../../../templates/gatus/guarded
configMapGenerator:
- name: grimmory-backup-contract
  files:
  - backup.sh
  - runtime.sh
  - books.sh
  - fence.sh
  options:
    disableNameSuffixHash: true
    annotations:
      kustomize.toolkit.fluxcd.io/substitute: disabled
      # Helpers update through the projected directory, not an application restart.
      reloader.stakater.com/ignore: "true"
