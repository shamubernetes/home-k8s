apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: whisparr
  annotations:
    kopiur.home.arpa/original-native-recovery: https://github.com/shamubernetes/home-k8s/actions/runs/38035330767
spec:
  # Independent original production NAS/R2 native recovery passed before activation.
  suspend: false
  repository:
    kind: Repository
    name: whisparr-nas-smb
  identity:
    username: whisparr
    hostname: arrs
  sources:
  - pvc:
      name: whisparr
    sourcePathOverride: /pvc/whisparr
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  staging:
    timeout: 10m
    storageClassName: ceph-block
    accessModes:
    - ReadWriteOnce
  defaultDeletionPolicy: Retain
  files:
    # Keep COMPLETE/current; the paired archive contains every application file.
    # recurring-capture.sh owns the ordered native root .kopiaignore whitelist.
    # The helper's prior bundle is redundant and removed at the next capture.
    # Preserve Kopiur's default excludes because an explicit list replaces them.
    ignoreRules:
    - /lost+found
    - System Volume Information
    - $RECYCLE.BIN
    - '@eaDir'
    - .snapshot
    - /.kopiur-postgres/previous
  hooks:
    beforeSnapshot:
    - workloadExec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: whisparr
            app.kubernetes.io/controller: whisparr
        container: kopiur-postgres
        command: [sh, /kopiur/recurring-capture.sh]
        # 120s acknowledgement + 1200s capture + 180s hashing/escalation.
        # Keep the independent native watchdog at its qualified absolute 1800s.
        timeout: 25m
        continueOnFailure: false
  mover:
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
  verification:
    quick:
      schedule:
        cron: "45 8 * * *"
        jitter: 30m
      parallel: 4
      fileParallelism: 2
      maxErrors: 0
    deep:
      schedule:
        cron: "45 9 * * 0"
        jitter: 1h
      capacity: 45Gi
      # Disposable native restore scratch, not application or repository storage.
      # Ceph-backed scratch missed the unchanged deadline on the reduced real tree.
      storageClassName: openebs-hostpath
      # Use Kopia's native restore default for the 100k-file production tree.
      # Two workers missed the admitted 3600s deadline; keep that cap unchanged.
      parallel: 8
    successExpr: "stats.files > 0 && stats.errors == 0"
    verifyFilesPercent: 100
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: whisparr-daily
spec:
  policyRef:
    name: whisparr
  schedule:
    suspend: true
    cron: "45 1 * * *"
    jitter: 10m
    runOnCreate: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: whisparr-primary
spec:
  policyRef:
    name: whisparr
  schedule:
    suspend: false
    # Preserve incumbent primary cadence; keep draft daily lane suspended.
    cron: "${VOLSYNC_SCHEDULE_WHISPARR}"
    jitter: 10m
    runOnCreate: true
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: whisparr-nas-to-r2
  annotations:
    # Exercise recurring replication after the retained paired-bundle NAS point.
    kopiur.home-operations.com/run-requested: "2026-10-10T22:48:43Z"
spec:
  sourceRef:
    kind: Repository
    name: whisparr-nas-smb
  destinationRef:
    kind: Repository
    name: whisparr-r2
  schedule:
    cron: "${VOLSYNC_R2_SCHEDULE_WHISPARR}"
    jitter: 10m
  selection:
    identities:
      include:
      - username: whisparr
        hostname: arrs
        sourcePath: /pvc/whisparr
    latestOnly: false
  migrate:
    parallel: 2
    policies: none
  pruning:
    none: {}
  suspend: false
