# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: mosquitto-secret
  data:
  - secretKey: admin-username
    remoteRef:
      key: mosquitto
      property: ADMIN_USERNAME
  - secretKey: admin-password
    remoteRef:
      key: mosquitto
      property: ADMIN_PASSWORD
  - secretKey: ha-password
    remoteRef:
      key: mosquitto
      property: HA_PASSWORD
  - secretKey: espresense-bar-password
    remoteRef:
      key: mosquitto
      property: ESPRESENSE_BAR_PASSWORD
  - secretKey: espresense-livingroom-password
    remoteRef:
      key: mosquitto
      property: ESPRESENSE_LIVINGROOM_PASSWORD
  - secretKey: ratgdo-main-password
    remoteRef:
      key: mosquitto
      property: RATGDO_MAIN_PASSWORD
