# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./ocirepository.yaml
- ./gate-schema-bootstrap.yaml
- ./zoo-database-bootstrap.yaml
- ./cowbell-rollback-externalsecret.yaml
- ./helmrelease.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
- name: shared-elasticsearch-tls-endpoint
  literals:
  - url=https://elasticsearch.thezoo.house
# Keep rollback pods viable while Zoo adopts the renamed endpoint reference.
- name: shared-elasticsearch-endpoint
  literals:
  - url=https://elasticsearch.thezoo.house
