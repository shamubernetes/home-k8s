# yaml-language-server: $schema=https://k8s-schemas.pages.dev/batch/job_v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: tunarr-frozen-native-nas-v2
spec:
  # Qualification is accepted. Retain a reproducible recipe, not active proof jobs.
  suspend: true
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        recovery.kopiur.home.arpa/role: tunarr-frozen-native-nas
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: original-state
          image: ghcr.io/home-operations/sabnzbd:5.1.3@sha256:c89b0322721c3eba47221e5f916505e7e742684651f73c5215717340b6b5402f
          command:
            - python3
            - /kopiur/original-native.py
            - prepare
          env:
            - name: RECOVERY_TARGET
              value: isolated
            - name: BACKEND
              value: nas
            - name: ORIGINAL_POINT
              value: 35b2e76bc0c9dd8b34946b88ed734e0c
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: original
              mountPath: /original
              readOnly: true
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            - name: helper
              mountPath: /kopiur
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 1Gi
              ephemeral-storage: 8Gi
      containers:
        - name: native
          image: ghcr.io/chrisbenincasa/tunarr:1.3.15@sha256:ae8ec490459e773571b277e2f64248605c1ea64d49ee4d26aa01741409d60369
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              cleanup() { kill -TERM "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true; }
              /tunarr/tunarr server >/dev/null 2>&1 &
              server=$!
              trap cleanup EXIT HUP INT TERM
              for attempt in $(seq 1 660); do
               if test -f /work/native-complete; then exit 0; fi
               kill -0 "$server" 2>/dev/null || { printf 'isolated native process exited
              ' >&2; exit 1; }
               sleep 1
              done
              printf 'isolated native consumer exceeded deadline
              ' >&2
              exit 1
          env:
            - name: HOME
              value: /tmp
            - name: TZ
              value: America/New_York
            - name: TUNARR_BIND_ADDR
              value: 127.0.0.1
            - name: TUNARR_DATABASE_PATH
              value: /work/data/stable-1.3
            - name: TUNARR_SEARCH_MAX_INDEXING_THREADS
              value: "1"
            - name: MEILI_DUMP_DIR
              value: /work/data/stable-1.3/dumps
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 4Gi
              ephemeral-storage: 8Gi
        - name: verify
          image: ghcr.io/home-operations/sabnzbd:5.1.3@sha256:c89b0322721c3eba47221e5f916505e7e742684651f73c5215717340b6b5402f
          command:
            - python3
            - /kopiur/original-native.py
            - verify
          env:
            - name: RECOVERY_TARGET
              value: isolated
            - name: BACKEND
              value: nas
            - name: ORIGINAL_POINT
              value: 35b2e76bc0c9dd8b34946b88ed734e0c
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: work
              mountPath: /work
            - name: helper
              mountPath: /kopiur
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: original
          persistentVolumeClaim:
            claimName: tunarr-k92-original-nas
            readOnly: true
        - name: work
          emptyDir:
            sizeLimit: 8Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: helper
          configMap:
            name: tunarr-frozen-original-native

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tunarr-frozen-native-nas
spec:
  podSelector:
    matchLabels:
      recovery.kopiur.home.arpa/role: tunarr-frozen-native-nas
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []

