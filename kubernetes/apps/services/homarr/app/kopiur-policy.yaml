apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: homarr
spec:
  repository:
    kind: Repository
    name: homarr-nas
  identity:
    username: homarr
    hostname: services
  sources:
  - pvc:
      name: homarr
    sourcePathOverride: /pvc/homarr
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  staging:
    timeout: 10m
    storageClassName: ceph-block
    accessModes:
    - ReadWriteOnce
  defaultDeletionPolicy: Delete
  retention:
    keepDaily: 7
    keepWeekly: 4
  hooks:
    beforeSnapshot:
    - workloadExec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: homarr
        container: app
        command:
        - node
        - -e
        - |
          const fs = require("fs");
          const Database = require("better-sqlite3");
          const dir = "/appdata/kopiur";
          const dst = dir + "/homarr-online.sqlite";
          fs.mkdirSync(dir, {recursive: true});
          try { fs.unlinkSync(dst); } catch (error) {
            if (error.code !== "ENOENT") throw error;
          }
          const source = new Database("/appdata/db.sqlite", {readonly: true});
          if (source.pragma("quick_check", {simple: true}) !== "ok") {
            throw new Error("source SQLite quick_check failed");
          }
          source.exec("VACUUM INTO '/appdata/kopiur/homarr-online.sqlite'");
          source.close();
          const backup = new Database(dst, {readonly: true});
          if (backup.pragma("integrity_check", {simple: true}) !== "ok") {
            throw new Error("online backup SQLite integrity_check failed");
          }
          backup.close();
          fs.chownSync(dst, 568, 568);
          fs.chmodSync(dst, 0o640);
        timeout: 2m
        continueOnFailure: false
    afterSnapshot:
    - workloadExec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: homarr
        container: app
        command:
        - /bin/sh
        - -c
        - rm -f /appdata/kopiur/homarr-online.sqlite.tmp /appdata/kopiur/homarr-online.sqlite
        timeout: 30s
        continueOnFailure: true
  mover:
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
  verification:
    quick:
      schedule:
        cron: "30 4 * * *"
        jitter: 30m
      parallel: 4
      fileParallelism: 2
      maxErrors: 0
    deep:
      schedule:
        cron: "30 5 * * 0"
        jitter: 1h
      capacity: 1Gi
      storageClassName: ceph-block
      parallel: 2
    successExpr: "stats.files > 0 && stats.errors == 0"
    verifyFilesPercent: 100
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: homarr-daily
spec:
  policyRef:
    name: homarr
  schedule:
    cron: "30 2 * * *"
    jitter: 15m
    runOnCreate: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: homarr-nas-to-r2
spec:
  sourceRef:
    kind: Repository
    name: homarr-nas
  destinationRef:
    kind: Repository
    name: homarr-r2
  schedule:
    cron: "30 6 * * *"
    jitter: 15m
  selection:
    identities:
      include:
      - username: homarr
        hostname: services
        sourcePath: /pvc/homarr
    latestOnly: false
  migrate:
    parallel: 2
    policies: none
  pruning:
    retention:
      keepDaily: 7
      keepWeekly: 4
  suspend: false
