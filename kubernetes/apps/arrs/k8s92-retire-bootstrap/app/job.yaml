apiVersion: batch/v1
kind: Job
metadata:
  name: k8s92-retire-bootstrap
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s92-retire-bootstrap
    spec:
      serviceAccountName: k8s92-retire-bootstrap
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: retire
          image: ghcr.io/home-operations/home-assistant:2026.10.3@sha256:3a5bf87bb8192cbef21a2e44383477a48a227c2dd19c2383ada2cb229981c127
          command:
            - python
            - /scripts/retire.py
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: k8s92-retire-bootstrap-code
