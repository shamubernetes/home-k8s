# yaml-language-server: $schema=https://k8s-schemas.pages.dev/batch/job_v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: stash-k92-native-originals
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stash-k92-native-originals
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: isolated-owner
          image: ghcr.io/jfroy/stash:v0.28.1-cudajellyfin.4@sha256:0e4b5eb7971ddadc0e482fd9799a5fd621160359ce67da4bdda990ccc67e06c2
          command:
            - python3
            - -c
            - import os; os.chmod('/work',0o700); os.chown('/work',1000,1000)
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - name: work
              mountPath: /work
      containers:
        - name: native
          image: ghcr.io/jfroy/stash:v0.28.1-cudajellyfin.4@sha256:0e4b5eb7971ddadc0e482fd9799a5fd621160359ce67da4bdda990ccc67e06c2
          command:
            - python3
            - /kopiur/original-native.py
          workingDir: /work
          env:
            - name: RECOVERY_TARGET
              value: isolated
            - name: NAS_SNAPSHOT
              value: 1e3c5b07dc00567645440ab7fa5e3c9c
            - name: R2_SNAPSHOT
              value: 9b0e637cbde3e94eb40de483da6a529a
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 2Gi
              ephemeral-storage: 6Gi
          volumeMounts:
            - name: nas
              mountPath: /original/nas
              readOnly: true
            - name: r2
              mountPath: /original/r2
              readOnly: true
            - name: helper
              mountPath: /kopiur
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: nas
          persistentVolumeClaim:
            claimName: stash-k92-native-original-nas
            readOnly: true
        - name: r2
          persistentVolumeClaim:
            claimName: stash-k92-native-original-r2
            readOnly: true
        - name: helper
          configMap:
            name: stash-kopiur-native
        - name: work
          emptyDir:
            sizeLimit: 6Gi
  suspend: false

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stash-k92-native-originals
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stash-k92-native-originals
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
