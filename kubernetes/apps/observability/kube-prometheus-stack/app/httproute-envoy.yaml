# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager-envoy
  annotations:
    homepage.shamubernetes.com/enabled: "true"
    homepage.shamubernetes.com/name: "Alertmanager"
    homepage.shamubernetes.com/description: "Review and silence alerts"
    homepage.shamubernetes.com/group: "Observability"
    homepage.shamubernetes.com/order: "50"
    homepage.shamubernetes.com/favorite: "false"
    homepage.shamubernetes.com/icon: "dashboard-icons:alertmanager"
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - "alertmanager.${HOME_DOMAIN}"
  rules:
  - backendRefs:
    - name: kube-prometheus-stack-alertmanager
      port: 9093
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-envoy
  annotations:
    homepage.shamubernetes.com/enabled: "true"
    homepage.shamubernetes.com/name: "Prometheus"
    homepage.shamubernetes.com/description: "Query cluster metrics"
    homepage.shamubernetes.com/group: "Observability"
    homepage.shamubernetes.com/order: "40"
    homepage.shamubernetes.com/favorite: "false"
    homepage.shamubernetes.com/icon: "dashboard-icons:prometheus"
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - "prometheus.${HOME_DOMAIN}"
  rules:
  - backendRefs:
    - name: kube-prometheus-stack-prometheus
      port: 9090
