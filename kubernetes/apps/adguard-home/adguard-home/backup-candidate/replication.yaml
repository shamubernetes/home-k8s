apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: adguard-home-native-nas-to-r2
spec:
  sourceRef:
    kind: Repository
    name: adguard-home-nas-smb
  destinationRef:
    kind: Repository
    name: adguard-home-r2
  schedule:
    cron: 0 20 * * *
    jitter: 10m
  selection:
    identities:
      include:
        - username: adguard-home
          hostname: adguard-home
          sourcePath: /pvc/data-adguard-home-0
    latestOnly: false
  migrate:
    parallel: 2
    policies: none
  pruning:
    retention:
      keepDaily: 7
      keepWeekly: 4
  suspend: false
