apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: profilarr-envoy-api-hermes
  namespace: arrs
spec:
  hostnames:
  - "profilarr.${HOME_DOMAIN}"
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-internal
    namespace: network
    sectionName: https
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
      headers:
      - name: X-Api-Key
        type: RegularExpression
        value: ".+"
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        remove:
        - X-Auth-Request-User
        - X-Auth-Request-Email
        - X-Auth-Request-Groups
    backendRefs:
    - group: ""
      kind: Service
      name: profilarr
      port: 6868
