# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: reflector
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    image:
      repository: docker.io/emberstack/kubernetes-reflector
      tag: 10.0.72@sha256:780666bc61c74d61fac768fe062610c7975e97640cfc014c83c0f66c9d6fdf20
