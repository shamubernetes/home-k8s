# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tunarr-envoy
  annotations:
    homepage.shamubernetes.com/enabled: "true"
    homepage.shamubernetes.com/name: "ZooTV"
    homepage.shamubernetes.com/description: "Scheduled channels from the media library"
    homepage.shamubernetes.com/group: "Media"
    homepage.shamubernetes.com/icon: "dashboard-icons:tunarr"
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - "tunarr.${HOME_DOMAIN}"
  rules:
  - timeouts:
      request: 0s
      backendRequest: 0s
    backendRefs:
    - name: tunarr
      port: 8000
