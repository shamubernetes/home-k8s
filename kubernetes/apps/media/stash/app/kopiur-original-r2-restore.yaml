        add:
          - CHOWN
          - FOWNER
          - DAC_OVERRIDE
        drop:
          - ALL
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
  options:
    enableFileDeletion: false
    ignoreErrors: false
    ignorePermissionErrors: false
    parallel: 8
    skipOwners: false
    skipPermissions: false
    skipTimes: false
    writeFilesAtomically: true
  policy:
    onMissingSnapshot: Fail
    waitTimeout: 1m
  repository:
    kind: Repository
    name: stash-r2
  source:
    identity:
      hostname: media
      snapshotID: 9b0e637cbde3e94eb40de483da6a529a
      sourcePath: /pvc/stash-data
