# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./ocirepository.yaml
- ./legacy-recovery-secrets.yaml
- ./externalsecret.yaml
- ./externalsecret-kopiur.yaml
- ./helmrelease.yaml
- ./httproute-envoy.yaml
- ./kopiur-policy.yaml
- ./kopiur-existing-originals.yaml
- ./kopiur-native-originals.yaml
- ./kopiur-repositories.yaml
- ./notification-sync.yaml
- ../../../../templates/gatus/guarded
configMapGenerator:
- name: changedetection-k92-original-native
  files:
  - original-native.py
  options:
    annotations:
      reloader.stakater.com/ignore: "true"
generatorOptions:
  disableNameSuffixHash: true
