# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Talos - Validate"

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "talos-validate-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Talos - Validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install tools
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        install_args: task talosctl github:budimanjojo/talhelper helm yq
        cache: true
        fetch_from_github: false

    # Keep the capacity contract in this branch-protected job.
    - name: Check ARC capacity floors
      run: bash scripts/tests/test-arc-capacity.sh

    - name: Check coordinated Talos target
      run: scripts/check-talos-version-sync

    - name: Validate Talos machine configs
      run: task talos:validate