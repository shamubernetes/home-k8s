# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./ocirepository.yaml
- ./legacy-recovery-secrets.yaml
- ./externalsecret.yaml
- ./externalsecret-kopiur.yaml
- ./externalsecret-oidc.yaml
- ./helmrelease.yaml
- ./httproute-envoy-browser.yaml
- ./kopiur-policy.yaml
- ./kopiur-existing-originals.yaml
- ./kopiur-native-originals.yaml
- ./kopiur-repositories.yaml
- ./securitypolicy-oidc.yaml
- ./service-envoy-dns.yaml
configMapGenerator:
- name: homarr-k92-original-native
  files:
  - original-native.js
  options:
    annotations:
      reloader.stakater.com/ignore: "true"
generatorOptions:
  disableNameSuffixHash: true
