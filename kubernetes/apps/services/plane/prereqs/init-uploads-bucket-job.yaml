# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/job-batch-v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: plane-init-uploads-bucket
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-bucket
        image: docker.io/amazon/aws-cli:2.36.34@sha256:cf1f5e5741c33f3fee383296ba8045b96b9eb93c3de017be6688fb00356352d7
        envFrom:
        - secretRef:
            name: plane-doc-store-secret
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          export AWS_DEFAULT_REGION="${AWS_REGION:-us-east-1}"
          aws --endpoint-url "$AWS_S3_ENDPOINT_URL" --region "$AWS_DEFAULT_REGION" s3 mb "s3://uploads" 2>/dev/null || true
