# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kanvil
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: kanvil-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: postgresql://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASSWORD }}@postgres17-rw.database.svc.cluster.local:5432/kanvil?sslmode=disable
        BETTER_AUTH_SECRET: "{{ .BETTER_AUTH_SECRET }}"
        KANVIL_SETUP_TOKEN: "{{ .KANVIL_SETUP_TOKEN }}"
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        ELASTICSEARCH_API_KEY: "{{ .ELASTICSEARCH_API_KEY }}"
        RABBITMQ_URL: amqp://{{ .RABBITMQ_USER }}:{{ .RABBITMQ_PASSWORD }}@rabbitmq.database.svc.cluster.local:5672/kanvil
  dataFrom:
  - extract:
      key: kanvil
---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kanvil-db-init
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: kanvil-db-init-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_HOST: postgres17-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: kanvil
        INIT_POSTGRES_USER: "{{ .user }}"
        INIT_POSTGRES_PASS: "{{ .password }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .superPassword }}"
  data:
  - secretKey: user
    remoteRef: {key: kanvil, property: POSTGRES_USER}
  - secretKey: password
    remoteRef: {key: kanvil, property: POSTGRES_PASSWORD}
  - secretKey: superPassword
    remoteRef: {key: cloudnative-pg, property: POSTGRES_SUPER_PASS}
