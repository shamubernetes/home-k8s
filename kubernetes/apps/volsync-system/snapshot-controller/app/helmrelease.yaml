# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  postRenderers:
  - kustomize:
      images:
      - name: registry.k8s.io/sig-storage/snapshot-controller
        newName: registry.k8s.io/sig-storage/snapshot-controller
        # renovate: datasource=docker depName=registry.k8s.io/sig-storage/snapshot-controller
        newTag: v8.7.1@sha256:d3c3893704c86f0fe428a6429c705b7103a653bea151db0fc5ab0fdb25bb2290
      - name: registry.k8s.io/sig-storage/snapshot-conversion-webhook
        newName: registry.k8s.io/sig-storage/snapshot-conversion-webhook
        # renovate: datasource=docker depName=registry.k8s.io/sig-storage/snapshot-conversion-webhook
        newTag: v8.7.1@sha256:359bf3c6d40a900bc386970d9b60983fcfc1e5d728ca9e5beac9511d9e4e0597
  values:
    controller:
      replicaCount: 2
      priorityClassName: system-cluster-critical
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi
      serviceMonitor:
        create: true
