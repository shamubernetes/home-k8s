# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-scheduler
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: github-scheduler-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPERATOR_TOKEN: "{{ .OPERATOR_TOKEN }}"
        GITHUB_APP_ID: "{{ .GITHUB_APP_ID }}"
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        OIDC_ALLOWED_GROUPS: "{{ .OIDC_ALLOWED_GROUPS }}"
        # The 1Password field holds the App private key PEM base64-encoded. Spaces are removed first
        # because 1Password turns the line breaks of wrapped base64 into spaces.
        GITHUB_APP_PRIVATE_KEY: '{{ .GITHUB_APP_PRIVATE_KEY | replace " " "" | b64dec }}'
  dataFrom:
  - extract:
      key: github-scheduler
