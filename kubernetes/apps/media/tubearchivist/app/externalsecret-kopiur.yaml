apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tubearchivist-kopiur-nas
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: tubearchivist-kopiur-nas
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        KOPIA_PASSWORD: '{{ .NAS_KOPIA_PASSWORD }}'
        KOPIA_RCLONE_CONFIG: |
          [mnemosyne]
          type = smb
          host = ${IPAM_IP_NFS}
          user = guest
          pass =
          domain = WORKGROUP
  dataFrom:
    - extract:
        key: kopiur-tubearchivist

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tubearchivist-kopiur-r2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: tubearchivist-kopiur-r2
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        KOPIA_PASSWORD: '{{ .R2_KOPIA_PASSWORD }}'
        AWS_ACCESS_KEY_ID: '{{ .R2_ACCESS_KEY_ID }}'
        AWS_SECRET_ACCESS_KEY: '{{ .R2_SECRET_ACCESS_KEY }}'
  dataFrom:
    - extract:
        key: kopiur-tubearchivist

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tubearchivist-kopiur-native
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: tubearchivist-kopiur-native
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        ES_CAPTURE_USER: '{{ .ES_CAPTURE_USER }}'
        ES_CAPTURE_PASSWORD: '{{ .ES_CAPTURE_PASSWORD }}'
        escrow.json: '{{ .RUNTIME_ESCROW_JSON }}'
  dataFrom:
    - extract:
        key: kopiur-tubearchivist
