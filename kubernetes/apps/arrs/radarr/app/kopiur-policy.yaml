apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: radarr
  annotations:
    kopiur.home.arpa/original-native-recovery: https://github.com/shamubernetes/home-k8s/actions/runs/37981655593
spec:
  # Original production NAS/R2 native recovery passed before activation.
  suspend: false
  repository:
    kind: Repository
    name: radarr-nas-smb
  identity:
    username: radarr
    hostname: arrs
  sources:
  - pvc:
      name: radarr
    sourcePathOverride: /pvc/radarr
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  staging:
    timeout: 10m
    storageClassName: ceph-block
    accessModes:
    - ReadWriteOnce
  defaultDeletionPolicy: Retain
  hooks:
    beforeSnapshot:
    - workloadExec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: radarr
            app.kubernetes.io/controller: radarr
        container: kopiur-postgres
        command: [sh, /kopiur/recurring-capture.sh]
        # 120s acknowledgement + 600s capture + 30s escalation, with cleanup.
        timeout: 13m
        continueOnFailure: false
  mover:
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
  verification:
    quick:
      schedule:
        cron: "45 8 * * *"
        jitter: 30m
      parallel: 4
      fileParallelism: 2
      maxErrors: 0
    deep:
      schedule:
        cron: "45 9 * * 0"
        jitter: 1h
      capacity: 24Gi
      storageClassName: ceph-block
      parallel: 2
    successExpr: "stats.files > 0 && stats.errors == 0"
    verifyFilesPercent: 100
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: radarr-daily
spec:
  policyRef:
    name: radarr
  schedule:
    suspend: true
    cron: "45 1 * * *"
    jitter: 10m
    runOnCreate: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: radarr-primary
spec:
  policyRef:
    name: radarr
  schedule:
    suspend: false
    # Preserve the incumbent hourly primary cadence, not the draft daily cadence.
    cron: "${VOLSYNC_SCHEDULE_RADARR}"
    jitter: 10m
    runOnCreate: true
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: radarr-nas-to-r2
spec:
  sourceRef:
    kind: Repository
    name: radarr-nas-smb
  destinationRef:
    kind: Repository
    name: radarr-r2
  schedule:
    cron: "${VOLSYNC_R2_SCHEDULE_RADARR}"
    jitter: 10m
  selection:
    identities:
      include:
      - username: radarr
        hostname: arrs
        sourcePath: /pvc/radarr
    latestOnly: false
  migrate:
    parallel: 2
    policies: none
  # Preserve every copied point. No pruning is introduced.
  suspend: false
