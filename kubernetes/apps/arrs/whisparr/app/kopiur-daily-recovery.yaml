# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kopiur.home-operations.com/snapshot_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Snapshot
metadata:
  name: whisparr-k92-daily-recovery
spec:
  policyRef:
    name: whisparr
  deletionPolicy: Retain
  pin: true
  description: Non-disruptive current capture after transient file mutation rejected the daily attempt
  failurePolicy:
    activeDeadlineSeconds: 3600
    backoffLimit: 0
