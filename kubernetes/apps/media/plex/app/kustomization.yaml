# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./kopiur-native-original-r2-resume.yaml
- ./kopiur-native-original-r2-restore.yaml
- ./kopiur-native-original-nas-resume.yaml
- ./kopiur-native-original-nas-restore.yaml
- ./ocirepository.yaml
- ./pvc.yaml
- ./kopiur-retained-pvc.yaml
- ./legacy-recovery-secrets.yaml
- ./helmrelease.yaml
- ./httproute-envoy.yaml
- ../../../../templates/gatus/external
- ./externalsecret-kopiur.yaml
- ./kopiur-repositories.yaml
- ./kopiur-policy.yaml
- ./kopiur-original.yaml
configMapGenerator:
- name: plex-kopiur-native
  files:
  - capture.sh
  options:
    annotations:
      reloader.stakater.com/ignore: "true"
generatorOptions:
  disableNameSuffixHash: true
