# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant
resources:
  - policy.yaml
  - repositories.yaml
  - capture-pvc.yaml
  - schedule.yaml
  - replication.yaml
configMapGenerator:
  - name: home-assistant-native-capture
    files:
      - capture=capture.py
generatorOptions:
  disableNameSuffixHash: true
