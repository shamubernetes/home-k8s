apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: renovate-fast-maintenance
  namespace: observability
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  resourceNames: [cluster-maintenance-begin-lock]
  verbs: [get, update]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: renovate-fast-maintenance
  namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: renovate-fast-maintenance
subjects:
- kind: ServiceAccount
  name: renovate-fast
  namespace: renovate
