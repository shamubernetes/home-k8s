# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./ocirepository.yaml
- ./externalsecret.yaml
- ./externalsecret-oidc.yaml
- ../../../../templates/volsync
- ./helmrelease.yaml
- ./httproute-envoy-api.yaml
- ./httproute-envoy-browser.yaml
- ./securitypolicy-oidc.yaml
- ./service-envoy-dns.yaml
- ../../../../templates/gatus/guarded
- ./externalsecret-kopiur.yaml
- ./kopiur-repositories.yaml
- ./kopiur-policy.yaml
- ./kopiur-online-original.yaml
- ./kopiur-online-original-r2-retained.yaml
- ./kopiur-original-snapshot.yaml
- ./kopiur-original-replication.yaml
- ./kopiur-original-r2-retained.yaml
- ./kopiur-first-scheduled-r2-retained.yaml
components:
- ../../../../components/kopiur-postgres
patches:
- patch: |-
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${APP}
      annotations:
        kustomize.toolkit.fluxcd.io/prune: disabled
- path: ./kopiur-postgres-patch.yaml
- path: ./kopiur-recurring-runtime-patch.yaml
configMapGenerator:
- name: radarr-kopiur-recurring
  options:
    annotations:
      reloader.stakater.com/ignore: "true"
  files:
  - recurring.sh=./recurring.sh
  - recurring-capture.sh=./recurring-capture.sh
generatorOptions:
  disableNameSuffixHash: true
replacements:
- source:
    kind: ConfigMap
    name: radarr-kopiur-recurring
    fieldPath: data.recurring-capture\.sh
  targets:
  - select:
      kind: SnapshotPolicy
      name: radarr
    fieldPaths:
    - spec.hooks.beforeSnapshot.0.workloadExec.command.5
