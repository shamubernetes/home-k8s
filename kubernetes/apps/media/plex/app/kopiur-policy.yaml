# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: plex
spec:
  suspend: false
  files:
    ignoreRules:
      - /lost+found
      - /Cache
      - /Media
      - /Logs
      - /.kopiur-native/previous
      - /.kopiur-native/pending
      - /.kopiur-native/lock
      - /.kopiur-native/unsupported
      - /Plug-in Support/Databases/com.plexapp.plugins.library.db
      - /Plug-in Support/Databases/com.plexapp.plugins.library.db-wal
      - /Plug-in Support/Databases/com.plexapp.plugins.library.db-shm
      - /Plug-in Support/Databases/com.plexapp.plugins.library.db-journal
      - /Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db
      - /Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db-wal
      - /Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db-shm
      - /Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db-journal
  repository:
    kind: Repository
    name: plex-nas-smb
  errorHandling:
    failFast: true
    ignoreDirErrors: false
    ignoreFileErrors: false
    ignoreUnknownTypes: false
  identity:
    username: plex
    hostname: media
  sources:
    - pvc:
        name: plex
      sourcePathOverride: /pvc/plex
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  staging:
    timeout: 10m
    storageClassName: ceph-block
    accessModes:
      - ReadWriteOnce
  defaultDeletionPolicy: Retain
  retention:
    keepDaily: 7
    keepWeekly: 4
  hooks:
    beforeSnapshot:
      - runJob:
          timeout: 12m
          continueOnFailure: false
          jobSpec:
            backoffLimit: 0
            activeDeadlineSeconds: 660
            ttlSecondsAfterFinished: 86400
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: plex-kopiur-capture
              spec:
                automountServiceAccountToken: false
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 568
                  runAsGroup: 568
                  seccompProfile:
                    type: RuntimeDefault
                affinity:
                  podAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchLabels:
                            app.kubernetes.io/name: plex
                            app.kubernetes.io/controller: plex
                        topologyKey: kubernetes.io/hostname
                containers:
                  - name: capture
                    image: ghcr.io/home-operations/plex:1.43.5.11079@sha256:06ef0fc23e9af9bbaf284c3f27972f94e703d13d6f745edeb6818fcbebf6c673
                    command:
                      - timeout
                      - "600"
                      - bash
                      - /kopiur/capture.sh
                    env: []
                    volumeMounts:
                      - name: source
                        mountPath: /config
                      - name: helper
                        mountPath: /kopiur
                        readOnly: true
                      - name: tmp
                        mountPath: /tmp
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                          - ALL
                    resources:
                      requests:
                        cpu: 25m
                        memory: 128Mi
                      limits:
                        memory: 1Gi
                volumes:
                  - name: source
                    persistentVolumeClaim:
                      claimName: plex
                  - name: helper
                    configMap:
                      name: plex-kopiur-native
                  - name: tmp
                    emptyDir: {}
  mover:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 568
      runAsGroup: 568
      seccompProfile:
        type: RuntimeDefault
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
  verification:
    quick:
      schedule:
        cron: 0 10 * * *
        jitter: 30m
      parallel: 2
      maxErrors: 0
    deep:
      schedule:
        cron: 0 11 * * 0
        jitter: 1h
      capacity: 150Gi
      storageClassName: ceph-block
      parallel: 2
    successExpr: stats.errors == 0 && stats.files > 0
    verifyFilesPercent: 100

---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: plex-daily
spec:
  policyRef:
    name: plex
  schedule:
    cron: 0 18 * * *
    suspend: false
    timezone: America/New_York
    jitter: 5m
    runOnCreate: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3

---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: plex-nas-to-r2
  annotations:
    kopiur.home-operations.com/run-requested: "2026-10-21T04:53:35.449764+00:00"
spec:
  suspend: false
  sourceRef:
    kind: Repository
    name: plex-nas-smb
  destinationRef:
    kind: Repository
    name: plex-r2
  schedule:
    cron: 0 19 * * *
    timezone: America/New_York
    jitter: 5m
  selection:
    identities:
      include:
        - username: plex
          hostname: media
          sourcePath: /pvc/plex
    latestOnly: true
  migrate:
    parallel: 2
    policies: none
  pruning:
    none: {}
