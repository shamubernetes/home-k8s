# yaml-language-server: $schema=https://k8s-schemas.pages.dev/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bjw-s
  namespace: flux-system
spec:
  interval: 30m
  # Preserve retained HelmChart and dormant HelmRelease references without
  # depending on the upstream GitHub Pages index or changing chart versions.
  type: oci
  url: oci://ghcr.io/bjw-s-labs/helm
