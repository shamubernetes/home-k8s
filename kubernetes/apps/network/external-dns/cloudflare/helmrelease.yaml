# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-cloudflare
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: external-dns-cloudflare
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    image:
      repository: registry.k8s.io/external-dns/external-dns
      tag: v0.24.0@sha256:a80a146d2540fa138565e404f0625157271071a06093021f27ae19d8316d10f9
    provider:
      name: cloudflare
    env:
    - name: &name CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: &secret external-dns-cloudflare-secret
          key: *name
    extraArgs:
    - --annotation-prefix=external-dns.alpha.kubernetes.io/
    - --cloudflare-dns-records-per-page=1000
    - --events
    - --ingress-class=external
    - --ignore-ingress-tls-spec
    - --gateway-name=envoy-external
    - --gateway-namespace=network
    - --cloudflare-proxied
    - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
    - --crd-source-kind=DNSEndpoint
    policy: sync
    sources: ["crd", "gateway-httproute", "ingress"]
    txtPrefix: k8s.
    txtOwnerId: default
    domainFilters: ["${HOME_DOMAIN}", "${GAME_DOMAIN}", "${DEV_DOMAIN}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
