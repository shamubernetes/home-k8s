apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: radarr
  annotations:
    kopiur.home.arpa/online-original-native-recovery: https://github.com/shamubernetes/home-k8s/actions/runs/39522527396
    kopiur.home.arpa/original-native-recovery: https://github.com/shamubernetes/home-k8s/actions/runs/37981655593
spec:
  # Actual online original NAS/R2 native recovery39522527396 passed.
  # The reviewed producer never stops or holds the production application.
  suspend: false
  repository:
    kind: Repository
    name: radarr-nas-smb
  identity:
    username: radarr
    hostname: arrs
  sources:
  - pvc:
      name: radarr
    sourcePathOverride: /pvc/radarr
  copyMethod: Snapshot
  volumeSnapshotClassName: csi-ceph-blockpool
  staging:
    timeout: 10m
    storageClassName: ceph-block
    accessModes:
    - ReadWriteOnce
  defaultDeletionPolicy: Retain
  hooks:
    beforeSnapshot:
    - workloadExec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: radarr
            app.kubernetes.io/controller: radarr
        container: kopiur-postgres
        # Embed the helper at render time, bypassing stale subPath file mounts.
        command: [timeout, --kill-after=30, "600", sh, -c, ""]
        # Native online capture plus escalation and cleanup, never a writer hold.
        timeout: 13m
        continueOnFailure: false
  mover:
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
  verification:
    quick:
      schedule:
        cron: "45 8 * * *"
        jitter: 30m
      parallel: 4
      fileParallelism: 2
      maxErrors: 0
    deep:
      schedule:
        cron: "45 9 * * 0"
        jitter: 1h
      capacity: 24Gi
      storageClassName: ceph-block
      parallel: 2
    successExpr: "stats.files > 0 && stats.errors == 0"
    verifyFilesPercent: 100
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: radarr-daily
spec:
  policyRef:
    name: radarr
  schedule:
    suspend: true
    cron: "45 1 * * *"
    jitter: 10m
    runOnCreate: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: radarr-primary
spec:
  policyRef:
    name: radarr
  schedule:
    suspend: false
    # One daily online capture; no hourly inherited variable or redundant replay.
    cron: "40 1 * * *"
    timezone: UTC
    jitter: 5m
    runOnCreate: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: radarr-nas-to-r2
  annotations:
    kopiur.home-operations.com/run-requested: "2026-10-20T19:31:35Z"
spec:
  sourceRef:
    kind: Repository
    name: radarr-nas-smb
  destinationRef:
    kind: Repository
    name: radarr-r2
  schedule:
    cron: "20 2 * * *"
    timezone: UTC
    jitter: 10m
  selection:
    identities:
      include:
      - username: radarr
        hostname: arrs
        sourcePath: /pvc/radarr
    latestOnly: true
  migrate:
    parallel: 2
    policies: none
  # Copy the current accepted identity point, not unrelated retained history.
  # Keep every existing NAS/R2 point and all retention policy ownership in place.
  pruning:
    none: {}
  suspend: false
