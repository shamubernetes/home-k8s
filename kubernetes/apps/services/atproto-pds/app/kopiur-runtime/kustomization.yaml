# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
- name: atproto-pds-kopiur-recurring
  files:
  - recurring.sh
  - capture.cjs
  options:
    disableNameSuffixHash: true
    annotations:
      # Projected directory update only. Keep Secret-driven Reloader behavior.
      reloader.stakater.com/ignore: "true"
    labels:
      app.kubernetes.io/name: atproto-pds
