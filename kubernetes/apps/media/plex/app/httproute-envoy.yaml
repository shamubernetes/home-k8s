# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plex-envoy
  annotations:
    homepage.shamubernetes.com/enabled: "true"
    homepage.shamubernetes.com/name: "Plex"
    homepage.shamubernetes.com/description: "Movies, shows, and personal media"
    homepage.shamubernetes.com/group: "Media"
    homepage.shamubernetes.com/order: "20"
    homepage.shamubernetes.com/favorite: "true"
    homepage.shamubernetes.com/icon: "dashboard-icons:plex"
    homepage.shamubernetes.com/icon-light: "dashboard-icons:plex-light"
spec:
  parentRefs:
  - name: envoy-external
    namespace: network
    sectionName: https
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - "plex.${HOME_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: plex
      port: 32400
