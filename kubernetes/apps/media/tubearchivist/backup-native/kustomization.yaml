apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - original-native-job.yaml
  - original-r2-restore.yaml
  - original-nas-restore.yaml
  - original-v2.yaml
  - externalsecret.yaml
  - repositories.yaml
  - native-credentials.yaml
  - policy.yaml
  - schedule.yaml
  - replication.yaml
configMapGenerator:
  - name: tubearchivist-native-capture
    files:
      - capture.py
      - original-native.py
    options:
      annotations:
        reloader.stakater.com/ignore: "true"
generatorOptions:
  disableNameSuffixHash: true
