# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openviking
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: openviking-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENVIKING_CONF_CONTENT: |
          {
            "server": {
              "host": "0.0.0.0",
              "port": 1933,
              "auth_mode": "api_key",
              "root_api_key": "{{ .ROOT_API_KEY }}",
              "cors_origins": ["https://openviking.${HOME_DOMAIN}"]
            },
            "storage": {
              "workspace": "/app/.openviking/data",
              "agfs": {"backend": "local"},
              "vectordb": {"name": "context", "backend": "local"}
            },
            "embedding": {
              "dense": {
                "api_base": "http://localhost:11434/v1",
                "provider": "ollama",
                "dimension": 1024,
                "input": "text",
                "model": "qwen3-embedding:0.6b"
              }
            },
            "vlm": {
              "api_base": "http://localhost:11434",
              "api_key": "no-key",
              "provider": "litellm",
              "model": "ollama/qwen3.5:4b",
              "temperature": 0.0,
              "max_retries": 2,
              "timeout": 900,
              "extra_request_body": {"num_ctx": 16384, "think": false}
            }
          }
  dataFrom:
  - extract:
      key: openviking
