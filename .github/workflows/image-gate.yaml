# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Availability Gate

on:
  # This gate always executes from the trusted default-branch workflow.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: ["main"]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: "image-availability-gate-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  gate:
    name: Talos Image Availability
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout trusted gate
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/heads/main
        path: trusted
        persist-credentials: false

    - name: Require trusted image pre-pull when applicable
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PULL_REQUEST: ${{ github.event.pull_request.number }}
        PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        if [[ $HEAD_REPOSITORY != "$REPOSITORY" ]]; then
          echo 'Talos pre-pull is not available to fork pull requests.'
          exit 0
        fi
        if [[ $PULL_REQUEST_AUTHOR != 'shamubot[bot]' ]]; then
          echo 'A trusted workflow dispatch is required for this same-repository pull request.'
        fi

        mapfile -t changed_files < <(
          gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PULL_REQUEST}/files?per_page=100" \
            --jq '.[].filename'
        )
        scope=$(printf '%s\n' "${changed_files[@]}" |
          trusted/scripts/talos-image-gate-scope)
        if [[ $scope != applicable ]]; then
          echo 'No eligible Kubernetes application changes require Talos image availability.'
          exit 0
        fi

        for attempt in {1..240}; do
          gh api \
            "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" \
            > checks.json

          set +e
          result=$(trusted/scripts/talos-check-gate \
            --checks checks.json \
            --app-id 15368 \
            --required 'Talos Image Prepull' 2>&1)
          status=$?
          set -e
          case "$status" in
            0)
              printf '%s\n' "$result"
              exit 0
              ;;
            1)
              printf '%s\n' "$result" >&2
              exit 1
              ;;
            10)
              set +e
              planner=$(trusted/scripts/talos-check-gate \
                --checks checks.json \
                --app-id 15368 \
                --required 'Render immutable image plan' 2>&1)
              planner_status=$?
              set -e
              if [[ $planner_status -eq 1 ]]; then
                printf '%s\n' "$planner" >&2
                exit 1
              fi
              if (( attempt == 240 )); then
                printf '%s\n' "$result" >&2
                exit 1
              fi
              sleep 10
              ;;
            *) exit "$status" ;;
          esac
        done
