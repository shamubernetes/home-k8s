# yaml-language-server: $schema=https://k8s-schemas.pages.dev/batch/job_v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: audiobookshelf-k92-sqlite-originals
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        recovery.kopiur.home.arpa/role: audiobookshelf-sql-original
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify
          image: ghcr.io/home-operations/sabnzbd:5.1.3@sha256:b1795982db498ed5691a7b1231f0fac7eed2a1d53e9c81b8e834d02695e76104
          command:
            - python3
            - /kopiur/original-sqlite.py
          env:
            - name: RECOVERY_TARGET
              value: isolated
            - name: TARGET_APP
              value: audiobookshelf
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: ORIGINAL_POINTS
              value: '{"nas": "9ea2ee7843ea99c2e3265b20f2ef3336", "r2": "a62e366b6748859e3148f4d155c6ed15"}'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              memory: 1Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: nas
              mountPath: /original/nas
              readOnly: true
            - name: r2
              mountPath: /original/r2
              readOnly: true
            - name: helper
              mountPath: /kopiur
              readOnly: true
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nas
          persistentVolumeClaim:
            claimName: audiobookshelf-k92-existing-nas
            readOnly: true
        - name: r2
          persistentVolumeClaim:
            claimName: audiobookshelf-k92-existing-r2
            readOnly: true
        - name: helper
          configMap:
            name: audiobookshelf-k92-sqlite-original
        - name: work
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audiobookshelf-k92-sqlite-originals
spec:
  podSelector:
    matchLabels:
      recovery.kopiur.home.arpa/role: audiobookshelf-sql-original
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
