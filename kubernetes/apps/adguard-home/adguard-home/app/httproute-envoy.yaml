spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - "adguard-tertiary.${HOME_DOMAIN}"
  rules:
  - backendRefs:
    - name: adguard-home-tertiary
      port: 3000
