# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cowbell-rollback
  labels:
    app.kubernetes.io/component: rollback-compatibility
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: cowbell-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        COWBELL_BACKEND_SECRET: "{{ .backendSecret }}"
        COWBELL_HERMES_SECRET: "{{ .hermesSecret }}"
        COWBELL_HERMES_WEBHOOK_SECRET: "{{ .hermesWebhookSecret }}"
        COWBELL_HERMES_WEBHOOK_URL: https://hermes-gateway.${HOME_DOMAIN}/webhooks/cowbell-issue
        COWBELL_LISTENER_DATABASE_URL: "{{ .listenerDatabaseURL }}"
        DATABASE_URL: "{{ .databaseURL }}"
        PLEX_CLIENT_ID: 213050c9e68f0f2cf7cf7f9852f78e7f
        PLEX_SERVER_ID: 5b4122f45aaecbfa1f5e19003d8424ec4521d90d
        PLEX_REDIRECT_URI: https://issue.${HOME_DOMAIN}/auth/plex/callback
        PLEX_PRODUCT_NAME: Cowbell
        PLEX_CATALOG_BASE_URL: "{{ .plexCatalogBaseURL }}"
        PLEX_CATALOG_TOKEN: "{{ .plexCatalogToken }}"
        TAUTULLI_BASE_URL: http://tautulli.observability.svc.cluster.local
        TAUTULLI_API_KEY: "{{ .tautulliAPIKey }}"
        CATALOG_CACHE_REDIS_URL: redis://dragonfly.database.svc.cluster.local:6379/9
        POSTER_CACHE_REDIS_URL: redis://dragonfly.database.svc.cluster.local:6379/9
        INIT_POSTGRES_DBNAME: "{{ .initPostgresDBName }}"
        INIT_POSTGRES_HOST: "{{ .initPostgresHost }}"
        INIT_POSTGRES_USER: "{{ .initPostgresUser }}"
        INIT_POSTGRES_PASS: "{{ .initPostgresPass }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .initPostgresSuperPass }}"
  data:
  - secretKey: backendSecret
    remoteRef:
      key: The Zoo - Cowbell
      property: COWBELL_BACKEND_SECRET
  - secretKey: hermesSecret
    remoteRef:
      key: The Zoo - Cowbell
      property: COWBELL_HERMES_SECRET
  - secretKey: hermesWebhookSecret
    remoteRef:
      key: The Zoo - Cowbell
      property: COWBELL_HERMES_WEBHOOK_SECRET
  - secretKey: listenerDatabaseURL
    remoteRef:
      key: The Zoo - Cowbell
      property: COWBELL_LISTENER_DATABASE_URL
  - secretKey: databaseURL
    remoteRef:
      key: The Zoo - Cowbell
      property: DATABASE_URL
  - secretKey: plexCatalogBaseURL
    remoteRef:
      key: The Zoo - Cowbell
      property: PLEX_CATALOG_BASE_URL
  - secretKey: plexCatalogToken
    remoteRef:
      key: The Zoo - Cowbell
      property: PLEX_CATALOG_TOKEN
  - secretKey: tautulliAPIKey
    remoteRef:
      key: tautulli
      property: TAUTULLI_API_KEY
  - secretKey: initPostgresDBName
    remoteRef:
      key: The Zoo - Cowbell
      property: INIT_POSTGRES_DBNAME
  - secretKey: initPostgresHost
    remoteRef:
      key: The Zoo - Cowbell
      property: INIT_POSTGRES_HOST
  - secretKey: initPostgresUser
    remoteRef:
      key: The Zoo - Cowbell
      property: INIT_POSTGRES_USER
  - secretKey: initPostgresPass
    remoteRef:
      key: The Zoo - Cowbell
      property: INIT_POSTGRES_PASS
  - secretKey: initPostgresSuperPass
    remoteRef:
      key: cloudnative-pg
      property: POSTGRES_SUPER_PASS
