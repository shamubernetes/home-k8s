# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_release
    repo_owner: fluxcd
    repo_name: flux2
    description: Open and extensible continuous delivery solution for Kubernetes. Powered by GitOps Toolkit
    version_constraint: "false"
    version_overrides:
      - version_constraint: semver("<= 0.25.2")
        asset: flux_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            format: zip
        files:
          - name: flux
        checksum:
          type: github_release
          asset: flux_{{trimV .Version}}_checksums.txt
          algorithm: sha256
      - version_constraint: semver("<= 2.0.0")
        asset: flux_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            format: zip
        files:
          - name: flux
        checksum:
          type: github_release
          asset: flux_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity
              - https://github.com/fluxcd/flux2/.github/workflows/release.yaml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_checksums.txt.sig
              - --certificate
              - https://github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_checksums.txt.pem
              - --certificate-github-workflow-repository
              - fluxcd/flux2
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
      - version_constraint: "true"
        asset: flux_{{trimV .Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        overrides:
          - goos: windows
            format: zip
        files:
          - name: flux
        checksum:
          type: github_release
          asset: flux_{{trimV .Version}}_checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate-identity
              - https://github.com/fluxcd/flux2/.github/workflows/release.yaml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_checksums.txt.sig
              - --certificate
              - https://github.com/fluxcd/flux2/releases/download/{{.Version}}/flux_{{trimV .Version}}_checksums.txt.pem
              - --certificate-github-workflow-repository
              - fluxcd/flux2
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        slsa_provenance:
          type: github_release
          asset: provenance.intoto.jsonl
          signer_identity: https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0
          signer_issuer: https://token.actions.githubusercontent.com
  # Kyverno 1.20.0 moved signing to this exact reusable workflow.
  # All other releases retain the upstream signer contract.
  - type: github_release
    repo_owner: kyverno
    repo_name: kyverno
    description: Cloud Native Policy Management
    version_filter: not (Version matches "-(alpha|beta|rc)")
    version_constraint: "false"
    version_overrides:
      - version_constraint: Version == "v1.20.0"
        asset: kyverno-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements: {amd64: x86_64}
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: github_release
              asset: checksums.txt.sigstore.json
            opts:
              - --certificate-identity
              - https://github.com/kyverno/kyverno/.github/workflows/release-publish.yaml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-github-workflow-repository
              - kyverno/kyverno
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        overrides:
          - goos: windows
            format: zip
      - version_constraint: Version == "v1.5.5"
        no_asset: true
      - version_constraint: semver("<= 1.1.5")
        no_asset: true
      - version_constraint: semver("<= 1.5.8")
        asset: kyverno-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        rosetta2: true
        windows_arm_emulation: true
        replacements: {amd64: x86_64}
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
        supported_envs: [darwin, windows, amd64]
      - version_constraint: semver("<= 1.10.0")
        asset: kyverno-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements: {amd64: x86_64}
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
        overrides:
          - goos: windows
            format: zip
      - version_constraint: semver("<= 1.10.7")
        asset: kyverno-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        windows_arm_emulation: true
        replacements: {amd64: x86_64}
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://github.com/kyverno/kyverno/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-identity
              - https://github.com/kyverno/kyverno/.github/workflows/release.yaml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://github.com/kyverno/kyverno/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate-github-workflow-repository
              - kyverno/kyverno
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        overrides:
          - goos: windows
            format: zip
      - version_constraint: semver("< 1.17.2")
        asset: kyverno-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements: {amd64: x86_64}
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
          cosign:
            opts:
              - --certificate
              - https://github.com/kyverno/kyverno/releases/download/{{.Version}}/checksums.txt.pem
              - --certificate-identity
              - https://github.com/kyverno/kyverno/.github/workflows/release.yaml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --signature
              - https://github.com/kyverno/kyverno/releases/download/{{.Version}}/checksums.txt.sig
              - --certificate-github-workflow-repository
              - kyverno/kyverno
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        overrides:
          - goos: windows
            format: zip
      - version_constraint: "true"
        asset: kyverno-cli_{{.Version}}_{{.OS}}_{{.Arch}}.{{.Format}}
        format: tar.gz
        replacements: {amd64: x86_64}
        checksum:
          type: github_release
          asset: checksums.txt
          algorithm: sha256
          cosign:
            bundle:
              type: github_release
              asset: checksums.txt.sigstore.json
            opts:
              - --certificate-identity
              - https://github.com/kyverno/kyverno/.github/workflows/release.yaml@refs/tags/{{.Version}}
              - --certificate-oidc-issuer
              - https://token.actions.githubusercontent.com
              - --certificate-github-workflow-repository
              - kyverno/kyverno
              - --certificate-github-workflow-ref
              - refs/tags/{{.Version}}
        overrides:
          - goos: windows
            format: zip
