# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/job-batch-v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: plane-init-bucket
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-bucket
        image: docker.io/amazon/aws-cli:2.36.29@sha256:6a1305a37e63914356f9d1808f3349c06a650cbd6e7c777f5dc4b44d630d6b39
        envFrom:
        - secretRef:
            name: plane-doc-store-secret
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          export AWS_DEFAULT_REGION="${AWS_REGION:-us-east-1}"
          aws --endpoint-url "$AWS_S3_ENDPOINT_URL" --region "$AWS_DEFAULT_REGION" s3 mb "s3://$AWS_S3_BUCKET_NAME" 2>/dev/null || true
