# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./externalsecret-kopiur.yaml
- ./kopiur-repositories.yaml
- ./kopiur-policy.yaml
- ./kopiur-existing-originals.yaml
- ./ocirepository.yaml
- ../../../../templates/volsync
- ./helmrelease.yaml
- ./httproute-envoy.yaml
- ../../../../templates/gatus/guarded
patches:
- patch: |-
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${APP}
      annotations:
        kustomize.toolkit.fluxcd.io/prune: disabled
