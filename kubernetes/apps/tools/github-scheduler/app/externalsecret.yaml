# yaml-language-server: $schema=https://k8s-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-scheduler
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: op-secret-store
  target:
    name: github-scheduler-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPERATOR_TOKEN: "{{ .OPERATOR_TOKEN }}"
        GITHUB_APP_ID: "{{ .GITHUB_APP_ID }}"
        # The 1Password field holds the App private key PEM base64-encoded on one line.
        GITHUB_APP_PRIVATE_KEY: "{{ .GITHUB_APP_PRIVATE_KEY | b64dec }}"
  dataFrom:
  - extract:
      key: github-scheduler
