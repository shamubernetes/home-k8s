# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  login:
    desc: Login to Github
    cmd: gh auth login

  publish-schemas:
    desc: Run the Publish Schemas Github Action
    cmd: gh workflow run "Publish Schemas"

  update-kubeconfig:
    desc: Update the kubeconfig file
    cmd: gh secret set KUBECONFIG --body "$(command cat {{.ROOT_DIR}}/kubeconfig | base64 | tr -d '\n')"

  deliver-pr:
    desc: Watch one PR head and optionally merge it with an explicit repository
    summary: |
      pr: Pull request number or URL (required)
      args: Optional flags passed to scripts/pr-deliver, for example --merge
    cmd: '{{.ROOT_DIR}}/scripts/pr-deliver {{.pr}} {{.args}}'
    vars:
      args: '{{.args | default ""}}'
    requires:
      vars: ["pr"]
