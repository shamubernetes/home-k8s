# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app palworld
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: palworld
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      palworld:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          prepare:
            image:
              repository: ghcr.io/thezoo-house/gamekeeper
              tag: v0.2.0@sha256:00c583ab77366508a66595b76aca5e15811b889c5633ecb7a0a00fea4c256d12
            command: ["bun", "-e"]
            args:
              - |
                import {
                  chownSync,
                  chmodSync,
                  existsSync,
                  mkdirSync,
                  readFileSync,
                  renameSync,
                  statSync,
                  writeFileSync,
                } from "node:fs";
                import { dirname } from "node:path";

                const source = "/config/PalWorldSettings.ini";
                const target = "/pal/Package/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini";
                const temporary = target + ".gamekeeper-sync";
                const seed = readFileSync(source, "utf8");
                let content = !existsSync(target) || statSync(target).size === 0
                  ? seed
                  : readFileSync(target, "utf8");

                const protectedSettings = [
                  "AdminPassword",
                  "RESTAPIEnabled",
                  "RESTAPIPort",
                ];
                const valuePattern = '(?:"(?:\\\\.|[^"\\\\])*"|[^,)]+)';
                for (const name of protectedSettings) {
                  const expression = new RegExp(name + "=(" + valuePattern + ")", "g");
                  const sourceMatches = [...seed.matchAll(expression)];
                  const targetMatches = [...content.matchAll(expression)];
                  if (sourceMatches.length !== 1 || targetMatches.length !== 1) {
                    throw new Error("Palworld protected settings are malformed");
                  }
                  const replacement = name + "=" + sourceMatches[0][1];
                  content = content.replace(expression, replacement);
                }

                mkdirSync(dirname(target), { recursive: true });
                writeFileSync(temporary, content, { encoding: "utf8", mode: 0o600 });
                chownSync(temporary, 1000, 1000);
                chmodSync(temporary, 0o600);
                renameSync(temporary, target);
            securityContext:
              runAsUser: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
        containers:
          app:
            image:
              repository: ghcr.io/pocketpairjp/palserver
              tag: v1.0.3.101283@sha256:ffb778dd63a04cf0d901b95e934e547e1fee67234e33102d5b5bf7da36e2b264
            args:
              - -port=8211
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 4
                memory: 32Gi
              limits:
                cpu: 8
                memory: 40Gi
          agent:
            image:
              repository: ghcr.io/thezoo-house/gamekeeper
              tag: v0.2.0@sha256:00c583ab77366508a66595b76aca5e15811b889c5633ecb7a0a00fea4c256d12
            command:
              - bun
              - --no-install
              - --no-env-file
              - scripts/game-agent.ts
            env:
              GAMEKEEPER_AGENT_PROFILE: palworld
              GAMEKEEPER_AGENT_ROOT: /game/palworld
              GAMEKEEPER_AGENT_PORT: "3001"
              GAMEKEEPER_AGENT_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: palworld-gamekeeper
                    key: token
            probes:
              liveness: &agentProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: &agentPort 3001
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                <<: *agentProbes
                spec:
                  httpGet:
                    path: /health/ready
                    port: *agentPort
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/ready
                    port: *agentPort
                  periodSeconds: 2
                  timeoutSeconds: 2
                  failureThreshold: 30
            ports:
              - name: agent
                containerPort: *agentPort
                protocol: TCP
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
    defaultPodOptions:
      annotations:
        descheduler.alpha.kubernetes.io/evict: "false"
      securityContext:
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: "${IPAM_IP_PALWORLD}"
        ports:
          game:
            port: 8211
            protocol: UDP
      rest:
        controller: *app
        ports:
          rest:
            port: 8212

    persistence:
      saved:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        retain: true
        size: 50Gi
        globalMounts:
          - path: /pal/Package/Pal/Saved
        advancedMounts:
          palworld:
            agent:
              - path: /game/palworld
              - path: /game/palworld/Pal/Saved
      settings:
        type: secret
        name: palworld-settings
        advancedMounts:
          palworld:
            prepare:
              - path: /config/PalWorldSettings.ini
                subPath: PalWorldSettings.ini
                readOnly: true
