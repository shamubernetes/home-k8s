# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./certificate.yaml
- ./externalsecret.yaml
- ./ocirepository.yaml
- ./helmrelease.yaml
- ./networkpolicy.yaml
- ./ciliumnetworkpolicy.yaml
- ./ha-clients-job.yaml
- ./verification-cronjob.yaml
configMapGenerator:
- name: mosquitto-config
  files:
  - ./resources/mosquitto.conf
- name: mosquitto-verification
  files:
  - ./resources/verify.sh
- name: mosquitto-ha-migration
  files:
  - ./resources/reconcile-admin.sh
  - ./resources/provision-ha-clients.sh
  - ./resources/retained-allowlist.txt
generatorOptions:
  disableNameSuffixHash: true
