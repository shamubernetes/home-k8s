# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/job-v1.json
# Disposable native consumers, exact original PVCs read-only. No production runtime Secret or media mounts.
apiVersion: batch/v1
kind: Job
metadata:
  name: grimmory-k8s92-books-consumer-nas
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grimmory-k8s92-books-consumer
        k8s92-backend: nas
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare
          image: docker.io/library/python:3.15-alpine@sha256:1afb480ba8d3b3b7a8439a84f2365ce5c75ac45a79cf07daa091b49235cbe27b
          command:
            - python3
            - -B
            - /contract/consumer-prepare.py
          volumeMounts:
            - name: original
              mountPath: /data/restored
              readOnly: true
            - name: appdata
              mountPath: /appdata
              readOnly: false
            - name: books
              mountPath: /books
              readOnly: false
            - name: tools
              mountPath: /tools
              readOnly: false
            - name: contract
              mountPath: /contract
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
                # Required to preserve the independently qualified foreign-GID SGID directory.
                - FSETID
            runAsUser: 0
            runAsGroup: 568
            runAsNonRoot: false
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 512Mi
        - name: database
          image: docker.io/linuxserver/mariadb:11.8.9@sha256:2e6a148c7f7ac5ff1a18004b5d1fcc1ead4eceb17757453026c8f107e507072e
          command:
            - bash
            - -c
            - set -a; source /tools/database.env; set +a; exec /init >/private/database.log 2>&1
          volumeMounts:
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: control
              mountPath: /control
              readOnly: false
            - name: contract
              mountPath: /contract
              readOnly: true
            - name: original
              mountPath: /original
              readOnly: true
            - name: database
              mountPath: /config
              readOnly: false
            - name: private
              mountPath: /private
              readOnly: false
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 0
            runAsGroup: 568
            runAsNonRoot: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETUID
                - SETGID
                - FOWNER
                - DAC_OVERRIDE
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 1Gi
          restartPolicy: Always
          lifecycle:
            postStart:
              exec:
                command:
                  - bash
                  - -c
                  - bash /contract/consumer-database.sh >/private/database-bootstrap.log 2>&1 &
        - name: application
          image: docker.io/grimmory/grimmory:v3.5.0@sha256:83597bf02da48a8ec4042fd4d4f58b9631f5b131d6dee7d2fcc5cf3f2eec2526
          command:
            - sh
            - /contract/consumer-app.sh
          volumeMounts:
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: control
              mountPath: /control
              readOnly: false
            - name: contract
              mountPath: /contract
              readOnly: true
            - name: appdata
              mountPath: /app/data
              readOnly: false
            - name: books
              mountPath: /books
              readOnly: true
            - name: books
              mountPath: /bookdrop
              subPath: bookdrop
              readOnly: true
            - name: app-tmp
              mountPath: /tmp
            - name: private
              mountPath: /private
              readOnly: false
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
          resources:
            requests:
              cpu: 25m
              memory: 512Mi
            limits:
              memory: 2Gi
          restartPolicy: Always
      containers:
        - name: verify
          image: docker.io/library/python:3.15-alpine@sha256:1afb480ba8d3b3b7a8439a84f2365ce5c75ac45a79cf07daa091b49235cbe27b
          command:
            - python3
            - -B
            - /contract/consumer-verify.py
          volumeMounts:
            - name: control
              mountPath: /control
              readOnly: false
            - name: contract
              mountPath: /contract
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          env:
            - name: BACKEND
              value: nas
      volumes:
        - name: original
          persistentVolumeClaim:
            claimName: grimmory-k8s92-books-original-nas
            readOnly: true
        - name: contract
          configMap:
            name: grimmory-books-consumer-contract
            defaultMode: 292
        - name: tools
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: control
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: private
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: books
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: appdata
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: app-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: database
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
