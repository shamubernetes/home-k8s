# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cs2
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: cs2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      cs2:
        # The live server is managed by Pelican on KubeWings. Keep this
        # release and its PVCs as the rollback path without running a pod.
        replicas: 0
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          fix-perms:
            image:
              repository: busybox
              tag: latest@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
            command:
              - sh
              - -c
              - |
                chown 1000:1000 /home/steam/cs2-dedicated /home/steam/Steam
            securityContext:
              runAsUser: 0
        containers:
          app:
            image:
              repository: joedwards32/cs2
              tag: 4.0.1@sha256:34c093d24a23751fb409ae41dffe88884fb36964b365fcd25a31ec45e88ad8cf
            env:
              - name: CS2_CHEATS
                value: "1"
              - name: CS2_MAXPLAYERS
                value: "20"
            envFrom:
              - secretRef:
                  name: cs2-secret
            securityContext:
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 10m
          agent:
            image:
              repository: ghcr.io/thezoo-house/gamekeeper
              tag: v0.3.1@sha256:102ee2bacd3452a0ab08c9c1e8517fe280e9d7b2baae5992672a91289104ce76
            command:
              - bun
              - --no-install
              - --no-env-file
              - scripts/game-agent.ts
            env:
              GAMEKEEPER_AGENT_PROFILE: cs2
              GAMEKEEPER_AGENT_ROOT: /game/cs2-dedicated
              GAMEKEEPER_AGENT_PORT: "3001"
              GAMEKEEPER_AGENT_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: cs2-gamekeeper
                    key: token
            probes:
              liveness: &agentProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/live
                    port: &agentPort 3001
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                <<: *agentProbes
                spec:
                  httpGet:
                    path: /health/ready
                    port: *agentPort
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/ready
                    port: *agentPort
                  periodSeconds: 2
                  timeoutSeconds: 2
                  failureThreshold: 30
            ports:
              - name: agent
                containerPort: *agentPort
                protocol: TCP
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              readOnlyRootFilesystem: true
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
    defaultPodOptions:
      annotations:
        descheduler.alpha.kubernetes.io/evict: "false"
    service:
      app:
        enabled: false
        controller: cs2
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: "${IPAM_IP_CS2}"
        ports:
          game-tcp:
            primary: true
            enabled: true
            port: 27015
            protocol: TCP
          game-udp:
            enabled: true
            port: 27015
            protocol: UDP
          rcon:
            enabled: true
            port: 27020
            protocol: UDP
    persistence:
      config:
        existingClaim: cs2
        globalMounts:
          - path: /home/steam/cs2-dedicated
        advancedMounts:
          cs2:
            agent:
              - path: /game/cs2-dedicated
      home:
        existingClaim: cs2-home
        globalMounts:
          - path: /home/steam/Steam
      scripts:
        type: configMap
        name: cs2-scripts
        defaultMode: 0755
        globalMounts:
          - path: /home/steam/cs2-dedicated/pre.sh
            subPath: pre.sh
