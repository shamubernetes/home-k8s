# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./kopiur-native-originals.yaml
- ./kopiur-native-original-r2-restore.yaml
- ./kopiur-native-original-nas-restore.yaml
- ./kopiur-online-original.yaml
- ./ocirepository.yaml
- ../../../../templates/volsync
- ./helmrelease.yaml
- ./httproute-envoy.yaml
- ../../../../templates/gatus/guarded
patches:
- target:
    kind: PersistentVolumeClaim
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        kustomize.toolkit.fluxcd.io/prune: disabled
configMapGenerator:
- name: calibre-web-automated-kopiur-original-native
  files:
  - original-native.py
  options:
    annotations:
      reloader.stakater.com/ignore: "true"
- name: calibre-web-automated-kopiur-startup
  files:
  - startup-hold.py=kopiur-startup-hold.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
