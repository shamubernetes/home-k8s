# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./ocirepository.yaml
- ../../../../templates/volsync
- ./externalsecret.yaml
- ./helmrelease.yaml
- ./httproute-envoy.yaml
- ../../../../templates/gatus/guarded
- ./externalsecret-kopiur.yaml
- ./kopiur-repositories.yaml
- ./kopiur-policy.yaml
configMapGenerator:
- name: romm-configmap
  files:
  - config.yml=./resources/config.yml
- name: romm-kopiur-native
  files:
  - capture.sh
  options:
    annotations:
      reloader.stakater.com/ignore: "true"
generatorOptions:
  disableNameSuffixHash: true
components:
- ../../../../components/kopiur-postgres
