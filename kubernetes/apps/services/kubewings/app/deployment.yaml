# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/apps/v1/deployment.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubewings
  namespace: services
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubewings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubewings
        app.kubernetes.io/managed-by: kubewings
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: kubewings
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: ghcr.io/thezoo-house/kubewings@sha256:295601a3f3f067ac1e8e1b5de95acbe4292ad2bf8abb50bbcb0262c7acb13bdf
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: KUBEWINGS_LISTEN
          value: :8080
        - name: KUBEWINGS_PANEL_URL
          value: http://pelican.services.svc.cluster.local
        - name: KUBEWINGS_PANEL_ORIGIN
          value: https://pelican.${HOME_DOMAIN}
        - name: KUBEWINGS_RUNTIME_NAMESPACE
          value: kubewings-mvp
        - name: KUBEWINGS_GATEWAY_NAMESPACE
          value: services
        - name: KUBEWINGS_AGENT_IMAGE
          value: ghcr.io/thezoo-house/kubewings@sha256:295601a3f3f067ac1e8e1b5de95acbe4292ad2bf8abb50bbcb0262c7acb13bdf
        - name: KUBEWINGS_GAMEKEEPER_SERVER_UUID
          value: 82805dd0-125f-4d7d-a0b0-7c8dcaf615f1
        - name: KUBEWINGS_GAMEKEEPER_AGENT_IMAGE
          value: ghcr.io/thezoo-house/gamekeeper@sha256:102ee2bacd3452a0ab08c9c1e8517fe280e9d7b2baae5992672a91289104ce76
        - name: KUBEWINGS_GAMEKEEPER_AGENT_SECRET
          value: cs2-gamekeeper
        - name: KUBEWINGS_STORAGE_CLASS
          value: ceph-block
        - name: KUBEWINGS_SERVICE_TYPE
          value: LoadBalancer
        - name: KUBEWINGS_MIN_STORAGE_MIB
          value: "1024"
        - name: KUBEWINGS_MAX_FILE_READ_BYTES
          value: "4194304"
        - name: KUBEWINGS_MAX_FILE_WRITE_BYTES
          value: "16777216"
        envFrom:
        - secretRef:
            name: kubewings-node-secret
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
