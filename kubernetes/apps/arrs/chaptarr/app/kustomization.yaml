# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ./kopiur-native-originals.yaml
- ./kopiur-native-original-r2-restore.yaml
- ./kopiur-native-original-nas-restore.yaml
- ./kopiur-online-original.yaml
- ./ocirepository.yaml
- ./externalsecret.yaml
- ./externalsecret-oidc.yaml
- ../../../../templates/volsync
- ./helmrelease.yaml
- ./httproute-envoy-api.yaml
- ./httproute-envoy-browser.yaml
- ./securitypolicy-oidc.yaml
- ./service-envoy-dns.yaml
- ../../../../templates/gatus/guarded
components:
- ../../../../components/kopiur-sqlite-originals
configMapGenerator:
- name: chaptarr-kopiur-original-native
  files:
  - original-native.py
  - original-native.sh
  - fingerprint.sql
  options:
    annotations:
      reloader.stakater.com/ignore: "true"
- name: chaptarr-kopiur-startup
  files:
  - startup-hold.sh=kopiur-startup-hold.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
