# Native original recovery passed before enabling daily fresh production capture.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: victoria-metrics-native-daily
spec:
  policyRef:
    name: victoria-metrics-native
  failedJobsHistoryLimit: 3
  schedule:
    suspend: false
    cron: "47 1 * * *"
    timezone: America/New_York
    jitter: 0s
    runOnCreate: false
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 3600
