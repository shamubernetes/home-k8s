# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app changedetection
  namespace: "${KS_NAMESPACE}"
spec:
  targetNamespace: &namespace services
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
  - name: external-secrets-secret-store
  - name: kopiur
  - name: rook-ceph-cluster
  - name: snapshot-controller
  path: ./kubernetes/apps/services/changedetection/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: "${KS_GIT_REPO_NAME}"
  wait: false
  # SnapshotReplication readiness is monitored separately because schedule-only
  # updates can leave observedGeneration stale on otherwise healthy resources.
  healthChecks:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    name: changedetection-kopiur-nas
    namespace: services
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    name: changedetection-kopiur-r2
    namespace: services
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Repository
    name: changedetection-nas-smb
    namespace: services
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Repository
    name: changedetection-r2
    namespace: services
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: SnapshotPolicy
    name: changedetection
    namespace: services
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: SnapshotSchedule
    name: changedetection-daily
    namespace: services
  interval: "${KS_INTERVAL}"
  retryInterval: "${KS_RETRY_INTERVAL}"
  timeout: "${KS_TIMEOUT}"
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      GATUS_APP_NAME: ChangeDetection
      GATUS_INTERNAL_APP: changedetection-app
      GATUS_INTERNAL_PORT: "5000"
      VOLSYNC_CAPACITY: 5Gi
