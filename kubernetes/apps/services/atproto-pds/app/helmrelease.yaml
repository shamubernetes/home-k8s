# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app atproto-pds
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: atproto-pds
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
  - name: rook-ceph-cluster
    namespace: rook-ceph
  - name: volsync
    namespace: volsync-system
  values:
    controllers:
      atproto-pds:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/bluesky-social/pds
              tag: 0.4@sha256:b686e3252d17d33af1912273ca3fef3632d1620dd52a4cbb0fd62ba888ac402a
            env:
              LOG_ENABLED: "true"
              LOG_LEVEL: info
              PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
              PDS_BLOB_UPLOAD_LIMIT: "52428800"
              PDS_BSKY_APP_VIEW_DID: did:web:api.bsky.app
              PDS_BSKY_APP_VIEW_URL: https://api.bsky.app
              PDS_CONTACT_EMAIL_ADDRESS: kilian@kil.dev
              PDS_CRAWLERS: https://bsky.network
              PDS_DATA_DIRECTORY: /pds
              PDS_DID_PLC_URL: https://plc.directory
              PDS_EMAIL_FROM_ADDRESS: atproto@kiliantyler.com
              PDS_EMAIL_SMTP_URL: smtp://smtp-relay.network.svc.cluster.local:25
              PDS_HOSTNAME: pds.kiliantyler.com
              PDS_INVITE_REQUIRED: "true"
              PDS_PORT: &port 3000
              PDS_RATE_LIMITS_ENABLED: "true"
              PDS_REPORT_SERVICE_DID: did:plc:ar7c4by46qjdydhdevvrndac
              PDS_REPORT_SERVICE_URL: https://mod.bsky.app
              PDS_SERVICE_HANDLE_DOMAINS: ".kiliantyler.com"
              TZ: ${TIMEZONE}
            envFrom:
            - secretRef:
                name: atproto-pds-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /xrpc/_health
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /xrpc/_health
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 4
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: *app
        globalMounts:
        - path: /pds
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
