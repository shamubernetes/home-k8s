# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cowbell-envoy
  annotations:
    homepage.shamubernetes.com/enabled: "true"
    homepage.shamubernetes.com/name: "Cowbell"
    homepage.shamubernetes.com/description: "Report media issues"
    homepage.shamubernetes.com/group: "Tools"
    homepage.shamubernetes.com/order: "100"
    homepage.shamubernetes.com/favorite: "false"
spec:
  parentRefs:
  - name: envoy-external
    namespace: network
    sectionName: https
  hostnames:
  - "issue.${HOME_DOMAIN}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: cowbell-cowbell
      port: 80
