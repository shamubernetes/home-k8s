apiVersion: batch/v1
kind: Job
metadata:
  name: legacy-plan-cleanup
  namespace: system-upgrade
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: tuppr
      restartPolicy: Never
      containers:
      - name: cleanup
        image: docker.io/bitnami/kubectl:latest@sha256:c12989b8ecaecbd9d9a49828bfdb727ef222a6747a8984701e2a3cdf9c1cb168
        command:
        - /bin/sh
        - -c
        - |
          set -eu

          kubectl delete plan.upgrade.cattle.io talos kubernetes --ignore-not-found=true

          for label in plan.upgrade.cattle.io/talos plan.upgrade.cattle.io/kubernetes; do
            nodes="$(kubectl get nodes -l "$${label}" -o name)"
            for node in $${nodes}; do
              ready="$(kubectl get "$${node}" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')"
              if [ "$${ready}" != "True" ]; then
                echo "Skipping $${node}: node is not Ready" >&2
                continue
              fi

              unschedulable="$(kubectl get "$${node}" -o jsonpath='{.spec.unschedulable}')"
              if [ "$${unschedulable}" = "true" ]; then
                kubectl uncordon "$${node}"
              fi
              kubectl label "$${node}" "$${label}-"
            done
          done
