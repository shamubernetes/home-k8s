# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: rook-ceph-tools
        patch: |-
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: rook-ceph-tools
            annotations:
              reloader.stakater.com/auto: "true"
          spec:
            template:
              metadata:
                annotations:
                  rook.home.arpa/cephx-key-generation: "2"
  dependsOn:
  - name: rook-ceph-operator
    namespace: rook-ceph
  - name: snapshot-controller
    namespace: volsync-system
  values:
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v20.2.4@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9
    monitoring:
      enabled: true
      createPrometheusRules: true
      prometheusRuleOverrides:
        CephNodeDiskspaceWarning:
          expr: |
            (
              (
                predict_linear(
                  max by (instance, device, mountpoint) (
                    node_filesystem_free_bytes{device=~"/.*",mountpoint="/var"}
                  )[2d:]
                  , 3600 * 24 * 5
                )
                /
                max by (instance, device, mountpoint) (
                  node_filesystem_size_bytes{device=~"/.*",mountpoint="/var"}
                )
              ) < 0.12
              and on(instance, device, mountpoint)
              max by (instance, device, mountpoint) (
                node_filesystem_free_bytes{device=~"/.*",mountpoint="/var"}
              ) < 40 * 1024 * 1024 * 1024
            )
            * on(instance) group_left(nodename)
            max by (instance, nodename) (node_uname_info)
        CephNodeNetworkPacketDrops:
          expr: |
            (
              rate(node_network_receive_drop_total{device!="lo"}[5m]) +
              rate(node_network_transmit_drop_total{device!="lo"}[5m])
            ) / (
              rate(node_network_receive_packets_total{device!="lo"}[5m]) +
              rate(node_network_transmit_packets_total{device!="lo"}[5m])
            ) >= 0.01 and (
              rate(node_network_receive_drop_total{device!="lo"}[5m]) +
              rate(node_network_transmit_drop_total{device!="lo"}[5m])
            ) >= 50
          for: 5m
          annotations:
            description: "Node {{ $labels.instance }} experiences sustained packet drop > 1% or > 50 packets/s on interface {{ $labels.device }}."
            summary: "One or more NICs reports sustained packet drops"
        CephPoolGrowthWarning:
          expr: |
            (
              (
                predict_linear(
                  (
                    max by (pool_id) (
                      ceph_pool_percent_used
                    )
                  )[2d:],
                  3600 * 24 * 5
                )
                * on (pool_id) group_right ()
                max by (pool_id, cluster, name, application, description, compression_mode, type) (
                  ceph_pool_metadata
                )
              ) >= 0.95
            )
            and on(pool_id)
            (
              min_over_time(
                (
                  max by (pool_id) (
                    ceph_pool_percent_used
                  )
                )[10m:]
              ) > 0.01
            )
    toolbox:
      enabled: true
    configOverride: |
      [osd]
      osd_scrub_begin_hour = 0
      osd_scrub_end_hour = 23
      osd_scrub_sleep = 0.1
      osd_scrub_priority = 1
      osd_max_scrubs = 1
      osd_scrub_load_threshold = 4.0
      osd_scrub_during_recovery = false
      osd_deep_scrub_interval = 604800
      osd_deep_scrub_randomize_ratio = 0.50
      osd_scrub_interval_randomize_ratio = 0.50
      ; end

    cephClusterSpec:
      security:
        cephx:
          # CSI attach is not yet compatible with AES256K in the deployed Ceph-CSI path.
          # Keep daemon and mirror identities on AES256K while CSI rotates back to AES.
          allowedCiphers:
          - aes256k
          - aes
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          rbdMirrorPeer:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
            keyType: aes256k
          csi:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 3
            keyType: aes
            keepPriorKeyCountMax: 1
      cephConfig:
        global:
          bdev_enable_discard: "true"
          bdev_async_discard_threads: "1"
          osd_class_update_on_start: "false"
        mgr:
          # Bound Ceph v20.2.2's multi-megabyte Rook PodList recent-log ring.
          # Remove after the Tentacle fixes are included in a stable release.
          log_max_recent: "100"
        osd:
          osd_scrub_begin_hour: "0"
          osd_scrub_end_hour: "23"
          osd_scrub_sleep: "0.1"
          osd_scrub_priority: "1"
          osd_max_scrubs: "1"
          osd_scrub_load_threshold: "4.0"
          osd_scrub_during_recovery: "false"
          osd_deep_scrub_interval: "604800"
          osd_deep_scrub_randomize_ratio: "0.50"
          osd_scrub_interval_randomize_ratio: "0.50"
      healthCheck:
        livenessProbe:
          mon:
            probe:
              timeoutSeconds: 15
              failureThreshold: 5
          mds:
            probe:
              timeoutSeconds: 30
              failureThreshold: 5
      crashCollector:
        disable: false
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      mgr:
        modules:
        - name: diskprediction_local
          enabled: true
        - name: insights
          enabled: true
        - name: pg_autoscaler
          enabled: true
        - name: rook
          # Ceph tracker 79106: Tentacle records a crash every Prometheus scrape
          # when the Rook orchestrator module lacks node_proxy_fullreport.
          enabled: false
      network:
        provider: host
        connections:
          requireMsgr2: true
      storage:
        useAllNodes: true
        useAllDevices: true
        deviceFilter: sda
        config:
          osdsPerDevice: "1"
      placement:
        mgr: &placement
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
        mon: *placement
      resources:
        mgr:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 3Gi
        mon:
          requests:
            cpu: 50m
            memory: 1Gi
          limits:
            memory: 3Gi
        osd:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 6Gi
        mgr-sidecar:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
    cephBlockPools:
    - name: ceph-blockpool
      spec:
        failureDomain: host
        replicated:
          size: 3
      storageClass:
        enabled: true
        name: ceph-block
        isDefault: true
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        parameters:
          imageFormat: "2"
          imageFeatures: layering
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
          csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
          csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems:
    - name: &cephFileSystemName ceph-filesystem
      spec:
        metadataPool:
          replicated:
            size: 3
        dataPools:
        - failureDomain: host
          replicated:
            size: 3
          name: data0
        metadataServer:
          activeCount: 1
          activeStandby: true
          priorityClassName: system-cluster-critical
          placement:
            topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ceph-mds
                  app.kubernetes.io/part-of: *cephFileSystemName
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 4Gi
      storageClass:
        enabled: true
        isDefault: false
        name: ceph-filesystem
        pool: data0
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        parameters:
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
          csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
          csi.storage.k8s.io/fstype: ext4
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete
    cephObjectStores:
    - name: ceph-objectstore
      spec:
        metadataPool:
          failureDomain: host
          replicated:
            size: 3
        dataPool:
          failureDomain: host
          erasureCoded:
            dataChunks: 2
            codingChunks: 1
        preservePoolsOnDelete: true
        gateway:
          hostNetwork: false
          port: 80
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 2Gi
          instances: 2
          priorityClassName: system-cluster-critical
        healthCheck:
          bucket:
            interval: 60s
      storageClass:
        enabled: true
        name: ceph-bucket
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        parameters:
          region: us-east-1
