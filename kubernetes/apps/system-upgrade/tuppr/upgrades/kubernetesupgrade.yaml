# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/kubernetesupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: datasource=github-releases depName=siderolabs/kubelet
    version: v1.37.2
  healthChecks:
  - apiVersion: kopiur.home-operations.com/v1alpha1
    kind: Snapshot
    description: No native capture or snapshot operation in progress
    expr: |-
      has(status.phase) && status.phase in ['Succeeded', 'Failed', 'Discovered', 'Unchanged']
  - apiVersion: batch/v1
    kind: Job
    labelSelector:
      matchLabels:
        app.kubernetes.io/managed-by: kopiur
    description: No active or retrying native mover, replication, or hook Job
    expr: |-
      (has(status.conditions) && status.conditions.exists(c, c.type in ['Complete', 'Failed'] && c.status == 'True')) ||
      (object.metadata.name.endsWith('-discovery') &&
        (!has(object.spec.template.spec.volumes) ||
          object.spec.template.spec.volumes.all(v, !has(v.persistentVolumeClaim))))
  - apiVersion: ceph.rook.io/v1
    kind: CephCluster
    expr: |-
      status.ceph.health in ['HEALTH_OK']
  - apiVersion: comcast.github.io/v1
    kind: KuberhealthyState
    name: plex-no-streams
    namespace: observability
    description: No active Plex streams
    expr: |-
      object.spec.OK == true
